<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>19款车型图片验证</title>
<style>
body{background:#0f0f1e;color:#eee;font-family:sans-serif;margin:0;padding:20px}
h1{text-align:center;margin-bottom:10px}
.sub{text-align:center;color:#888;margin-bottom:20px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:15px}
.car-card{background:#16213e;border:2px solid #333;border-radius:10px;padding:10px;overflow:hidden}
.car-card img{width:100%;height:200px;object-fit:contain;background:#000;border-radius:6px;display:block}
.car-name{color:#e94560;font-weight:bold;margin-top:8px;font-size:14px}
.car-info{color:#888;font-size:11px;margin-top:4px}
.controls{display:flex;gap:5px;margin-top:8px;justify-content:center}
.btn{padding:4px 10px;border:none;border-radius:4px;cursor:pointer;font-size:11px;color:#fff}
.btn.pass{background:#2ecc71}
.btn.fail{background:#e94560}
.status{padding:3px 8px;border-radius:4px;font-size:11px;text-align:center;margin-top:5px}
.status.pending{background:#444}
.status.pass{background:#2ecc71}
.status.fail{background:#e94560}
</style></head><body>
<h1>19款车型图片验证</h1>
<div class="sub">判断标准：正侧视(90°) + 纯净背景(影棚) | 点击通过/不合格按钮标记</div>
<div class="grid" id="root"></div>
<div id="summary" style="margin-top:20px;text-align:center;padding:15px;background:#16213e;border-radius:8px"></div>

<script>
const CARS = [
  ["rolls-royce","phantom","Rolls-Royce Phantom"],
  ["rolls-royce","ghost","Rolls-Royce Ghost"],
  ["rolls-royce","cullinan","Rolls-Royce Cullinan"],
  ["rolls-royce","wraith","Rolls-Royce Wraith"],
  ["bentley","continental-gt","Bentley Continental GT"],
  ["bentley","continental-gtc","Bentley Continental GTC"],
  ["bentley","flying-spur","Bentley Flying Spur"],
  ["bentley","bentayga","Bentley Bentayga"],
  ["bugatti","chiron","Bugatti Chiron"],
  ["bugatti","veyron","Bugatti Veyron"],
  ["bugatti","divo","Bugatti Divo"],
  ["porsche","911","Porsche 911"],
  ["porsche","taycan","Porsche Taycan"],
  ["porsche","panamera","Porsche Panamera"],
  ["porsche","cayenne","Porsche Cayenne"],
  ["porsche","macan","Porsche Macan"],
  ["ferrari","sf90","Ferrari SF90"],
  ["ferrari","f8-tributo","Ferrari F8 Tributo"],
  ["ferrari","roma","Ferrari Roma"]
];

const results = {};

async function build() {
  const root = document.getElementById('root');
  for(const [brand, model, name] of CARS) {
    const card = document.createElement('div');
    card.className = 'car-card';

    const img = document.createElement('img');
    img.src = `/brands/${brand}/${model}.jpg?t=${Date.now()}`;
    img.alt = name;
    img.onerror = () => {
      img.style.display = 'none';
      const err = document.createElement('div');
      err.style.cssText = 'color:#e94560;text-align:center;padding:40px;';
      err.textContent = '图片加载失败';
      card.insertBefore(err, card.firstChild);
    };
    card.appendChild(img);

    const carName = document.createElement('div');
    carName.className = 'car-name';
    carName.textContent = name;
    card.appendChild(carName);

    const info = document.createElement('div');
    info.className = 'car-info';
    info.textContent = `${brand}/${model}.jpg`;
    card.appendChild(info);

    const status = document.createElement('div');
    status.className = 'status pending';
    status.textContent = '待验证';
    card.appendChild(status);

    const controls = document.createElement('div');
    controls.className = 'controls';

    const btnPass = document.createElement('button');
    btnPass.className = 'btn pass';
    btnPass.textContent = '✓ 合格';
    btnPass.onclick = () => {
      status.className = 'status pass';
      status.textContent = '✓ 合格 - 正侧视+纯净背景';
      results[`${brand}/${model}`] = 'pass';
      updateSummary();
    };
    controls.appendChild(btnPass);

    const btnFail = document.createElement('button');
    btnFail.className = 'btn fail';
    btnFail.textContent = '✗ 不合格';
    btnFail.onclick = () => {
      status.className = 'status fail';
      status.textContent = '✗ 不合格';
      results[`${brand}/${model}`] = 'fail';
      updateSummary();
    };
    controls.appendChild(btnFail);

    card.appendChild(controls);
    root.appendChild(card);
  }
}

function updateSummary() {
  const pass = Object.values(results).filter(v => v === 'pass').length;
  const fail = Object.values(results).filter(v => v === 'fail').length;
  const pending = 19 - pass - fail;
  document.getElementById('summary').innerHTML =
    `<strong>汇总：${pass} 合格 / ${fail} 不合格 / ${pending} 待验证</strong>` +
    (fail > 0 ? `<br>不合格车型：${Object.entries(results).filter(([,v]) => v==='fail').map(([k]) => k).join(', ')}` : '');
}

build();
</script>
</body></html>
