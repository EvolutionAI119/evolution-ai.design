<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>10款车新候选验证</title>
<style>
body{background:#0f0f1e;color:#eee;font-family:sans-serif;margin:0;padding:20px}
h1{text-align:center;margin-bottom:5px}
.sub{text-align:center;color:#888;margin-bottom:20px;font-size:13px}
.car-section{background:#16213e;border-radius:10px;padding:15px;margin-bottom:20px}
.car-title{color:#e94560;font-weight:bold;font-size:16px;margin-bottom:10px}
.cand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:10px}
.cand-card{background:#0f0f1e;border:2px solid #333;border-radius:8px;overflow:hidden}
.cand-card.final{border-color:#e94560}
.cand-card img{width:100%;height:200px;object-fit:contain;background:#000;display:block;cursor:pointer}
.cand-label{padding:5px;font-size:10px;color:#888;text-align:center}
.cand-label .final{color:#e94560;font-weight:bold}
</style></head><body>
<h1>10款车新候选图视觉验证</h1>
<div class="sub">红框=子代理选定final | 点击放大 | 标准：正侧视+纯净背景+车型正确+无水印+非改装</div>
<div id="root"></div>
<script>

, {"brand": "bugatti", "model": "veyron", "name": "Bugatti Veyron", "cands": [{"url": "/_fix11_preview/bugatti_veyron.jpg", "file": "bugatti_veyron.jpg", "is_final": true}, {"url": "/_fix11_preview/bugatti_veyron_cand3.jpg", "file": "bugatti_veyron_cand3.jpg", "is_final": false}]}, {"brand": "bugatti", "model": "divo", "name": "Bugatti Divo", "cands": [{"url": "/_fix11_preview/bugatti_divo.jpg", "file": "bugatti_divo.jpg", "is_final": true}, {"url": "/_fix11_preview/bugatti_divo_cand1.jpg", "file": "bugatti_divo_cand1.jpg", "is_final": false}, {"url": "/_fix11_preview/bugatti_divo_cand2.jpg", "file": "bugatti_divo_cand2.jpg", "is_final": false}, {"url": "/_fix11_preview/bugatti_divo_cand3.jpg", "file": "bugatti_divo_cand3.jpg", "is_final": false}]}, {"brand": "porsche", "model": "cayenne", "name": "Porsche Cayenne", "cands": [{"url": "/_fix11_preview/porsche_cayenne.jpg", "file": "porsche_cayenne.jpg", "is_final": true}, {"url": "/_fix11_preview/porsche_cayenne_cand1.jpg", "file": "porsche_cayenne_cand1.jpg", "is_final": false}, {"url": "/_fix11_preview/porsche_cayenne_cand2.jpg", "file": "porsche_cayenne_cand2.jpg", "is_final": false}, {"url": "/_fix11_preview/porsche_cayenne_cand3.jpg", "file": "porsche_cayenne_cand3.jpg", "is_final": false}]}, {"brand": "porsche", "model": "macan", "name": "Porsche Macan", "cands": [{"url": "/_fix11_preview/porsche_macan.jpg", "file": "porsche_macan.jpg", "is_final": true}, {"url": "/_fix11_preview/porsche_macan_cand1.jpg", "file": "porsche_macan_cand1.jpg", "is_final": false}, {"url": "/_fix11_preview/porsche_macan_cand3.jpg", "file": "porsche_macan_cand3.jpg", "is_final": false}]}, {"brand": "ferrari", "model": "sf90", "name": "Ferrari SF90", "cands": [{"url": "/_fix11_preview/ferrari_sf90.jpg", "file": "ferrari_sf90.jpg", "is_final": true}, {"url": "/_fix11_preview/ferrari_sf90_cand8.jpg", "file": "ferrari_sf90_cand8.jpg", "is_final": false}, {"url": "/_fix11_preview/ferrari_sf90_cand9.jpg", "file": "ferrari_sf90_cand9.jpg", "is_final": false}]}, {"brand": "ferrari", "model": "f8-tributo", "name": "Ferrari F8 Tributo", "cands": [{"url": "/_fix11_preview/ferrari_f8-tributo.jpg", "file": "ferrari_f8-tributo.jpg", "is_final": true}, {"url": "/_fix11_preview/ferrari_f8-tributo_cand1.jpg", "file": "ferrari_f8-tributo_cand1.jpg", "is_final": false}, {"url": "/_fix11_preview/ferrari_f8-tributo_cand2.jpg", "file": "ferrari_f8-tributo_cand2.jpg", "is_final": false}, {"url": "/_fix11_preview/ferrari_f8-tributo_cand3.jpg", "file": "ferrari_f8-tributo_cand3.jpg", "is_final": false}]}];
const root=document.getElementById('root');
DATA.forEach(car=>{
  const sec=document.createElement('div');sec.className='car-section';
  const t=document.createElement('div');t.className='car-title';
  t.textContent=car.name+' ('+car.cands.length+'张)';sec.appendChild(t);
  const g=document.createElement('div');g.className='cand-grid';
  car.cands.forEach(c=>{
    const card=document.createElement('div');
    card.className='cand-card'+(c.is_final?' final':'');
    const img=document.createElement('img');img.src=c.url;img.loading='lazy';
    img.onclick=()=>window.open(c.url,'_blank');
    img.onerror=()=>{card.style.opacity='0.3'};
    card.appendChild(img);
    const l=document.createElement('div');l.className='cand-label';
    l.innerHTML=c.is_final?'<span class="final">★ FINAL</span> '+c.file:c.file;
    card.appendChild(l);g.appendChild(card);
  });
  sec.appendChild(g);root.appendChild(sec);
});
</script></body></html>
