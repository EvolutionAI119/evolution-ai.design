# =====================================================================
# EVOLUTION AI - Docker Compose（Phase 5a 生产化改造）
# 架构：nginx(静态前端+反向代理) → backend(FastAPI) → PostgreSQL + Redis
#
# 快速启动：
#   1. 准备密钥（二选一）：
#        - 已有 backend/.env（真实 SECRET_KEY 等），直接复用
#        - 并在项目根创建 .env 设置 compose 专用变量：
#            POSTGRES_PASSWORD=<随机串>
#            REDIS_PASSWORD=<随机串>
#   2. npm run build 生成 dist/（nginx 静态前端）
#   3. docker compose up -d --build
#   4. 首次建表（PG 全新库）：
#        docker compose exec backend bash -c "cd /app/backend && alembic upgrade head"
#   5. SQLite 老数据一次性迁移（可选，宿主机执行）：
#        cd backend && python scripts/migrate_sqlite_to_pg.py --help
#
# 生产 TLS（HTTPS + HSTS）overlay：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# LLM 推理服务独立编排：docker-compose.llm.yml（不在此文件维护）
# =====================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evolution-backend
    # 覆盖镜像默认 entrypoint（旧脚本会顺带启动 Streamlit DEMO 前端）：
    # 生产形态下前端静态资源由 nginx 分发，容器内仅运行 FastAPI
    entrypoint:
      - bash
      - -c
      - |
        mkdir -p /app/data/outputs /app/logs
        exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file:
      - backend/.env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      # 容器网络内服务发现地址（覆盖 env_file 中的本地开发默认值）
      DATABASE_URL: postgresql+psycopg://evolution:${POSTGRES_PASSWORD:-please-change-me}@postgres:5432/evolution
      SESSION_USE_REDIS: "true"
      SESSION_REDIS_URL: redis://:${REDIS_PASSWORD:-please-change-me}@redis:6379/0
      DATA_DIR: /app/data
      MODELS_DIR: /app/data/models
      REPORTS_DIR: /app/data/reports
      EXPORTS_DIR: /app/data/exports
      TRAINING_CHECKPOINT_DIR: /app/data/training
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [evolution-net]

  postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-please-change-me}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [evolution-net]
    # 安全默认不对外暴露 5432；如需宿主机调试（如运行数据迁移脚本）再放开：
    # ports:
    #   - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    # requirepass：会话数据服务必须口令保护（Phase 5a 审计项）
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-please-change-me}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a '${REDIS_PASSWORD:-please-change-me}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [evolution-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: evolution-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # 前端静态资源：宿主机构建产物（需先 npm run build）
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [evolution-net]

volumes:
  backend-data:
    driver: local
  backend-logs:
    driver: local
  pg-data:
    driver: local
  redis-data:
    driver: local

networks:
  evolution-net:
    driver: bridge
