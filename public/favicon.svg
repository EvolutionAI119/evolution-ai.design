<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>
  <!-- 品牌深底（与站点 #0a0a0f 一致） -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="2"/>
  <!-- E 字标：三条渐变横杠（中杠收短，呼应曲面流线） -->
  <g fill="url(#g)">
    <rect x="18" y="16" width="28" height="8" rx="4"/>
    <rect x="18" y="28" width="20" height="8" rx="4"/>
    <rect x="18" y="40" width="28" height="8" rx="4"/>
  </g>
</svg>
