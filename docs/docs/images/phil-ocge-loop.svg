<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34D399"/>
    </marker>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34D399" stop-opacity=".22"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="958" height="468" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">哲学根基：观察 · 约束 · 生成 · 演化（Observe–Constrain–Generate–Evolve）</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">设计认知闭环</text>

  <circle cx="470" cy="262" r="128" fill="url(#core)"/>
  <circle cx="470" cy="262" r="118" fill="none" stroke="#1E2A3A" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- 中心 -->
  <text x="470" y="252" fill="#34D399" font-size="17" font-weight="700" text-anchor="middle">设计认知闭环</text>
  <text x="470" y="276" fill="#94A3B8" font-size="11.5" text-anchor="middle">每轮迭代产出一版</text>
  <text x="470" y="293" fill="#94A3B8" font-size="11.5" text-anchor="middle">更优的合法方案</text>

  <!-- 环上四节点（顺时针） -->
  <!-- 观察：上 -->
  <g>
    <rect x="390" y="86" width="160" height="74" rx="12" fill="#0E1E2E" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="470" y="114" fill="#38BDF8" font-size="15" font-weight="700" text-anchor="middle">① 观察 Observe</text>
    <text x="470" y="136" fill="#94A3B8" font-size="11" text-anchor="middle">趋势 / 品牌 / 工程 / 用户</text>
    <text x="470" y="151" fill="#94A3B8" font-size="11" text-anchor="middle">多源信息进入设计视野</text>
  </g>
  <!-- 约束：右 -->
  <g>
    <rect x="620" y="222" width="170" height="80" rx="12" fill="#2A1A0E" stroke="#FBBF24" stroke-width="1.4"/>
    <text x="705" y="250" fill="#FBBF24" font-size="15" font-weight="700" text-anchor="middle">② 约束 Constrain</text>
    <text x="705" y="272" fill="#94A3B8" font-size="11" text-anchor="middle">硬点 / 法规 / 比例 / 制造</text>
    <text x="705" y="287" fill="#94A3B8" font-size="11" text-anchor="middle">把观察蒸馏为可计算边界</text>
  </g>
  <!-- 生成：下 -->
  <g>
    <rect x="390" y="360" width="160" height="74" rx="12" fill="#0F241C" stroke="#34D399" stroke-width="1.4"/>
    <text x="470" y="388" fill="#34D399" font-size="15" font-weight="700" text-anchor="middle">③ 生成 Generate</text>
    <text x="470" y="410" fill="#94A3B8" font-size="11" text-anchor="middle">NURBS 曲面 / 变体方案</text>
    <text x="470" y="425" fill="#94A3B8" font-size="11" text-anchor="middle">在约束内批量产出候选</text>
  </g>
  <!-- 演化：左 -->
  <g>
    <rect x="150" y="222" width="170" height="80" rx="12" fill="#1A1230" stroke="#A78BFA" stroke-width="1.4"/>
    <text x="235" y="250" fill="#A78BFA" font-size="15" font-weight="700" text-anchor="middle">④ 演化 Evolve</text>
    <text x="235" y="272" fill="#94A3B8" font-size="11" text-anchor="middle">质量评估 / 贝叶斯优选</text>
    <text x="235" y="287" fill="#94A3B8" font-size="11" text-anchor="middle">反哺下一轮观察与约束</text>
  </g>

  <!-- 顺时针箭弧 -->
  <path d="M556 128 A 128 128 0 0 1 636 214" fill="none" stroke="#34D399" stroke-width="2.2" marker-end="url(#ar3)" opacity=".85"/>
  <path d="M660 312 A 128 128 0 0 1 560 384" fill="none" stroke="#34D399" stroke-width="2.2" marker-end="url(#ar3)" opacity=".85"/>
  <path d="M382 386 A 128 128 0 0 1 284 314" fill="none" stroke="#34D399" stroke-width="2.2" marker-end="url(#ar3)" opacity=".85"/>
  <path d="M278 216 A 128 128 0 0 1 380 122" fill="none" stroke="#34D399" stroke-width="2.2" marker-end="url(#ar3)" opacity=".85"/>

  <!-- 右侧：平台映射 -->
  <g>
    <rect x="810" y="86" width="126" height="348" rx="12" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="873" y="112" fill="#E2E8F0" font-size="12.5" font-weight="700" text-anchor="middle">平台映射</text>
    <g font-size="11" fill="#94A3B8">
      <rect x="822" y="126" width="102" height="56" rx="8" fill="#0E1E2E"/><text x="873" y="148" fill="#7DD3FC" text-anchor="middle">品牌知识库</text><text x="873" y="164" fill="#64748B" text-anchor="middle">19 车型指标</text>
      <rect x="822" y="196" width="102" height="56" rx="8" fill="#2A1A0E"/><text x="873" y="218" fill="#FCD34D" text-anchor="middle">参数校验器</text><text x="873" y="234" fill="#64748B" text-anchor="middle">法规/比例</text>
      <rect x="822" y="266" width="102" height="56" rx="8" fill="#0F241C"/><text x="873" y="288" fill="#6EE7B7" text-anchor="middle">生成管线</text><text x="873" y="304" fill="#64748B" text-anchor="middle">NURBS 算法层</text>
      <rect x="822" y="336" width="102" height="56" rx="8" fill="#1A1230"/><text x="873" y="358" fill="#C4B5FD" text-anchor="middle">贝叶斯引擎</text><text x="873" y="374" fill="#64748B" text-anchor="middle">评分→建议</text>
    </g>
  </g>

  <text x="40" y="452" fill="#64748B" font-size="11.5">读法：四环节并非线性流水线，而是一个认知循环——「演化」环节产出的质量洞察会重新定义下一轮的「观察」与「约束」，循环不可逆地指向更优解。</text>
</svg>
