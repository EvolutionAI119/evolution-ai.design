<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34D399"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="538" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">平台技术架构总览（四层一通道）</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">EVOLUTION AI · System Architecture</text>

  <!-- 前端层 -->
  <g>
    <rect x="40" y="62" width="700" height="88" rx="12" fill="#0E1E2E" stroke="#38BDF8" stroke-width="1.3"/>
    <text x="64" y="90" fill="#7DD3FC" font-size="14" font-weight="700">前端层 · Vue 3 SPA</text>
    <text x="716" y="90" fill="#64748B" font-size="10.5" text-anchor="end">Vite / Hash 路由</text>
    <g font-size="11.5" fill="#94A3B8">
      <rect x="64" y="104" width="120" height="32" rx="8" fill="#12293D"/><text x="124" y="124" text-anchor="middle">10 视图页面</text>
      <rect x="194" y="104" width="120" height="32" rx="8" fill="#12293D"/><text x="254" y="124" text-anchor="middle">Three.js 3D</text>
      <rect x="324" y="104" width="120" height="32" rx="8" fill="#12293D"/><text x="384" y="124" text-anchor="middle">Pinia 状态</text>
      <rect x="454" y="104" width="120" height="32" rx="8" fill="#12293D"/><text x="514" y="124" text-anchor="middle">Element Plus</text>
      <rect x="584" y="104" width="132" height="32" rx="8" fill="#12293D"/><text x="650" y="124" text-anchor="middle">i18n 中英双语</text>
    </g>
  </g>

  <!-- 后端层 -->
  <g>
    <rect x="40" y="168" width="700" height="88" rx="12" fill="#0F241C" stroke="#34D399" stroke-width="1.3"/>
    <text x="64" y="196" fill="#6EE7B7" font-size="14" font-weight="700">后端服务层 · FastAPI</text>
    <text x="716" y="196" fill="#64748B" font-size="10.5" text-anchor="end">REST /api/v1 · JWT 鉴权</text>
    <g font-size="11.5" fill="#94A3B8">
      <rect x="64" y="210" width="150" height="32" rx="8" fill="#123528"/><text x="139" y="230" text-anchor="middle">15 个路由模块</text>
      <rect x="224" y="210" width="150" height="32" rx="8" fill="#123528"/><text x="299" y="230" text-anchor="middle">RBAC 四级权限</text>
      <rect x="384" y="210" width="150" height="32" rx="8" fill="#123528"/><text x="459" y="230" text-anchor="middle">CORS/安全头中间件</text>
      <rect x="544" y="210" width="172" height="32" rx="8" fill="#123528"/><text x="630" y="230" text-anchor="middle">错误日志·审计追踪</text>
    </g>
  </g>

  <!-- 算法层 -->
  <g>
    <rect x="40" y="274" width="700" height="88" rx="12" fill="#2A1A0E" stroke="#FBBF24" stroke-width="1.3"/>
    <text x="64" y="302" fill="#FCD34D" font-size="14" font-weight="700">算法层 · algorithm_model（可独立运行）</text>
    <text x="716" y="302" fill="#64748B" font-size="10.5" text-anchor="end">200 项单元测试</text>
    <g font-size="11.5" fill="#94A3B8">
      <rect x="64" y="316" width="120" height="32" rx="8" fill="#3A2A12"/><text x="124" y="336" text-anchor="middle">NURBS 内核</text>
      <rect x="194" y="316" width="120" height="32" rx="8" fill="#3A2A12"/><text x="254" y="336" text-anchor="middle">贝叶斯优化</text>
      <rect x="324" y="316" width="120" height="32" rx="8" fill="#3A2A12"/><text x="384" y="336" text-anchor="middle">质量评估</text>
      <rect x="454" y="316" width="120" height="32" rx="8" fill="#3A2A12"/><text x="514" y="336" text-anchor="middle">参数化纹理</text>
      <rect x="584" y="316" width="132" height="32" rx="8" fill="#3A2A12"/><text x="650" y="336" text-anchor="middle">深度学习/LLM</text>
    </g>
  </g>

  <!-- 数据层 -->
  <g>
    <rect x="40" y="380" width="700" height="88" rx="12" fill="#1A1230" stroke="#A78BFA" stroke-width="1.3"/>
    <text x="64" y="408" fill="#C4B5FD" font-size="14" font-weight="700">数据层</text>
    <text x="716" y="408" fill="#64748B" font-size="10.5" text-anchor="end">SQLAlchemy ORM · 11 张表</text>
    <g font-size="11.5" fill="#94A3B8">
      <rect x="64" y="422" width="150" height="32" rx="8" fill="#241A40"/><text x="139" y="442" text-anchor="middle">SQLite 数据库</text>
      <rect x="224" y="422" width="150" height="32" rx="8" fill="#241A40"/><text x="299" y="442" text-anchor="middle">模型文件存储</text>
      <rect x="384" y="422" width="150" height="32" rx="8" fill="#241A40"/><text x="459" y="442" text-anchor="middle">Redis（会话态）</text>
      <rect x="544" y="422" width="172" height="32" rx="8" fill="#241A40"/><text x="630" y="442" text-anchor="middle">品牌知识库 JSON</text>
    </g>
  </g>

  <!-- 右侧部署通道 -->
  <g>
    <rect x="764" y="62" width="172" height="406" rx="12" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="850" y="88" fill="#E2E8F0" font-size="13" font-weight="700" text-anchor="middle">部署通道</text>
    <g text-anchor="middle" font-size="11.5">
      <rect x="780" y="104" width="140" height="56" rx="9" fill="#12293D"/><text x="850" y="126" fill="#7DD3FC">开发态</text><text x="850" y="144" fill="#64748B" font-size="10.5">Vite 5173 + Uvicorn 8000</text>
      <rect x="780" y="176" width="140" height="56" rx="9" fill="#0F241C"/><text x="850" y="198" fill="#6EE7B7">生产态</text><text x="850" y="216" fill="#64748B" font-size="10.5">docker-compose 编排</text>
      <rect x="780" y="248" width="140" height="56" rx="9" fill="#2A1A0E"/><text x="850" y="270" fill="#FCD34D">公网隧道</text><text x="850" y="288" fill="#64748B" font-size="10.5">cpolar HTTPS</text>
      <rect x="780" y="320" width="140" height="56" rx="9" fill="#1A1230"/><text x="850" y="342" fill="#C4B5FD">静态发布</text><text x="850" y="360" fill="#64748B" font-size="10.5">GitHub Pages</text>
      <rect x="780" y="392" width="140" height="56" rx="9" fill="#0B101A" stroke="#1E2A3A"/><text x="850" y="414" fill="#94A3B8">域名</text><text x="850" y="432" fill="#64748B" font-size="10.5">evolution-ai.design</text>
    </g>
  </g>

  <!-- 层间调用箭头 -->
  <line x1="390" y1="152" x2="390" y2="164" stroke="#34D399" stroke-width="2" marker-end="url(#ar8)"/>
  <line x1="390" y1="258" x2="390" y2="270" stroke="#34D399" stroke-width="2" marker-end="url(#ar8)"/>
  <line x1="390" y1="364" x2="390" y2="376" stroke="#34D399" stroke-width="2" marker-end="url(#ar8)"/>
  <text x="404" y="160" fill="#64748B" font-size="10.5">HTTP/JSON</text>
  <text x="404" y="266" fill="#64748B" font-size="10.5">函数调用</text>
  <text x="404" y="372" fill="#64748B" font-size="10.5">ORM 读写</text>

  <text x="40" y="500" fill="#64748B" font-size="11.5">读法：请求自上而下穿越四层——前端只说 HTTP，后端只调算法函数，算法层零框架依赖可独立复用，数据层统一经 ORM 访问；右侧部署通道覆盖开发、生产、公网三条发布路径。</text>
  <text x="40" y="520" fill="#475569" font-size="10.5">分层原则：上层可依赖下层，下层不感知上层（算法层不 import FastAPI，数据库不感知业务语义）。</text>
</svg>
