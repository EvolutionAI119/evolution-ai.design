<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#38BDF8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="438" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">平台测试金字塔：四层验证体系</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Test Pyramid</text>

  <!-- 金字塔 -->
  <g text-anchor="middle">
    <!-- L1 顶层 E2E -->
    <polygon points="480,70 560,130 400,130" fill="#1A1230" stroke="#A78BFA" stroke-width="1.4"/>
    <text x="480" y="118" fill="#C4B5FD" font-size="11.5" font-weight="700">E2E</text>
    <!-- L2 后端 -->
    <polygon points="392,138 568,138 604,200 356,200" fill="#12293D" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="480" y="174" fill="#7DD3FC" font-size="12.5" font-weight="700">后端 API 集成 178</text>
    <!-- L3 前端 -->
    <polygon points="348,208 612,208 648,272 312,272" fill="#0F241C" stroke="#34D399" stroke-width="1.4"/>
    <text x="480" y="244" fill="#6EE7B7" font-size="12.5" font-weight="700">前端组件 111</text>
    <!-- L4 算法 -->
    <polygon points="304,280 656,280 692,344 268,344" fill="#3A2A12" stroke="#FBBF24" stroke-width="1.4"/>
    <text x="480" y="316" fill="#FCD34D" font-size="12.5" font-weight="700">算法单元 200</text>
  </g>

  <!-- 左侧注记 -->
  <g font-size="11" fill="#94A3B8">
    <text x="360" y="98" text-anchor="end">浏览器实测 · 真实链路</text>
    <line x1="366" y1="94" x2="404" y2="100" stroke="#A78BFA" stroke-opacity=".6"/>
    <text x="620" y="98">数量最少 · 价值最高</text>
    <line x1="614" y1="94" x2="548" y2="106" stroke="#A78BFA" stroke-opacity=".6"/>

    <text x="300" y="176" text-anchor="end">pytest + TestClient</text>
    <line x1="306" y1="172" x2="372" y2="172" stroke="#38BDF8" stroke-opacity=".6"/>
    <text x="662" y="176">路由/鉴权/ORM 全覆盖</text>
    <line x1="656" y1="172" x2="592" y2="172" stroke="#38BDF8" stroke-opacity=".6"/>

    <text x="292" y="246" text-anchor="end">vitest + jsdom</text>
    <line x1="298" y1="242" x2="328" y2="246" stroke="#34D399" stroke-opacity=".6"/>
    <text x="670" y="246">store/路由守卫/API 拦截</text>
    <line x1="664" y1="242" x2="632" y2="246" stroke="#34D399" stroke-opacity=".6"/>

    <text x="284" y="316" text-anchor="end">纯数学/几何断言</text>
    <line x1="290" y1="312" x2="286" y2="312" stroke="#FBBF24" stroke-opacity=".6"/>
    <text x="678" y="316">NURBS · 贝叶斯收敛</text>
    <line x1="672" y1="312" x2="666" y2="312" stroke="#FBBF24" stroke-opacity=".6"/>
  </g>

  <!-- 右侧原则 -->
  <g>
    <rect x="740" y="80" width="190" height="256" rx="12" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="835" y="108" fill="#E2E8F0" font-size="13" font-weight="700" text-anchor="middle">分层原则</text>
    <g font-size="11" fill="#94A3B8">
      <circle cx="762" cy="136" r="2.5" fill="#A78BFA"/><text x="774" y="140">越往上：越慢越脆</text>
      <circle cx="762" cy="166" r="2.5" fill="#A78BFA"/><text x="774" y="170">越往下：越快越稳</text>
      <circle cx="762" cy="196" r="2.5" fill="#34D399"/><text x="774" y="200">算法层最大：数学是根</text>
      <circle cx="762" cy="226" r="2.5" fill="#34D399"/><text x="774" y="230">E2E 最小：冒烟即可</text>
      <circle cx="762" cy="256" r="2.5" fill="#FBBF24"/><text x="774" y="260">任何提交前全量跑</text>
      <circle cx="762" cy="286" r="2.5" fill="#FBBF24"/><text x="774" y="290">红灯禁止合入 main</text>
    </g>
    <text x="835" y="322" fill="#475569" font-size="10" text-anchor="middle">CI 就绪：三套命令行可重复执行</text>
  </g>

  <!-- 底部统计 -->
  <g font-size="11.5" fill="#94A3B8" text-anchor="middle">
    <rect x="40" y="368" width="284" height="48" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="182" y="396"><tspan fill="#6EE7B7" font-weight="700">489</tspan> 用例 · <tspan fill="#6EE7B7" font-weight="700">100%</tspan> 通过率</text>
    <rect x="338" y="368" width="284" height="48" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="480" y="396">LLM 问答基准 <tspan fill="#7DD3FC" font-weight="700">Q1/Q3/Q10</tspan> 全命中</text>
    <rect x="636" y="368" width="284" height="48" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="778" y="396">可复现命令见报告<tspan fill="#FCD34D" font-weight="700"> 附录</tspan></text>
  </g>
</svg>
