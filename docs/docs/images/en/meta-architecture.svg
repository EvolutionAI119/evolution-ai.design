<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#38BDF8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="448" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Own Knowledge System: 3 Layers + 1 Library</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Knowledge System Architecture</text>

  <!-- Layer 1 Philosophy -->
  <g>
    <rect x="150" y="62" width="660" height="92" rx="12" fill="#1A1230" stroke="#A78BFA" stroke-width="1.3"/>
    <text x="182" y="94" fill="#C4B5FD" font-size="15" font-weight="700">Ⅰ Philosophy</text>
    <text x="320" y="94" fill="#64748B" font-size="11">answers "why design this way"</text>
    <g font-size="12" fill="#C4B5FD">
      <rect x="182" y="108" width="150" height="30" rx="8" fill="#241A40"/><text x="257" y="127" text-anchor="middle">Form·Logic·Math</text>
      <rect x="344" y="108" width="150" height="30" rx="8" fill="#241A40"/><text x="419" y="127" text-anchor="middle">OCGE loop</text>
      <rect x="506" y="108" width="150" height="30" rx="8" fill="#241A40"/><text x="581" y="127" text-anchor="middle">Civilization roots</text>
      <rect x="668" y="108" width="120" height="30" rx="8" fill="#241A40"/><text x="728" y="127" text-anchor="middle">Math aesthetics</text>
    </g>
  </g>

  <!-- Layer 2 Methodology -->
  <g>
    <rect x="150" y="172" width="660" height="92" rx="12" fill="#0E1E2E" stroke="#38BDF8" stroke-width="1.3"/>
    <text x="182" y="204" fill="#7DD3FC" font-size="15" font-weight="700">Ⅱ Methodology</text>
    <text x="310" y="204" fill="#64748B" font-size="11">answers "what process &amp; standards"</text>
    <g font-size="12" fill="#7DD3FC">
      <rect x="182" y="218" width="150" height="30" rx="8" fill="#12293D"/><text x="257" y="237" text-anchor="middle">5-dim methodology</text>
      <rect x="344" y="218" width="150" height="30" rx="8" fill="#12293D"/><text x="419" y="237" text-anchor="middle">SOP procedures</text>
      <rect x="506" y="218" width="150" height="30" rx="8" fill="#12293D"/><text x="581" y="237" text-anchor="middle">Review baselines</text>
      <rect x="668" y="218" width="120" height="30" rx="8" fill="#12293D"/><text x="728" y="237" text-anchor="middle">Maturity check</text>
    </g>
  </g>

  <!-- Layer 3 Engineering -->
  <g>
    <rect x="150" y="282" width="660" height="92" rx="12" fill="#0F241C" stroke="#34D399" stroke-width="1.3"/>
    <text x="182" y="314" fill="#6EE7B7" font-size="15" font-weight="700">Ⅲ Engineering</text>
    <text x="322" y="314" fill="#64748B" font-size="11">answers "which tools, how to build"</text>
    <g font-size="12" fill="#6EE7B7">
      <rect x="182" y="328" width="150" height="30" rx="8" fill="#123528"/><text x="257" y="347" text-anchor="middle">NURBS algo library</text>
      <rect x="344" y="328" width="150" height="30" rx="8" fill="#123528"/><text x="419" y="347" text-anchor="middle">Bayes engine</text>
      <rect x="506" y="328" width="150" height="30" rx="8" fill="#123528"/><text x="581" y="347" text-anchor="middle">Brand KB</text>
      <rect x="668" y="328" width="120" height="30" rx="8" fill="#123528"/><text x="728" y="347" text-anchor="middle">Frontend &amp; backend</text>
    </g>
  </g>

  <!-- Left vertical labels -->
  <g font-size="12" fill="#94A3B8">
    <text x="112" y="112" text-anchor="end">Idea autonomy</text>
    <text x="112" y="130" text-anchor="end" font-size="10.5" fill="#475569">Philosophy</text>
    <text x="112" y="222" text-anchor="end">Process autonomy</text>
    <text x="112" y="240" text-anchor="end" font-size="10.5" fill="#475569">Methodology</text>
    <text x="112" y="332" text-anchor="end">Tool autonomy</text>
    <text x="112" y="350" text-anchor="end" font-size="10.5" fill="#475569">Engineering</text>
  </g>
  <line x1="122" y1="112" x2="142" y2="112" stroke="#A78BFA"/>
  <line x1="122" y1="222" x2="142" y2="222" stroke="#38BDF8"/>
  <line x1="122" y1="332" x2="142" y2="332" stroke="#34D399"/>

  <!-- Bottom library -->
  <rect x="150" y="392" width="660" height="40" rx="10" fill="#0B101A" stroke="#1E2A3A" stroke-dasharray="5 4"/>
  <text x="480" y="417" fill="#94A3B8" font-size="12.5" text-anchor="middle">Academic Resource Index — classics · genealogy · standards · datasets (supports all layers, always updated)</text>

  <!-- Right arrow -->
  <path d="M836 100 L 836 350" stroke="none"/>
  <path d="M856 372 L 856 100" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ar6)" transform="translate(0 0)"/>
  <text x="874" y="240" fill="#7DD3FC" font-size="11" transform="rotate(90 874 240)" text-anchor="middle">Practice feeds theory (bottom-up)</text>

  <text x="40" y="446" fill="none" font-size="1"> </text>
