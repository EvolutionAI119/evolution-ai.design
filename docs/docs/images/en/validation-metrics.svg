<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="418" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Three-Layer Test Suite: Scale &amp; Pass Rate (v1.2 baseline)</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Validation Metrics</text>

  <!-- Chart area -->
  <line x1="90" y1="320" x2="620" y2="320" stroke="#334155" stroke-width="1.2"/>
  <line x1="90" y1="320" x2="90" y2="80" stroke="#334155" stroke-width="1.2"/>
  <g stroke="#1E2A3A" stroke-width="1">
    <line x1="90" y1="260" x2="620" y2="260"/><line x1="90" y1="200" x2="620" y2="200"/><line x1="90" y1="140" x2="620" y2="140"/><line x1="90" y1="80" x2="620" y2="80"/>
  </g>
  <g fill="#475569" font-size="10" text-anchor="end">
    <text x="82" y="324">0</text><text x="82" y="264">50</text><text x="82" y="204">100</text><text x="82" y="144">150</text><text x="82" y="84">200</text>
  </g>
  <text x="60" y="200" fill="#64748B" font-size="10.5" transform="rotate(-90 60 200)" text-anchor="middle">Cases</text>

  <!-- Bars -->
  <g text-anchor="middle">
    <rect x="130" y="80" width="90" height="240" rx="6" fill="#0F241C" stroke="#34D399"/>
    <text x="175" y="72" fill="#6EE7B7" font-size="15" font-weight="700">200</text>
    <text x="175" y="344" fill="#CBD5E1" font-size="12" font-weight="600">Algorithm</text>
    <text x="175" y="362" fill="#64748B" font-size="10">NURBS/Bayes/texture</text>
    <rect x="132" y="80" width="86" height="240" rx="5" fill="#34D399" opacity=".22"/>

    <rect x="270" y="107" width="90" height="213" rx="6" fill="#0F241C" stroke="#34D399"/>
    <text x="315" y="99" fill="#6EE7B7" font-size="15" font-weight="700">178</text>
    <text x="315" y="344" fill="#CBD5E1" font-size="12" font-weight="600">Backend</text>
    <text x="315" y="362" fill="#64748B" font-size="10">pytest · TestClient</text>
    <rect x="272" y="107" width="86" height="213" rx="5" fill="#34D399" opacity=".22"/>

    <rect x="410" y="187" width="90" height="133" rx="6" fill="#0F241C" stroke="#34D399"/>
    <text x="455" y="179" fill="#6EE7B7" font-size="15" font-weight="700">111</text>
    <text x="455" y="344" fill="#CBD5E1" font-size="12" font-weight="600">Frontend</text>
    <text x="455" y="362" fill="#64748B" font-size="10">vitest · jsdom</text>
    <rect x="412" y="187" width="86" height="133" rx="5" fill="#34D399" opacity=".22"/>

    <rect x="550" y="314" width="90" height="6" rx="3" fill="#0F241C" stroke="#34D399"/>
    <text x="595" y="306" fill="#6EE7B7" font-size="15" font-weight="700">5</text>
    <text x="595" y="344" fill="#CBD5E1" font-size="12" font-weight="600">One-stop check</text>
    <text x="595" y="362" fill="#64748B" font-size="10">test_all.py module</text>
  </g>

  <!-- Pass-rate badges -->
  <g text-anchor="middle">
    <rect x="680" y="86" width="240" height="64" rx="10" fill="#0F241C" stroke="#34D399"/>
    <text x="800" y="114" fill="#6EE7B7" font-size="17" font-weight="700">100% Pass</text>
    <text x="800" y="134" fill="#94A3B8" font-size="10.5">489 cases · 0 failed 0 skipped</text>
    <rect x="680" y="164" width="240" height="64" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="800" y="192" fill="#7DD3FC" font-size="13" font-weight="600">Bayes convergence check</text>
    <text x="800" y="212" fill="#94A3B8" font-size="10.5">30-round convergence · stable optimum</text>
    <rect x="680" y="242" width="240" height="64" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="800" y="270" fill="#C4B5FD" font-size="13" font-weight="600">Doc ↔ code audit</text>
    <text x="800" y="290" fill="#94A3B8" font-size="10.5">facts verified item-by-item (doc-code-audit)</text>
  </g>

  <text x="40" y="398" fill="#64748B" font-size="11.5">How to read: bar height = cases per layer; all green = all pass. Algorithm layer is heaviest (200): NURBS math, Bayes convergence, texture.</text>
</svg>
