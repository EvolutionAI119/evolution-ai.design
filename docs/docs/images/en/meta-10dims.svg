      <rect x="52" y="182" width="206" height="44" rx="9" fill="#0B101A"/><text x="155" y="201" text-anchor="middle" fill="#94A3B8">② Concepts &amp; style</text><text x="155" y="217" text-anchor="middle" fill="#475569" font-size="10">Style</text>
      <rect x="52" y="236" width="206" height="44" rx="9" fill="#0B101A"/><text x="155" y="255" text-anchor="middle" fill="#94A3B8">③ Detail &amp; innovation</text><text x="155" y="271" text-anchor="middle" fill="#475569" font-size="10">Detail</text>
      <rect x="52" y="290" width="206" height="44" rx="9" fill="#0B101A"/><text x="155" y="309" text-anchor="middle" fill="#94A3B8">④ Time &amp; resources</text><text x="155" y="325" text-anchor="middle" fill="#475569" font-size="10">Resource</text>
