      <rect x="648" y="178" width="270" height="40" rx="9" fill="#123528" stroke="#34D399" stroke-opacity=".45"/><text x="783" y="203" text-anchor="middle" fill="#6EE7B7">⑧ Math aesthetics &amp; algorithmic generation</text>
