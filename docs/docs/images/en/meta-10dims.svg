      <rect x="648" y="228" width="270" height="40" rx="9" fill="#123528" stroke="#34D399" stroke-opacity=".45"/><text x="783" y="253" text-anchor="middle" fill="#6EE7B7">⑨ Agent co-creation theory</text>
      <rect x="362" y="278" width="270" height="40" rx="9" fill="#0B101A"/><text x="497" y="303" text-anchor="middle" fill="#94A3B8">⑥ Brand DNA &amp; genealogy</text>
      <rect x="648" y="278" width="270" height="40" rx="9" fill="#123528" stroke="#34D399" stroke-opacity=".45"/><text x="783" y="303" text-anchor="middle" fill="#6EE7B7">⑩ Systematic knowledge building</text>
      <rect x="362" y="328" width="270" height="40" rx="9" fill="#0B101A"/><text x="497" y="353" text-anchor="middle" fill="#94A3B8">⑥ Sustainability &amp; lifecycle</text>
      <rect x="648" y="328" width="270" height="40" rx="9" fill="#123528" stroke="#34D399" stroke-opacity=".45"/><text x="783" y="353" text-anchor="middle" fill="#6EE7B7">＋ Academic resource index</text>
    </g>
    <text x="635" y="404" fill="#475569" font-size="10.5" text-anchor="middle">Left (grey) keeps original semantics; right (green) derived from meta-theory</text>
  </g>

  <text x="40" y="450" fill="#64748B" font-size="11.5">How to read: meta-theory adds philosophy–math–AI roots to the 5 dimensions, upgrading methodology from experience to derivable, testable knowledge.</text>
