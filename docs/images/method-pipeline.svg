<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34D399"/>
    </marker>
    <marker id="ar7r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#F87171"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="418" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">方法论总纲：五阶段开发流水线与 SOP 门禁</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Stage-Gate Development Pipeline</text>

  <!-- 主时间轴 -->
  <line x1="60" y1="210" x2="910" y2="210" stroke="#1E2A3A" stroke-width="3"/>

  <!-- 阶段节点 -->
  <g text-anchor="middle">
    <g>
      <circle cx="110" cy="210" r="26" fill="#12293D" stroke="#38BDF8" stroke-width="2"/>
      <text x="110" y="216" fill="#7DD3FC" font-size="15" font-weight="700">Ⅰ</text>
      <text x="110" y="168" fill="#E2E8F0" font-size="13.5" font-weight="600">洞察定义</text>
      <text x="110" y="186" fill="#64748B" font-size="10.5">Insight</text>
      <g font-size="10.5" fill="#94A3B8" text-anchor="start">
        <text x="60" y="256">· 用户/市场洞察</text>
        <text x="60" y="274">· 品牌基因提取</text>
        <text x="60" y="292">· 硬点与法规输入</text>
      </g>
    </g>
    <g>
      <circle cx="290" cy="210" r="26" fill="#1A1230" stroke="#A78BFA" stroke-width="2"/>
      <text x="290" y="216" fill="#C4B5FD" font-size="15" font-weight="700">Ⅱ</text>
      <text x="290" y="168" fill="#E2E8F0" font-size="13.5" font-weight="600">概念草图</text>
      <text x="290" y="186" fill="#64748B" font-size="10.5">Concept</text>
      <g font-size="10.5" fill="#94A3B8" text-anchor="start">
        <text x="240" y="256">· 主题情绪板</text>
        <text x="240" y="274">· 2D 草图比稿</text>
        <text x="240" y="292">· 比例姿态定案</text>
      </g>
    </g>
    <g>
      <circle cx="470" cy="210" r="26" fill="#0F241C" stroke="#34D399" stroke-width="2.2"/>
      <text x="470" y="216" fill="#6EE7B7" font-size="15" font-weight="700">Ⅲ</text>
      <text x="470" y="168" fill="#E2E8F0" font-size="13.5" font-weight="600">数字建模</text>
      <text x="470" y="186" fill="#64748B" font-size="10.5">Digital</text>
      <g font-size="10.5" fill="#94A3B8" text-anchor="start">
        <text x="420" y="256">· 参数化 NURBS 建模</text>
        <text x="420" y="274">· 平台自动生成曲面</text>
        <text x="420" y="292">· 品牌 DNA 匹配校验</text>
      </g>
    </g>
    <g>
      <circle cx="650" cy="210" r="26" fill="#2A1A0E" stroke="#FBBF24" stroke-width="2"/>
      <text x="650" y="216" fill="#FCD34D" font-size="15" font-weight="700">Ⅳ</text>
      <text x="650" y="168" fill="#E2E8F0" font-size="13.5" font-weight="600">虚拟验证</text>
      <text x="650" y="186" fill="#64748B" font-size="10.5">Validation</text>
      <g font-size="10.5" fill="#94A3B8" text-anchor="start">
        <text x="600" y="256">· G2/曲率质量评估</text>
        <text x="600" y="274">· 贝叶斯多轮寻优</text>
        <text x="600" y="292">· 变体对比评审</text>
      </g>
    </g>
    <g>
      <circle cx="830" cy="210" r="26" fill="#0E1E2E" stroke="#38BDF8" stroke-width="2"/>
      <text x="830" y="216" fill="#7DD3FC" font-size="15" font-weight="700">Ⅴ</text>
      <text x="830" y="168" fill="#E2E8F0" font-size="13.5" font-weight="600">工程交付</text>
      <text x="830" y="186" fill="#64748B" font-size="10.5">Deliver</text>
      <g font-size="10.5" fill="#94A3B8" text-anchor="start">
        <text x="780" y="256">· STEP/IGS 数据交付</text>
        <text x="780" y="274">· 质检报告归档</text>
        <text x="780" y="292">· 工作流审核放行</text>
      </g>
    </g>
  </g>

  <!-- 阶段箭头 -->
  <line x1="140" y1="210" x2="260" y2="210" stroke="#34D399" stroke-width="2" marker-end="url(#ar7)"/>
  <line x1="320" y1="210" x2="440" y2="210" stroke="#34D399" stroke-width="2" marker-end="url(#ar7)"/>
  <line x1="500" y1="210" x2="620" y2="210" stroke="#34D399" stroke-width="2" marker-end="url(#ar7)"/>
  <line x1="680" y1="210" x2="800" y2="210" stroke="#34D399" stroke-width="2" marker-end="url(#ar7)"/>

  <!-- 门禁菱形 -->
  <g text-anchor="middle">
    <g transform="translate(200,140)">
      <rect x="-13" y="-13" width="26" height="26" transform="rotate(45)" fill="#0B101A" stroke="#FBBF24" stroke-width="1.6"/>
      <text y="4.5" fill="#FCD34D" font-size="11" font-weight="700">G1</text>
      <text y="-24" fill="#94A3B8" font-size="10.5">硬点确认门</text>
    </g>
    <g transform="translate(380,140)">
      <rect x="-13" y="-13" width="26" height="26" transform="rotate(45)" fill="#0B101A" stroke="#FBBF24" stroke-width="1.6"/>
      <text y="4.5" fill="#FCD34D" font-size="11" font-weight="700">G2</text>
      <text y="-24" fill="#94A3B8" font-size="10.5">主题比稿门</text>
    </g>
    <g transform="translate(560,140)">
      <rect x="-13" y="-13" width="26" height="26" transform="rotate(45)" fill="#0B101A" stroke="#FBBF24" stroke-width="1.6"/>
      <text y="4.5" fill="#FCD34D" font-size="11" font-weight="700">G3</text>
      <text y="-24" fill="#94A3B8" font-size="10.5">A级曲面门</text>
    </g>
    <g transform="translate(740,140)">
      <rect x="-13" y="-13" width="26" height="26" transform="rotate(45)" fill="#0B101A" stroke="#FBBF24" stroke-width="1.6"/>
      <text y="4.5" fill="#FCD34D" font-size="11" font-weight="700">G4</text>
      <text y="-24" fill="#94A3B8" font-size="10.5">质量放行门</text>
    </g>
  </g>

  <!-- 不过关回路 -->
  <path d="M200 156 L 200 330 L 470 330 L 470 240" fill="none" stroke="#F87171" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar7r)"/>
  <text x="335" y="349" fill="#F87171" font-size="10.5" text-anchor="middle">门禁未通过 → 回退上一阶段修订（评分与缺陷写回贝叶斯引擎）</text>

  <text x="40" y="392" fill="#64748B" font-size="11.5">读法：五个阶段对应平台「项目 → 设计器 → 质量报告 → 工作流审核」的页面动线；四个门禁（G1–G4）是 SOP 规定的强制检查点，未达标禁止进入下一阶段。</text>
</svg>
