  <text x="40" y="462" fill="#64748B" font-size="11.5">读法：自下而上读——四条根决定「为什么」，树干承续造物传统，树冠结出可操作的维度、原则与语言；根系越深，冠层越稳，这就是元理论先于方法论的意义。</text>
