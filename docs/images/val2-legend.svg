<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">图例：本报告的通过 / 警告 / 降级语义</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Legend · Pass, Warn, Degrade</text>

  <!-- A 状态 -->
  <rect x="40" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">A · 状态符号</text>
  <g font-size="10.5">
    <text x="58" y="108" fill="#34D399" font-size="12" font-weight="700">✓</text><text x="82" y="108" fill="#94A3B8">通过：用例 / 自检模块 / 修复后复验</text>
    <text x="58" y="130" fill="#FBBF24" font-size="12" font-weight="700">⚠</text><text x="82" y="130" fill="#94A3B8">已知非阻断警告（Pydantic / on_event 等）</text>
    <text x="58" y="152" fill="#F87171" font-size="12" font-weight="700">✕</text><text x="82" y="152" fill="#94A3B8">失败 / 不通过（本轮 0 项）</text>
    <text x="58" y="174" fill="#64748B" font-size="12" font-weight="700">○</text><text x="82" y="174" fill="#94A3B8">边界外 / 本轮未覆盖（见第 8 章）</text>
    <text x="58" y="196" fill="#A78BFA" font-size="12" font-weight="700">◆</text><text x="82" y="196" fill="#94A3B8">如实降级：显式报不可用，不模拟成功</text>
  </g>

  <!-- B 线型 -->
  <rect x="496" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">B · 线型与流程</text>
  <g font-size="10.5" fill="#94A3B8">
    <line x1="514" y1="105" x2="576" y2="105" stroke="#34D399" stroke-width="2"/>
    <text x="590" y="109">实线：当日实跑链路（用例 → 结果）</text>
    <line x1="514" y1="127" x2="576" y2="127" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="590" y="131">虚线：目标阈值（±2° / ≥3× / ≤100 ms）</text>
    <line x1="514" y1="149" x2="576" y2="149" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
    <text x="590" y="153">点线：刻意覆盖的警告路径</text>
    <line x1="514" y1="171" x2="576" y2="171" stroke="#A78BFA" stroke-width="2" stroke-dasharray="8 3 2 3"/>
    <text x="590" y="175">点划线：历史基线（保持不回改）</text>
    <line x1="514" y1="193" x2="576" y2="193" stroke="#F87171" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="590" y="197">红色虚线：闭环回退（回归失败 → 重定位）</text>
  </g>

  <!-- C 颜色 -->
  <rect x="40" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">C · 色块语义</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="58" y="278" width="26" height="13" rx="3" fill="#34D399"/><text x="96" y="289">通过 / 达标（489 全绿）</text>
    <rect x="58" y="300" width="26" height="13" rx="3" fill="#FBBF24"/><text x="96" y="311">警告 / 阈值线（非阻断）</text>
    <rect x="58" y="322" width="26" height="13" rx="3" fill="#F87171"/><text x="96" y="333">失败 / 缺陷（本轮为 0）</text>
    <rect x="58" y="344" width="26" height="13" rx="3" fill="#38BDF8"/><text x="96" y="355">量化指标（用例数、耗时、比率）</text>
    <rect x="58" y="366" width="26" height="13" rx="3" fill="#A78BFA"/><text x="96" y="377">文档 ↔ 源码对照 / 降级契约</text>
  </g>

  <!-- D 阈值 -->
  <rect x="496" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">D · 关键数值口径</text>
  <g font-size="10.5" fill="#94A3B8">
    <text x="514" y="288">489 = 200（算法）+ 178（后端）+ 111（前端）</text>
    <text x="514" y="310">118 = 113 @router + 3 @keys_router + 2 @app</text>
    <text x="514" y="332">G1 5° / G2 2°（continuity.py 默认阈值）</text>
    <text x="514" y="354">分级 A/B/C：0.85 / 0.7 · 0.70 / 0.5 · 0.50</text>
    <text x="514" y="376" fill="#6EE7B7">贝叶斯 −0.01 带：EI x=0.5000 · UCB x=0.4999</text>
    <text x="514" y="396">22 维 CarParams · 14 参数 DEFAULT_SPEC</text>
  </g>

  <text x="40" y="428" fill="#94A3B8" font-size="10">适用范围：图 2-1 ~ 图 5-1。图内所有数值均来自 2026-09-27 当日执行输出，可按下文附录命令复现。</text>
  <text x="40" y="446" fill="#64748B" font-size="10">注：绿色实线与绿色色块含义不同——前者是链路，后者是结论；琥珀色从不代表失败，只代表需要关注。</text>
</svg>
