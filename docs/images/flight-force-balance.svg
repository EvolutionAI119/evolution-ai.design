<svg viewBox="0 0 760 420" role="img" aria-label="sedan悬浮点力平衡：有效重力15.16千牛向下，场升力11.37千牛与风扇推力3.79千牛向上，场份额0.75，推重比1.055" xmlns="http://www.w3.org/2000/svg"><rect x="300" y="200" width="160" height="50" rx="10" fill="#0f1722" stroke="#1c2634"/><rect x="330" y="188" width="100" height="18" rx="8" fill="#0f1722" stroke="#1c2634"/><text x="380" y="222" font-size="12" fill="#e6eaf0" text-anchor="middle" font-weight="600">sedan · 1630 kg</text><text x="380" y="240" font-size="10" fill="#8b96a5" text-anchor="middle">η_e=0.15 · η_cdm=0.20 · s=0.75</text><line x1="340" y1="186" x2="340" y2="98" stroke="#10b981" stroke-width="2"/><polygon points="340,90 335,102 345,102" fill="#10b981"/><text x="352" y="104" font-size="12" fill="#10b981" font-weight="600">场升力 L_field = s·W_eff = 11.37 kN</text><text x="352" y="120" font-size="10.5" fill="#8b96a5">暗能量负压场 · 度规升力（几何曲率保持，非推进做功）</text><line x1="424" y1="186" x2="424" y2="168" stroke="#38bdf8" stroke-width="2"/><polygon points="424,160 419,172 429,172" fill="#38bdf8"/><text x="436" y="172" font-size="12" fill="#38bdf8" font-weight="600">风扇推力 T_fan = (1−s)·W_eff = 3.79 kN</text><text x="436" y="188" font-size="10.5" fill="#8b96a5">保留 25% 差动权限 → ±2° 姿态包络的存在前提</text><line x1="380" y1="252" x2="380" y2="374" stroke="#f59e0b" stroke-width="2"/><polygon points="380,382 375,370 385,370" fill="#f59e0b"/><text x="392" y="372" font-size="12" fill="#f59e0b" font-weight="600">有效重力 W_eff = m·g_eff = 15.16 kN</text><text x="392" y="388" font-size="10.5" fill="#8b96a5">g_eff = g·(1−0.35·η_e) = 9.81 × 0.9475 = 9.30 m/s²</text><rect x="560" y="84" width="186" height="118" rx="8" fill="#0f1722" stroke="#1c2634"/><text x="653" y="106" font-size="12" fill="#e6eaf0" text-anchor="middle" font-weight="600">悬浮充要条件</text><text x="653" y="128" font-size="11.5" fill="#e6eaf0" text-anchor="middle">T/W = 1/(1−0.35·η_e)</text><text x="653" y="148" font-size="12" fill="#10b981" text-anchor="middle" font-weight="600">η_e = 0.15 → T/W = 1.055</text><text x="653" y="166" font-size="10.5" fill="#8b96a5" text-anchor="middle">≥ 1 处处成立（η_e ∈ [0, 0.3]）</text><text x="653" y="184" font-size="10.5" fill="#8b96a5" text-anchor="middle">起飞瞬间：风扇推力 ×1.2 爬升余量</text><text x="380" y="412" font-size="11" fill="#8b96a5" text-anchor="middle">垂直平衡：L_field + T_fan = W_eff　·　场承担份额，风扇保留姿态带宽</text></svg>
