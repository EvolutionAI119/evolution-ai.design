  <text x="40" y="410" fill="#94A3B8" font-size="10">读法：上方五张卡片是当日缺陷，向下汇入同一修复带，再由四条证据链离场；闭环规则为「任一验证失败即回到定位重走」，本轮五项均一次通过。</text>
  <text x="40" y="430" fill="#64748B" font-size="10">口径：200 / 178 / 111 为 2026-09-27 当日数字，与正文一致，不引入后续版本基线。</text>
