<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="438" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#38BDF8"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">LLM 基准三级跃迁：10% → 30% → 70%</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">LLM Benchmark Progression</text>

  <text x="100" y="76" fill="#94A3B8" font-size="10.5">十题基准通过率（8/9 时点）</text>
  <text x="520" y="76" fill="#94A3B8" font-size="10.5">7 道失败题根因（30% 时点）</text>
  <text x="920" y="76" fill="#64748B" font-size="10" text-anchor="end">共 7 道失败</text>

  <!-- 坐标网格 -->
  <g stroke="#1E2A3A" stroke-width="1">
    <line x1="100" y1="80" x2="470" y2="80"/>
    <line x1="100" y1="128" x2="470" y2="128"/>
    <line x1="100" y1="176" x2="470" y2="176"/>
    <line x1="100" y1="224" x2="470" y2="224"/>
    <line x1="100" y1="272" x2="470" y2="272"/>
  </g>
  <line x1="100" y1="320" x2="470" y2="320" stroke="#334155" stroke-width="1.2"/>
  <line x1="100" y1="80" x2="100" y2="320" stroke="#334155" stroke-width="1.2"/>
  <g fill="#475569" font-size="9.5" text-anchor="end">
    <text x="92" y="84">100%</text>
    <text x="92" y="132">80</text>
    <text x="92" y="180">60</text>
    <text x="92" y="228">40</text>
    <text x="92" y="276">20</text>
    <text x="92" y="324">0</text>
  </g>
  <text x="64" y="200" fill="#64748B" font-size="10" transform="rotate(-90 64 200)" text-anchor="middle">通过率</text>

  <!-- 三级柱 -->
  <g>
    <rect x="130" y="296" width="76" height="24" rx="4" fill="#38BDF8" opacity="0.75"/>
    <text x="168" y="288" fill="#7DD3FC" font-size="12" font-weight="700" text-anchor="middle">10%</text>
    <text x="168" y="340" fill="#94A3B8" font-size="10" text-anchor="middle">基础模型</text>
    <text x="168" y="356" fill="#64748B" font-size="9.5" text-anchor="middle">1 / 10</text>

    <rect x="230" y="248" width="76" height="72" rx="4" fill="#38BDF8" opacity="0.85"/>
    <text x="268" y="240" fill="#7DD3FC" font-size="12" font-weight="700" text-anchor="middle">30%</text>
    <text x="268" y="340" fill="#94A3B8" font-size="10" text-anchor="middle">QLoRA 微调</text>
    <text x="268" y="356" fill="#64748B" font-size="9.5" text-anchor="middle">3 / 10</text>

    <rect x="330" y="152" width="76" height="168" rx="4" fill="#34D399" opacity="0.85"/>
    <text x="368" y="144" fill="#6EE7B7" font-size="12" font-weight="700" text-anchor="middle">70%</text>
    <text x="368" y="340" fill="#94A3B8" font-size="10" text-anchor="middle">RAG 增强</text>
    <text x="368" y="356" fill="#64748B" font-size="9.5" text-anchor="middle">7 / 10</text>
  </g>

  <!-- 跃迁折线 -->
  <polyline points="168,292 268,244 368,148" fill="none" stroke="#FBBF24" stroke-width="1.6" stroke-dasharray="5 4"/>
  <g fill="#FBBF24">
    <circle cx="168" cy="292" r="3"/><circle cx="268" cy="244" r="3"/><circle cx="368" cy="148" r="3"/>
  </g>
  <text x="404" y="118" fill="#FBBF24" font-size="9.5" text-anchor="end">+20 / +40 点</text>

  <!-- 分隔线 -->
  <line x1="500" y1="70" x2="500" y2="330" stroke="#1E2A3A" stroke-width="1"/>

  <!-- 根因横条 -->
  <g>
    <text x="520" y="128" fill="#94A3B8" font-size="10">缺乏平台特定数据</text>
    <rect x="760" y="114" width="129" height="18" rx="3" fill="#F87171" opacity="0.8"/>
    <text x="897" y="128" fill="#FCA5A5" font-size="10">43% (3)</text>

    <text x="520" y="174" fill="#94A3B8" font-size="10">专业词汇缺失</text>
    <rect x="760" y="160" width="87" height="18" rx="3" fill="#F87171" opacity="0.7"/>
    <text x="855" y="174" fill="#FCA5A5" font-size="10">29% (2)</text>

    <text x="520" y="220" fill="#94A3B8" font-size="10">概念定义错误</text>
    <rect x="760" y="206" width="42" height="18" rx="3" fill="#F87171" opacity="0.55"/>
    <text x="810" y="220" fill="#FCA5A5" font-size="10">14% (1)</text>

    <text x="520" y="266" fill="#94A3B8" font-size="10">拒答模式</text>
    <rect x="760" y="252" width="42" height="18" rx="3" fill="#F87171" opacity="0.55"/>
    <text x="810" y="266" fill="#FCA5A5" font-size="10">14% (1)</text>
  </g>

  <text x="520" y="298" fill="#FBBF24" font-size="9.5">高风险类别 100% 失败：</text>
  <text x="520" y="316" fill="#64748B" font-size="9.5">continuity / nurbs_basics / parametric_design / quality_assessment</text>

  <text x="40" y="392" fill="#94A3B8" font-size="10">读法：左图三根柱为同一十题基准的三次测量（1/10 → 3/10 → 7/10），琥珀虚线为跃迁轨迹；右图为 30% 时点七道失败题的归因，前两类占 72%。</text>
  <text x="40" y="412" fill="#64748B" font-size="10">口径：数据取自 §2.7 表（2026-08-09 时点）。修复后 Q1 为 4/4、Q3 为 2/2；Q10 待重跑，不计入 70%。</text>
  <text x="40" y="430" fill="#64748B" font-size="10">72% = 43% + 29%，四舍五入后合计 100%。</text>
</svg>
