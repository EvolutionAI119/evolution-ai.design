<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="bayes2-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FBBF24"/></marker>
    <marker id="bayes2-ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A78BFA"/></marker>
    <marker id="bayes2-ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34D399"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="418" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#FBBF24"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">一次贝叶斯寻优会话的真实操作场景</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Inside One Optimization Session</text>

  <!-- ① 工作台 -->
  <rect x="24" y="58" width="286" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="42" y="82" fill="#7DD3FC" font-size="12.5" font-weight="700">① 造型工作台</text>
  <rect x="40" y="94" width="254" height="140" rx="8" fill="#0B101A" stroke="#1E2A3A"/>
  <path d="M56 212 L56 186 Q56 178 66 177 L112 174 L136 152 Q141 148 148 148 L204 148 Q211 148 216 154 L236 176 L268 179 Q278 181 278 190 L278 212 Z"
        fill="#0F241C" stroke="#34D399" stroke-width="1.4" opacity=".9"/>
  <path d="M146 158 L202 158 L222 178 L154 178 Z" fill="#0F1622" stroke="#38BDF8" stroke-opacity=".5"/>
  <circle cx="98" cy="212" r="15" fill="#0B101A" stroke="#E2E8F0" stroke-width="1.6"/>
  <circle cx="98" cy="212" r="7" fill="none" stroke="#94A3B8"/>
  <circle cx="238" cy="212" r="15" fill="#0B101A" stroke="#E2E8F0" stroke-width="1.6"/>
  <circle cx="238" cy="212" r="7" fill="none" stroke="#94A3B8"/>
  <line x1="48" y1="212" x2="286" y2="212" stroke="#475569" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="42" y="256" fill="#94A3B8" font-size="9.5">GET /sessions/{id}/suggest</text>
  <rect x="40" y="264" width="254" height="20" rx="5" fill="#0F1622" stroke="#1E2A3A"/>
  <text x="50" y="278" fill="#CBD5E1" font-size="9.5">overall_length <tspan fill="#FCD34D" font-weight="700">4587.3</tspan> mm</text>
  <rect x="40" y="288" width="254" height="20" rx="5" fill="#0F1622" stroke="#1E2A3A"/>
  <text x="50" y="302" fill="#CBD5E1" font-size="9.5">overall_width <tspan fill="#FCD34D" font-weight="700">1972.8</tspan> mm</text>
  <text x="42" y="324" fill="#64748B" font-size="9.5">其余 12 维按参数空间采样，全部落在边界内</text>
  <text x="42" y="342" fill="#475569" font-size="9">seed 42 · goal = maximize · EI</text>

  <line x1="312" y1="206" x2="330" y2="206" stroke="#FBBF24" stroke-width="1.8" marker-end="url(#bayes2-ar)"/>
  <line x1="625" y1="206" x2="643" y2="206" stroke="#A78BFA" stroke-width="1.8" marker-end="url(#bayes2-ar2)"/>

  <!-- ② 评估 -->
  <rect x="337" y="58" width="286" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="355" y="82" fill="#FCD34D" font-size="12.5" font-weight="700">② 真实评估（昂贵的一次）</text>
  <text x="480" y="150" fill="#FBBF24" font-size="44" font-weight="700" text-anchor="middle">88.5</text>
  <text x="480" y="172" fill="#94A3B8" font-size="10.5" text-anchor="middle">造型质量评分（示例值）</text>
  <rect x="367" y="188" width="226" height="1" fill="#1E2A3A"/>
  <g font-size="10">
    <text x="367" y="212" fill="#CBD5E1">· POST /api/v1/ai/evaluate-quality</text>
    <text x="367" y="232" fill="#CBD5E1">· 或实车仿真 / 人工评分</text>
    <text x="367" y="252" fill="#CBD5E1">· 一次评分 ≈ 一次几何构建 + 分析</text>
  </g>
  <rect x="367" y="270" width="226" height="46" rx="6" fill="#2A1A0E" stroke="#FBBF24" stroke-opacity=".35"/>
  <text x="379" y="288" fill="#FCD34D" font-size="9.5">evaluateQuality 接收整车参数</text>
  <text x="379" y="304" fill="#94A3B8" font-size="9">返回 0–100 的工程代理分</text>
  <text x="355" y="338" fill="#64748B" font-size="9.5">目标函数越贵，代理模型越有价值。</text>

  <!-- ③ 回填 -->
  <rect x="650" y="58" width="286" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="668" y="82" fill="#6EE7B7" font-size="12.5" font-weight="700">③ 回填 → 重训 → 收敛</text>
  <rect x="668" y="96" width="250" height="30" rx="6" fill="#0E1E2E" stroke="#38BDF8" stroke-opacity=".35"/>
  <text x="680" y="115" fill="#7DD3FC" font-size="9.5">POST /observe：14 维参数 + 88.5</text>
  <line x1="793" y1="126" x2="793" y2="144" stroke="#38BDF8" stroke-width="1.4" marker-end="url(#bayes2-ar)"/>
  <rect x="668" y="146" width="250" height="30" rx="6" fill="#1A1230" stroke="#A78BFA" stroke-opacity=".35"/>
  <text x="680" y="165" fill="#C4B5FD" font-size="9.5">GP 重训：RBF 核，ℓ = 0.25，噪声 1e-6</text>
  <line x1="793" y1="176" x2="793" y2="194" stroke="#A78BFA" stroke-width="1.4" marker-end="url(#bayes2-ar2)"/>
  <rect x="668" y="196" width="250" height="44" rx="6" fill="#0F241C" stroke="#34D399" stroke-opacity=".4"/>
  <text x="680" y="214" fill="#6EE7B7" font-size="9.5">best = 91.2（第 2 号观测）</text>
  <text x="680" y="231" fill="#94A3B8" font-size="9">n_observations = 4 · 比 88.5 高 2.7</text>
  <text x="668" y="264" fill="#94A3B8" font-size="9.5">EI / UCB 在 4096 点候选池上取最大 →</text>
  <text x="668" y="282" fill="#94A3B8" font-size="9.5">下一组建议；观测 &lt; 2 时先随机填充。</text>
  <rect x="668" y="296" width="250" height="42" rx="6" fill="#0B101A" stroke="#1E2A3A"/>
  <text x="680" y="314" fill="#CBD5E1" font-size="9.5">收敛判据：15 轮内 |regret| &lt; 0.01</text>
  <text x="680" y="330" fill="#64748B" font-size="9">一维实验 -(x−0.7)²，EI 与 UCB 均通过</text>

  <text x="24" y="382" fill="#94A3B8" font-size="10.5">读图：这是一次完整的「建议 → 评估 → 回填」循环——左侧拿到 4587.3 / 1972.8 的建议，中间把它变成 88.5 的真实分，右侧 observe 后得到当前最优 91.2。</text>
  <text x="24" y="402" fill="#64748B" font-size="10">注意：会话存储在进程内内存，后端重启即清空；需要留存时用 GET /samples 导出特征顺序对齐的训练样本。</text>
</svg>
