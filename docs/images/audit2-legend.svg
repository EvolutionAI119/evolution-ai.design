<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">图例：审计状态、色块与时间口径</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Legend · States, Colors, Time Scope</text>

  <!-- A 状态 -->
  <rect x="40" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">A · 状态标记</text>
  <g font-size="10.5">
    <text x="58" y="108" fill="#34D399" font-size="12" font-weight="700">✓</text><text x="82" y="108" fill="#94A3B8">通过 / 合规（测试、核对项）</text>
    <text x="58" y="130" fill="#FBBF24" font-size="12" font-weight="700">⚠</text><text x="82" y="130" fill="#94A3B8">观察 / 待办（待修，不阻塞）</text>
    <text x="58" y="152" fill="#F87171" font-size="12" font-weight="700">✕</text><text x="82" y="152" fill="#94A3B8">失败 / 缺陷（本轮无）</text>
    <text x="58" y="174" fill="#34D399" font-size="12" font-weight="700">●</text><text x="82" y="174" fill="#94A3B8">正常：服务在线 / 组件可用</text>
    <text x="58" y="196" fill="#A78BFA" font-size="12" font-weight="700">✓</text>
    <line x1="56" y1="191" x2="72" y2="191" stroke="#A78BFA" stroke-width="1.4"/>
    <text x="82" y="196" fill="#94A3B8">删除线 + ✓ = 已完成（历史待办已核销）</text>
  </g>

  <!-- B 颜色 -->
  <rect x="496" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">B · 色块语义</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="514" y="98" width="26" height="13" rx="3" fill="#34D399"/><text x="552" y="109">通过 / 已修复（201、70%）</text>
    <rect x="514" y="120" width="26" height="13" rx="3" fill="#FBBF24"/><text x="552" y="131">待办 / 观察（P1–P3 的修复建议）</text>
    <rect x="514" y="142" width="26" height="13" rx="3" fill="#F87171"/><text x="552" y="153">缺陷 / 未达标（本轮 0 项）</text>
    <rect x="514" y="164" width="26" height="13" rx="3" fill="#38BDF8"/><text x="552" y="175">指标 / 数值（测试数、通过率）</text>
    <rect x="514" y="186" width="26" height="13" rx="3" fill="#F472B6"/><text x="552" y="197">归档 / 历史快照（_archive/）</text>
  </g>

  <!-- C 图表语法 -->
  <rect x="40" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">C · 图表语法</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="58" y="280" width="14" height="18" rx="2" fill="#38BDF8" opacity="0.8"/>
    <text x="82" y="294">柱 = 规模（测试数 / 文件数）</text>
    <circle cx="66" cy="322" r="10" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="18 8"/>
    <text x="82" y="326">环 = 构成占比（341 / 1 / 2）</text>
    <line x1="58" y1="348" x2="86" y2="348" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="90,348 82,344 82,352" fill="#94A3B8"/>
    <text x="100" y="352">实线箭头 = 主流程（请求 → 响应）</text>
    <line x1="58" y1="370" x2="82" y2="370" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="5 3"/>
    <polygon points="90,370 82,366 82,374" fill="#A78BFA"/>
    <text x="100" y="374">虚线箭头 = 异步 / 后续工作</text>
    <text x="58" y="394" fill="#64748B" font-size="10">左侧 100% 堆叠条表示口径构成，不表示时间趋势</text>
  </g>

  <!-- D 时间口径 -->
  <rect x="496" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">D · 时间口径（关键）</text>
  <g font-size="10.5" fill="#94A3B8">
    <text x="514" y="288"><tspan fill="#7DD3FC">8/9</tspan> 全量测试 201 / 201（本章主证据）</text>
    <text x="514" y="310"><tspan fill="#7DD3FC">8/10</tspan> LLM 10 题 7 / 10（70%，Q10 待重跑）</text>
    <text x="514" y="332"><tspan fill="#7DD3FC">10/11</tspan> 增补回归 341 后端 + 142 前端 = 483</text>
    <text x="514" y="354" fill="#A78BFA">原则：历史快照不回改，增补单列并注明时点</text>
    <text x="514" y="376">因此本报告可同时出现 201 与 483，二者不冲突</text>
    <text x="514" y="396" fill="#64748B" font-size="10">图 4-2 顶部标注 10/11，即该图非 8/9 快照</text>
  </g>

  <text x="40" y="428" fill="#94A3B8" font-size="10">适用范围：图 1-1、图 2-1、图 4-1 ~ 图 4-3、图 7-1 ~ 图 7-6。所有数值均直接摘自对应章节表格。</text>
  <text x="40" y="446" fill="#64748B" font-size="10">注：琥珀色在缺陷表中意为「低严重度 + 待修」，不是失败；绿色仅表示通过或已修复。</text>
</svg>
