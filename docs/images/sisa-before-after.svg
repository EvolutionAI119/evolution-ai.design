<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="sisa-ba-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F87171"/></marker>
    <linearGradient id="sisa-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity=".28"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity=".10"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="418" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#F87171"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">同一组 Cayenne 参数：修复前只剩碎片，修复后是闭合整车</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Before / After</text>

  <!-- 修复前 -->
  <rect x="24" y="56" width="430" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="42" y="80" fill="#FCA5A5" font-size="12.5" font-weight="700">修复前</text>
  <text x="436" y="80" fill="#64748B" font-size="9" text-anchor="end">Cayenne · H = 1673 mm</text>
  <rect x="40" y="94" width="398" height="224" rx="8" fill="#0B101A" stroke="#1E2A3A"/>
  <text x="239" y="112" fill="#FCA5A5" font-size="9" text-anchor="middle">车顶落在画布外 · roofTopY ≈ −72 px</text>
  <line x1="239" y1="118" x2="239" y2="132" stroke="#F87171" marker-end="url(#sisa-ba-ar)"/>

  <!-- 碎片 -->
  <circle cx="138" cy="182" r="11" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
  <circle cx="138" cy="182" r="4" fill="#64748B"/>
  <line x1="176" y1="160" x2="248" y2="160" stroke="#94A3B8" stroke-width="2"/>
  <path d="M132 300 Q 180 278 228 300" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <line x1="300" y1="220" x2="370" y2="212" stroke="#475569" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="148" y="206" fill="#64748B" font-size="9">悬浮小圆</text>
  <text x="258" y="154" fill="#64748B" font-size="9">一小段窗线</text>
  <text x="236" y="322" fill="#64748B" font-size="9">贴地小弧</text>
  <text x="42" y="340" fill="#F87171" font-size="9">三条独立线段、无保险杠、无底边 → 轮廓不闭合</text>

  <!-- 修复后 -->
  <rect x="506" y="56" width="430" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="524" y="80" fill="#6EE7B7" font-size="12.5" font-weight="700">修复后</text>
  <text x="918" y="80" fill="#64748B" font-size="9" text-anchor="end">双向缩放 · 触地 · 闭合</text>
  <rect x="522" y="94" width="398" height="224" rx="8" fill="#0B101A" stroke="#1E2A3A"/>
  <g stroke="#16202E">
    <line x1="540" y1="130" x2="902" y2="130"/><line x1="540" y1="180" x2="902" y2="180"/>
    <line x1="540" y1="230" x2="902" y2="230"/>
  </g>
  <path d="M548 284 L548 246 Q548 234 562 232 L636 228 L672 196 Q680 190 690 190 L790 190 Q800 190 808 198 L848 230 L878 234 Q892 236 892 248 L892 284 Z"
        fill="url(#sisa-body)" stroke="#34D399" stroke-width="2"/>
  <path d="M684 200 L788 200 L820 228 L696 228 Z" fill="#0F1622" stroke="#38BDF8" stroke-opacity=".55"/>
  <line x1="752" y1="200" x2="754" y2="228" stroke="#38BDF8" stroke-opacity=".55"/>
  <line x1="560" y1="256" x2="878" y2="256" stroke="#64748B" stroke-width="1" stroke-dasharray="4 4"/>
  <ellipse cx="720" cy="298" rx="176" ry="8" fill="#000" opacity=".35"/>
  <circle cx="616" cy="270" r="26" fill="#0B101A" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="616" cy="270" r="15" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
  <circle cx="616" cy="270" r="4" fill="#94A3B8"/>
  <circle cx="836" cy="270" r="26" fill="#0B101A" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="836" cy="270" r="15" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
  <circle cx="836" cy="270" r="4" fill="#94A3B8"/>
  <line x1="530" y1="296" x2="912" y2="296" stroke="#475569" stroke-width="1.2"/>
  <text x="524" y="322" fill="#6EE7B7" font-size="9">车顶在画布内 · 双轮触地 · 侧窗 DLO + 腰带虚线</text>
  <text x="524" y="340" fill="#64748B" font-size="9">缩放同时约束宽度与高度，任意参数组合都不越界</text>

  <text x="24" y="386" fill="#94A3B8" font-size="10.5">读图：左图是缺陷复现——只剩三个互不相连的碎片，车顶被画到画布外；右图是同一组参数走完双向缩放、触地与闭合轮廓后的结果。</text>
  <text x="24" y="404" fill="#64748B" font-size="10">关键结论：异常不是「渲染器坏了」，而是缩放只算了宽度、轮弧端点取了离地间隙而非地面、三条线没有闭合。</text>
</svg>
