<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">图例：本白皮书图形的编码规则</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Legend · Visual Encoding</text>

  <!-- A 色块语义 -->
  <rect x="40" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">A · 色块语义</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="58" y="99" width="26" height="13" rx="3" fill="#38BDF8"/><text x="96" y="110">前端层 / 接入层（Vue、Vite、Nginx、cpolar）</text>
    <rect x="58" y="121" width="26" height="13" rx="3" fill="#34D399"/><text x="96" y="132">后端层 / 编排（FastAPI、路由、鉴权）</text>
    <rect x="58" y="143" width="26" height="13" rx="3" fill="#FBBF24"/><text x="96" y="154">算法层 / 计算（NURBS、质量、贝叶斯、训练）</text>
    <rect x="58" y="165" width="26" height="13" rx="3" fill="#A78BFA"/><text x="96" y="176">数据层 / 存储（SQLite、文件、Redis）</text>
    <rect x="58" y="187" width="26" height="13" rx="3" fill="#F87171"/><text x="96" y="198">异常 / 拒绝 / 降级（401、400、503）</text>
  </g>

  <!-- B 线型与箭头 -->
  <rect x="496" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">B · 线型与箭头</text>
  <g font-size="10.5" fill="#94A3B8">
    <line x1="514" y1="105" x2="574" y2="105" stroke="#34D399" stroke-width="2"/>
    <text x="590" y="109">同步调用（HTTP / 函数调用）</text>
    <line x1="514" y1="127" x2="574" y2="127" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="590" y="131">异步触发 / 轮询（训练、审核）</text>
    <line x1="514" y1="149" x2="574" y2="149" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
    <text x="590" y="153">可选 / 降级路径（缺失即显式降级）</text>
    <line x1="514" y1="171" x2="574" y2="171" stroke="#F87171" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="590" y="175">异常分支 / 驳回回退</text>
  </g>

  <!-- C 认证与小标记 -->
  <rect x="40" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">C · 认证与小标记</text>
  <g font-size="10.5" fill="#94A3B8">
    <text x="58" y="292" font-size="12">🔐</text><text x="96" y="292">必须认证：Bearer JWT（get_current_user）</text>
    <text x="58" y="314" font-size="12">👑</text><text x="96" y="314">管理员：require_admin / require_superadmin</text>
    <text x="58" y="336" font-size="12">🔹</text><text x="96" y="336">可选认证：携带 JWT 时关联用户</text>
    <circle cx="64" cy="354" r="5" fill="none" stroke="#64748B"/>
    <text x="96" y="358">无标记：公开端点，游客可访问</text>
  </g>

  <!-- D 图形语法 -->
  <rect x="496" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">D · 图形语法</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="514" y="279" width="26" height="13" rx="3" fill="#12293D" stroke="#38BDF8"/>
    <text x="556" y="290">圆角矩形 = 模块 / 服务 / 层</text>
    <circle cx="527" cy="311" r="7" fill="#12293D" stroke="#A78BFA"/>
    <text x="556" y="315">圆点 = 端点 / 数据节点 / 控制点</text>
    <polygon points="527,333 535,341 527,349 519,341" fill="#2A1A0E" stroke="#FBBF24"/>
    <text x="556" y="345">菱形 = 决策闸口 / 分支点</text>
    <polygon points="514,360 530,360 526,372 510,372" fill="#2A1420" stroke="#F472B6"/>
    <text x="556" y="371">平行四边形 = 外部能力 / 可选依赖</text>
    <text x="514" y="392" fill="#94A3B8">1—N = 一对多关系（Project → ModelFile …）</text>
  </g>

  <text x="40" y="428" fill="#94A3B8" font-size="10">前缀缩写规则：模块文件名即路径前缀；例外：import_export → /import-export，llm_proxy → /llm，auth → /auth + /api-keys（3 个端点）。</text>
  <text x="40" y="446" fill="#64748B" font-size="10">图号约定：图 X-Y 表示第 X 章第 Y 图；本图说明其它各图的颜色、线型与标记语义。</text>
</svg>
