<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34D399"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="468" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">元理论扩展：从 5 维度到 10 维度</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">原创框架 → 自主知识体系</text>

  <!-- 左：原5维 -->
  <g>
    <rect x="30" y="66" width="250" height="360" rx="12" fill="#131B29" stroke="#2A3A52"/>
    <text x="155" y="94" fill="#E2E8F0" font-size="14" font-weight="700" text-anchor="middle">原框架 · 5 维度</text>
    <text x="155" y="112" fill="#64748B" font-size="10.5" text-anchor="middle">经典造型方法论</text>
    <g font-size="12.5" fill="#CBD5E1">
      <rect x="52" y="128" width="206" height="44" rx="9" fill="#0B101A"/><text x="155" y="147" text-anchor="middle" fill="#94A3B8">① 设计开发流程</text><text x="155" y="163" text-anchor="middle" fill="#475569" font-size="10">Flow</text>
      <rect x="52" y="182" width="206" height="44" rx="9" fill="#0B101A"/><text x="155" y="201" text-anchor="middle" fill="#94A3B8">② 设计理念与风格</text><text x="155" y="217" text-anchor="middle" fill="#475569" font-size="10">Style</text>
      <rect x="52" y="236" width="206" height="44" rx="9" fill="#0B101A"/><text x="155" y="255" text-anchor="middle" fill="#94A3B8">③ 细节设计与创新</text><text x="155" y="271" text-anchor="middle" fill="#475569" font-size="10">Detail</text>
      <rect x="52" y="290" width="206" height="44" rx="9" fill="#0B101A"/><text x="155" y="309" text-anchor="middle" fill="#94A3B8">④ 时间与资源规划</text><text x="155" y="325" text-anchor="middle" fill="#475569" font-size="10">Resource</text>
      <rect x="52" y="344" width="206" height="44" rx="9" fill="#0B101A"/><text x="155" y="363" text-anchor="middle" fill="#94A3B8">⑤ 用户导向与关怀</text><text x="155" y="379" text-anchor="middle" fill="#475569" font-size="10">User</text>
    </g>
  </g>

  <!-- 中间扩展箭头 -->
  <line x1="288" y1="246" x2="332" y2="246" stroke="#34D399" stroke-width="2.4" marker-end="url(#ar5)"/>
  <text x="310" y="230" fill="#34D399" font-size="11.5" text-anchor="middle">元理论</text>
  <text x="310" y="266" fill="#34D399" font-size="11.5" text-anchor="middle">扩展</text>

  <!-- 右：10维 -->
  <g>
    <rect x="340" y="66" width="590" height="360" rx="12" fill="#0F241C" stroke="#34D399" stroke-width="1.2"/>
    <text x="635" y="94" fill="#34D399" font-size="14" font-weight="700" text-anchor="middle">扩展框架 · 10 维度</text>
    <text x="635" y="112" fill="#64748B" font-size="10.5" text-anchor="middle">前 5 维继承原文 · 后 5 维为元理论新增（绿色）</text>
    <g font-size="12">
      <rect x="362" y="128" width="270" height="40" rx="9" fill="#0B101A"/><text x="497" y="153" text-anchor="middle" fill="#94A3B8">⑥ ⑥文化母体与文明根脉</text>
      <rect x="648" y="128" width="270" height="40" rx="9" fill="#123528" stroke="#34D399" stroke-opacity=".45"/><text x="783" y="153" text-anchor="middle" fill="#6EE7B7">⑦ 哲学元理论（形·理·数）</text>
      <rect x="362" y="178" width="270" height="40" rx="9" fill="#0B101A"/><text x="497" y="203" text-anchor="middle" fill="#94A3B8">⑥ 技术理性与工程伦理</text>
      <rect x="648" y="178" width="270" height="40" rx="9" fill="#123528" stroke="#34D399" stroke-opacity=".45"/><text x="783" y="203" text-anchor="middle" fill="#6EE7B7">⑧ 数理美学与算法生成论</text>
      <rect x="362" y="228" width="270" height="40" rx="9" fill="#0B101A"/><text x="497" y="253" text-anchor="middle" fill="#94A3B8">⑥ 跨文明设计语言对话</text>
      <rect x="648" y="228" width="270" height="40" rx="9" fill="#123528" stroke="#34D399" stroke-opacity=".45"/><text x="783" y="253" text-anchor="middle" fill="#6EE7B7">⑨ 智能体协同创作论</text>
      <rect x="362" y="278" width="270" height="40" rx="9" fill="#0B101A"/><text x="497" y="303" text-anchor="middle" fill="#94A3B8">⑥ 品牌基因与谱系学</text>
      <rect x="648" y="278" width="270" height="40" rx="9" fill="#123528" stroke="#34D399" stroke-opacity=".45"/><text x="783" y="303" text-anchor="middle" fill="#6EE7B7">⑩ 体系化知识建构路径</text>
      <rect x="362" y="328" width="270" height="40" rx="9" fill="#0B101A"/><text x="497" y="353" text-anchor="middle" fill="#94A3B8">⑥ 可持续与全生命周期</text>
      <rect x="648" y="328" width="270" height="40" rx="9" fill="#123528" stroke="#34D399" stroke-opacity=".45"/><text x="783" y="353" text-anchor="middle" fill="#6EE7B7">＋ 学术资源索引层</text>
    </g>
    <text x="635" y="404" fill="#475569" font-size="10.5" text-anchor="middle">继承项（左列灰）保持原方法论语义；新增项（右列绿）由元理论推导得出</text>
  </g>

  <text x="40" y="450" fill="#64748B" font-size="11.5">读法：元理论不是推翻原 5 维度，而是为其补足「哲学—数理—智能」三条根脉，使造型方法论从经验体系升级为可推导、可证伪、可传承的知识体系。</text>
</svg>
