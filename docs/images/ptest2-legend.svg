<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">图例：测试状态、严重度与阻塞语义</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Legend · Status, Severity, Blocking</text>

  <!-- A 状态 -->
  <rect x="40" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">A · 状态符号</text>
  <g font-size="10.5">
    <circle cx="66" cy="105" r="5" fill="#34D399"/><text x="82" y="109" fill="#94A3B8">正常运行 / 已就绪（端口 3/3）</text>
    <text x="58" y="131" fill="#34D399" font-size="12" font-weight="700">✓</text><text x="82" y="131" fill="#94A3B8">通过（模块 7/7、LLM 3/3）</text>
    <text x="58" y="153" fill="#FBBF24" font-size="12" font-weight="700">⚠</text><text x="82" y="153" fill="#94A3B8">警告但已降级（Projects 用 Mock 兜底）</text>
    <text x="58" y="175" fill="#F87171" font-size="12" font-weight="700">✕</text><text x="82" y="175" fill="#94A3B8">失败 / 非预期错误（本轮 0）</text>
    <text x="58" y="197" fill="#64748B" font-size="12" font-weight="700">⏭</text><text x="82" y="197" fill="#94A3B8">跳过（需真实 LLM，不计失败）</text>
  </g>

  <!-- B 严重度 -->
  <rect x="496" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">B · 严重度与阻塞</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="514" y="98" width="26" height="13" rx="3" fill="#FBBF24"/><text x="552" y="109">低：P1 / P2 / P3（体验受损，功能可用）</text>
    <rect x="514" y="120" width="26" height="13" rx="3" fill="#34D399"/><text x="552" y="131">极低：P4 / P5 / P6（仅提示或局部展示）</text>
    <rect x="514" y="142" width="26" height="13" rx="3" fill="#F87171"/><text x="552" y="153">阻塞：阻断核心流程（本轮 0 项）</text>
    <text x="514" y="176" fill="#E2E8F0" font-size="10.5" font-weight="700">核心流程定义</text>
    <text x="514" y="194" fill="#94A3B8">Designer 生成 → 3D/2D 视图 → Quality → Deliver</text>
  </g>

  <!-- C 图表语法 -->
  <rect x="40" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">C · 图表语法</text>
  <g font-size="10.5" fill="#94A3B8">
    <polygon points="64,282 74,300 54,300" fill="#38BDF8" opacity="0.7"/>
    <text x="92" y="296">三角层 = 测试金字塔层级</text>
    <circle cx="66" cy="322" r="10" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="18 8"/>
    <text x="92" y="326">圆环 = 用例构成（341 / 1 / 2）</text>
    <rect x="58" y="340" width="14" height="18" rx="2" fill="#34D399" opacity="0.8"/>
    <text x="92" y="354">柱 = 用例规模（26 / 10 文件）</text>
    <line x1="58" y1="374" x2="82" y2="374" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="5 3"/>
    <polygon points="90,374 82,370 82,378" fill="#A78BFA"/>
    <text x="92" y="378">虚线箭头 = 隧道 / 异步链路</text>
    <text x="58" y="396" fill="#64748B" font-size="10">图上数字均为 2026-08-11 当日运行结果</text>
  </g>

  <!-- D 口径 -->
  <rect x="496" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">D · 关键口径</text>
  <g font-size="10.5" fill="#94A3B8">
    <text x="514" y="288">后端 344 = 341 通过 + 1 跳过 + 2 预期失败</text>
    <text x="514" y="310">前端 142 / 142 通过 · 10 个测试文件</text>
    <text x="514" y="332">合计 483 = 341 + 142，零非预期失败</text>
    <text x="514" y="354">模块 7/7（6 个正常 + Deep Learning 正常）</text>
    <text x="514" y="376">LLM 3/3 PASS · 生成接口 200 OK</text>
    <text x="514" y="396" fill="#6EE7B7">已知问题 6 项（P1–P6）· 阻塞 0 项</text>
  </g>

  <text x="40" y="428" fill="#94A3B8" font-size="10">适用范围：图 1-1、图 4-1、图 4-2 及第 7~10 章图表。所有数值以正文表格为准，不引入后续回归基线。</text>
  <text x="40" y="446" fill="#64748B" font-size="10">注：黄色 🟡 只表示低严重度，不代表失败；绿色 🟢 在缺陷表中表示极低严重度，在状态栏中表示运行正常。</text>
</svg>
