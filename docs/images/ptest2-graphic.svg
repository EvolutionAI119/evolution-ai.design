  <rect x="40" y="194" width="880" height="34" fill="#131C2A"/>
  <text x="56" y="215" fill="#FBBF24" font-size="10.5" font-weight="700">P3</text>
  <text x="126" y="215" fill="#E2E8F0" font-size="10.5">Projects + Quality</text>
