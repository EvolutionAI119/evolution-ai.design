  <!-- P2 -->
  <rect x="40" y="160" width="880" height="34" fill="#0F1622"/>
  <text x="56" y="181" fill="#FBBF24" font-size="10.5" font-weight="700">P2</text>
  <text x="126" y="181" fill="#E2E8F0" font-size="10.5">Projects</text>
  <circle cx="296" cy="177" r="4" fill="#FBBF24"/>
  <text x="308" y="181" fill="#94A3B8" font-size="10">低</text>
  <text x="400" y="181" fill="#94A3B8" font-size="10">列表接口 500 → Mock 兜底，展示层正常</text>
  <text x="848" y="181" fill="#6EE7B7" font-size="10">否</text>

