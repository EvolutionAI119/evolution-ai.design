  <!-- 汇总 -->
  <rect x="40" y="344" width="880" height="46" rx="8" fill="#0F241C" stroke="#34D399"/>
  <text x="60" y="372" fill="#6EE7B7" font-size="12.5" font-weight="700">6 项已知 · 0 项阻塞</text>
  <text x="240" y="372" fill="#94A3B8" font-size="10.5">P1–P6 均不阻断核心流程：Designer 生成 → 3D/2D 视图 → Quality → Deliver 全程可用</text>

  <text x="40" y="412" fill="#94A3B8" font-size="10">读法：每一行是一项已知问题，严重度色点（琥珀=低，绿=极低）与最右侧「阻塞」列共同回答一个问题——它会不会挡住核心演示路径。</text>
  <text x="40" y="430" fill="#64748B" font-size="10">口径：本矩阵只收录 2026-08-11 当日登记的 P1–P6；后续修复需另开记录，不回改本表。</text>
