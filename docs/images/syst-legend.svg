<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="428" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">综合集成研讨厅图例：三大体系 · 决策权 · 信号状态</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Workshop Legend</text>

  <!-- A 三大体系 -->
  <rect x="40" y="56" width="286" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="56" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">色 = 三大体系</text>
  <g font-size="10.5">
    <circle cx="68" cy="102" r="9" fill="#38BDF8" opacity=".85"/><text x="88" y="106" fill="#CBD5E1">专家体系</text>
    <text x="88" y="121" fill="#64748B" font-size="9">设计师、质量工程师 + LLM 对话</text>
    <text x="88" y="135" fill="#64748B" font-size="9">定性的源头与最终裁决</text>
    <rect x="61" y="152" width="16" height="16" rx="4" fill="#34D399" opacity=".85"/><text x="88" y="165" fill="#CBD5E1">机器体系</text>
    <text x="88" y="180" fill="#64748B" font-size="9">贝叶斯引擎、PyTorch、CLIP、渲染</text>
    <text x="88" y="194" fill="#64748B" font-size="9">海量探索与精确计算</text>
    <path d="M68 220 L77 214 L86 220 L86 232 L77 238 L68 232 Z" fill="#A78BFA" opacity=".85"/><text x="96" y="230" fill="#CBD5E1">知识体系</text>
    <text x="96" y="245" fill="#64748B" font-size="9">12+ 文档图谱、品牌库、纹理库</text>
    <text x="96" y="259" fill="#64748B" font-size="9">经验的存储、检索与激活</text>
  </g>
  <line x1="56" y1="276" x2="310" y2="276" stroke="#1E2A3A"/>
  <text x="56" y="296" fill="#94A3B8" font-size="9.5">三种形状而非三种颜色区分体系，</text>
  <text x="56" y="310" fill="#64748B" font-size="9">保证黑白打印时仍可辨认。</text>
  <text x="56" y="334" fill="#475569" font-size="9.5">「以人为主」= 圆始终在回路顶点。</text>

  <!-- B 决策与信号 -->
  <rect x="352" y="56" width="286" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="368" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">线 = 决策权归属</text>
  <g font-size="10.5">
    <line x1="370" y1="104" x2="418" y2="104" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#systl-ar1)"/>
    <text x="432" y="108" fill="#CBD5E1">人主导裁决</text>
    <text x="432" y="122" fill="#64748B" font-size="9">最终取舍与价值判断</text>
    <line x1="370" y1="146" x2="418" y2="146" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#systl-ar2)"/>
    <text x="432" y="150" fill="#CBD5E1">机器建议</text>
    <text x="432" y="164" fill="#64748B" font-size="9">可采纳、可拒绝、必须留痕</text>
    <line x1="370" y1="188" x2="418" y2="188" stroke="#F87171" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="432" y="192" fill="#CBD5E1">显式降级（503）</text>
    <text x="432" y="206" fill="#64748B" font-size="9">依赖缺失就报告缺失，不伪造</text>
  </g>
  <line x1="368" y1="220" x2="622" y2="220" stroke="#1E2A3A"/>
  <text x="368" y="238" fill="#E2E8F0" font-size="11" font-weight="600">点 = 信号状态</text>
  <circle cx="380" cy="256" r="6.5" fill="#34D399"/><text x="398" y="260" fill="#CBD5E1" font-size="9.5">有效观测（observe 已回填）</text>
  <circle cx="380" cy="280" r="6.5" fill="none" stroke="#64748B" stroke-width="1.6"/><text x="398" y="284" fill="#CBD5E1" font-size="9.5">缺失 / 未观测 / 已回退</text>
  <path d="M374 300 L386 300 M380 294 L380 312" stroke="#F87171" stroke-width="1.6"/><text x="398" y="308" fill="#CBD5E1" font-size="9.5">不可用（依赖或门禁拒绝）</text>
  <text x="368" y="334" fill="#475569" font-size="9">实心=有证据；空心=没有证据。</text>

  <!-- C 阈值与时间 -->
  <rect x="664" y="56" width="272" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="680" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">阈值与时间尺度</text>
  <g font-size="10">
    <text x="680" y="104" fill="#CBD5E1">连续性门禁</text>
    <text x="680" y="120" fill="#64748B" font-size="9.5">G1 ≤ 5° · G2 ≤ 2° · 位置 0.1 mm</text>
    <text x="680" y="140" fill="#CBD5E1">综合等级</text>
  </g>
  <g font-size="10" font-weight="700">
    <rect x="680" y="148" width="24" height="18" rx="4" fill="#0F241C" stroke="#34D399"/><text x="692" y="161" fill="#6EE7B7" text-anchor="middle">A</text>
    <rect x="710" y="148" width="24" height="18" rx="4" fill="#0E1E2E" stroke="#38BDF8"/><text x="722" y="161" fill="#7DD3FC" text-anchor="middle">B</text>
    <rect x="740" y="148" width="24" height="18" rx="4" fill="#2A1A0E" stroke="#FBBF24"/><text x="752" y="161" fill="#FCD34D" text-anchor="middle">C</text>
    <rect x="770" y="148" width="24" height="18" rx="4" fill="#2A1016" stroke="#F87171"/><text x="782" y="161" fill="#FCA5A5" text-anchor="middle">D</text>
  </g>
  <line x1="680" y1="180" x2="920" y2="180" stroke="#1E2A3A"/>
  <text x="680" y="200" fill="#CBD5E1" font-size="10">两个时间尺度</text>
  <g>
    <rect x="680" y="210" width="56" height="14" rx="3" fill="#F472B6" opacity=".8"/><text x="744" y="221" fill="#CBD5E1" font-size="9.5">秒—轮（快变量）</text>
    <rect x="680" y="232" width="150" height="14" rx="3" fill="#A78BFA" opacity=".8"/><text x="840" y="243" fill="#CBD5E1" font-size="9.5">月—年（序参量）</text>
    <rect x="680" y="254" width="248" height="14" rx="3" fill="#64748B" opacity=".5"/><text x="680" y="284" fill="#CBD5E1" font-size="9.5">尺度条越长，越不允许被单轮评分改写。</text>
  </g>
  <line x1="680" y1="296" x2="920" y2="296" stroke="#1E2A3A"/>
  <text x="680" y="314" fill="#64748B" font-size="9.5">22 维整车 · 14 维可搜索 · 8 维冻结</text>
  <text x="680" y="330" fill="#475569" font-size="9">阈值是工程共识的编码，不是机器自生的。</text>

  <text x="40" y="384" fill="#64748B" font-size="10.5">用法：先看体系色判断这个要素属于专家、机器还是知识；再看线型判断谁有裁决权；最后看信号点判断这条结论有没有证据支撑。</text>
  <text x="40" y="406" fill="#475569" font-size="10">本图编码与图 8 系列共用：人=蓝、机=绿、知=紫；红线永远代表「诚实报告问题」，不代表系统失败。</text>
  <defs>
    <marker id="systl-ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker>
    <marker id="systl-ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker>
  </defs>
</svg>
