<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="systg-env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".22"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity=".06"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#F472B6"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">快变量与序参量：参数空间的双重时间尺度</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Fast Variables vs Order Parameters</text>

  <!-- 图例 -->
  <line x1="94" y1="60" x2="128" y2="60" stroke="#F472B6" stroke-width="1.8"/>
  <text x="136" y="64" fill="#94A3B8" font-size="9.5">快变量轨迹（22 维逐轮取值）</text>
  <line x1="330" y1="60" x2="364" y2="60" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="372" y="64" fill="#94A3B8" font-size="9.5">包络（序参量允许的范围）</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="340" x2="890" y2="340" stroke="#334155" stroke-width="1.2"/>
  <line x1="90" y1="340" x2="90" y2="86" stroke="#334155" stroke-width="1.2"/>
  <text x="62" y="216" fill="#64748B" font-size="10" transform="rotate(-90 62 216)" text-anchor="middle">参数值 / 偏离度</text>
  <g fill="#475569" font-size="10" text-anchor="middle">
    <text x="90" y="358">秒</text><text x="290" y="358">轮</text><text x="490" y="358">天</text><text x="690" y="358">月</text><text x="880" y="358">年</text>
  </g>
  <text x="880" y="374" fill="#64748B" font-size="9.5" text-anchor="end">时间（非线性尺度）</text>

  <!-- 包络 -->
  <path d="M90 224 C200 216 400 206 600 199 L620 149 C740 141 820 139 880 140 L880 160 C820 162 740 170 620 181 L600 231 C400 252 200 290 90 276 Z" fill="url(#systg-env)" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- 快变量 -->
  <polyline points="90,224 123,273 156,221 189,267 222,218 255,261 288,214 321,256 354,211 387,250 420,208 453,244 486,205 519,238 552,202 585,232 618,152 651,178 684,147 717,173 750,145 783,168 816,142 849,163 882,140"
            fill="none" stroke="#F472B6" stroke-width="1.8"/>

  <!-- 跃迁线 -->
  <line x1="620" y1="340" x2="620" y2="96" stroke="#F87171" stroke-width="1.2" stroke-dasharray="4 4" opacity=".7"/>
  <text x="628" y="88" fill="#FCA5A5" font-size="10" font-weight="600">序参量跃迁：知识库 / 重训 / 阈值修订</text>

  <!-- 振幅标注 -->
  <g stroke="#94A3B8" stroke-width="1">
    <line x1="288" y1="214" x2="288" y2="256"/>
    <line x1="282" y1="214" x2="294" y2="214"/>
    <line x1="282" y1="256" x2="294" y2="256"/>
  </g>
  <text x="300" y="240" fill="#94A3B8" font-size="9.5">振幅 = 快变量可调范围</text>

  <!-- 慢变量基线 -->
  <path d="M90 250 C250 242 450 222 600 215 L620 165 C740 158 820 152 880 150" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <text x="96" y="204" fill="#C4B5FD" font-size="9.5">序参量基线</text>
  <path d="M150 208 L128 244" stroke="#A78BFA" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="640" y="128" fill="#C4B5FD" font-size="9.5">跃迁后基线抬高</text>
  <path d="M676 132 L664 152" stroke="#A78BFA" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 三句读法 -->
  <g font-size="10">
    <text x="40" y="396" fill="#94A3B8">① 粉色锯齿是快变量：秒—轮级，由采集函数驱动，服务当前收敛；</text>
    <text x="40" y="414" fill="#94A3B8">② 紫色带是序参量给的允许范围：品牌基因、哲学与质量标准，月—年级才动一次；</text>
    <text x="40" y="432" fill="#94A3B8">③ 红色竖线是「知识体系事件」：序参量跃迁必须走流程，不能靠单轮评分偷偷改。</text>
  </g>
  <text x="40" y="452" fill="#475569" font-size="9.5">只有快变量收敛是局部优化，只有序参量跃迁是空中楼阁；两者耦合，才叫深度演化。</text>
</svg>
