<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="paper2-comb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity=".55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">NURBS construction: control polygon, evaluated curve, continuity comb</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Parametric Geometry</text>

  <!-- 左：控制多边形与曲线 -->
  <rect x="24" y="56" width="560" height="330" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
  <text x="44" y="80" fill="#7DD3FC" font-size="12.5" font-weight="700">Control net → evaluated curve</text>
  <text x="566" y="80" fill="#64748B" font-size="9" text-anchor="end">p = 3 · clamped knots</text>

  <g stroke="#16202E">
    <line x1="60" y1="130" x2="560" y2="130"/>
    <line x1="60" y1="190" x2="560" y2="190"/>
    <line x1="60" y1="250" x2="560" y2="250"/>
    <line x1="60" y1="310" x2="560" y2="310"/>
  </g>

  <polyline points="80,320 150,300 220,240 320,225 400,170 470,155 530,120"
            fill="none" stroke="#38BDF8" stroke-width="1.3" stroke-dasharray="5 4" opacity=".8"/>
  <path d="M80 320 C 140 315, 190 285, 240 258 C 290 232, 340 235, 390 195 C 440 158, 480 150, 530 120"
        fill="none" stroke="#34D399" stroke-width="2.8"/>
  <g fill="#0B101A" stroke="#38BDF8" stroke-width="1.8">
    <circle cx="80" cy="320" r="4.5"/><circle cx="150" cy="300" r="4.5"/><circle cx="220" cy="240" r="4.5"/>
    <circle cx="320" cy="225" r="4.5"/><circle cx="400" cy="170" r="4.5"/><circle cx="470" cy="155" r="4.5"/>
    <circle cx="530" cy="120" r="4.5"/>
  </g>
  <g font-size="8.5" fill="#7DD3FC">
    <text x="86" y="336">P0</text><text x="156" y="316">P1</text><text x="226" y="256">P2</text>
    <text x="326" y="241">P3</text><text x="406" y="186">P4</text><text x="476" y="171">P5</text>
    <text x="536" y="116">P6</text>
  </g>
  <text x="120" y="214" fill="#64748B" font-size="9">control polygon (blue, dashed)</text>
  <text x="330" y="150" fill="#6EE7B7" font-size="9">evaluated curve P(u)</text>

  <line x1="80" y1="366" x2="530" y2="366" stroke="#1E2A3A"/>
  <g stroke="#475569">
    <line x1="80" y1="362" x2="80" y2="370"/>
    <line x1="192" y1="362" x2="192" y2="370"/>
    <line x1="305" y1="362" x2="305" y2="370"/>
    <line x1="417" y1="362" x2="417" y2="370"/>
    <line x1="530" y1="362" x2="530" y2="370"/>
  </g>
  <g font-size="8.5" fill="#64748B" text-anchor="middle">
    <text x="80" y="382">0</text><text x="192" y="382">0.25</text><text x="305" y="382">0.5</text><text x="417" y="382">0.75</text><text x="530" y="382">1</text>
  </g>
  <text x="44" y="116" fill="#94A3B8" font-size="9.5">P(u) = Σ N_i,p(u) · P_i</text>

  <!-- 右：连续性梳与验收 -->
  <rect x="600" y="56" width="336" height="330" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="618" y="80" fill="#F9A8D4" font-size="12.5" font-weight="700">Curvature comb &amp; acceptance</text>

  <path d="M620 168 C 660 148, 700 180, 740 158 C 780 136, 820 156, 860 132 C 884 118, 898 116, 914 114"
        fill="none" stroke="#34D399" stroke-width="1.6"/>
  <g stroke="#38BDF8" stroke-width="1" opacity=".75">
    <line x1="628" y1="165" x2="628" y2="185"/><line x1="644" y1="158" x2="644" y2="172"/>
    <line x1="660" y1="153" x2="660" y2="160"/><line x1="676" y1="158" x2="676" y2="176"/>
    <line x1="692" y1="169" x2="692" y2="192"/><line x1="708" y1="175" x2="708" y2="194"/>
    <line x1="724" y1="172" x2="724" y2="188"/><line x1="740" y1="161" x2="740" y2="171"/>
    <line x1="756" y1="148" x2="756" y2="150"/><line x1="772" y1="140" x2="772" y2="147"/>
    <line x1="788" y1="141" x2="788" y2="157"/><line x1="804" y1="148" x2="804" y2="166"/>
    <line x1="820" y1="152" x2="820" y2="170"/><line x1="836" y1="145" x2="836" y2="154"/>
    <line x1="852" y1="135" x2="852" y2="138"/><line x1="868" y1="128" x2="868" y2="139"/>
    <line x1="884" y1="124" x2="884" y2="142"/><line x1="900" y1="120" x2="900" y2="134"/>
  </g>
  <text x="914" y="204" fill="#64748B" font-size="8.5" text-anchor="end">comb length ∝ curvature</text>

  <g font-size="9.5">
    <rect x="618" y="216" width="300" height="30" rx="6" fill="#0F241C" stroke="#34D399" stroke-opacity=".35"/>
    <text x="630" y="235" fill="#6EE7B7">G0 position · seam gap ≤ 0.1 mm</text>

    <rect x="618" y="252" width="300" height="30" rx="6" fill="#0E1E2E" stroke="#38BDF8" stroke-opacity=".35"/>
    <text x="630" y="271" fill="#7DD3FC">G1 tangent · angle ≤ 1.0°</text>

    <rect x="618" y="288" width="300" height="30" rx="6" fill="#2A1A0E" stroke="#FBBF24" stroke-opacity=".35"/>
    <text x="630" y="307" fill="#FCD34D">G2 curvature · visual band 5°</text>
  </g>
  <rect x="618" y="330" width="100" height="10" rx="3" fill="#34D399" opacity=".75"/>
  <rect x="718" y="330" width="100" height="10" rx="3" fill="#FBBF24" opacity=".75"/>
  <rect x="818" y="330" width="100" height="10" rx="3" fill="#F87171" opacity=".75"/>
  <g font-size="8.5">
    <text x="618" y="354" fill="#6EE7B7">0–1° pass</text>
    <text x="718" y="354" fill="#FCD34D">1–5° visible</text>
    <text x="818" y="354" fill="#FCA5A5">&gt; 5° fail</text>
  </g>
  <text x="618" y="374" fill="#475569" font-size="8.5">Raw geometry is reported, never certified.</text>

  <text x="24" y="410" fill="#94A3B8" font-size="10.5">How to read: blue dots/dashes are the control net; the green curve is analytic, not a fitted polyline; on the right, comb length reveals curvature, so a kink is a spike.</text>
  <text x="24" y="432" fill="#64748B" font-size="10">Key takeaway: 0.1 mm and 1.0° are per-pair checks printed to TXT/CSV; the 5° band is a visual guide, not a substitute for G2 curvature continuity.</text>
  <text x="24" y="450" fill="#475569" font-size="9.5">Curve and comb are schematic; labels and thresholds match §4.3.</text>
</svg>
