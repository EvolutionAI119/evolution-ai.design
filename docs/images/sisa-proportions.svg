<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="428" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#FBBF24"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">六种车型的三段分层比例：hood / belt / trunk</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Body Proportion Chart</text>

  <!-- 网格 -->
  <g stroke="#1E2A3A">
    <line x1="80" y1="80" x2="900" y2="80"/>
    <line x1="80" y1="130" x2="900" y2="130"/>
    <line x1="80" y1="180" x2="900" y2="180"/>
    <line x1="80" y1="230" x2="900" y2="230"/>
    <line x1="80" y1="280" x2="900" y2="280"/>
  </g>
  <line x1="80" y1="330" x2="900" y2="330" stroke="#475569"/>
  <line x1="80" y1="80" x2="80" y2="330" stroke="#475569"/>
  <g font-size="9" fill="#64748B" text-anchor="end">
    <text x="70" y="333">0.40</text><text x="70" y="283">0.50</text><text x="70" y="233">0.60</text>
    <text x="70" y="183">0.70</text><text x="70" y="133">0.80</text><text x="70" y="83">0.90</text>
  </g>
  <text x="38" y="206" fill="#64748B" font-size="9.5" text-anchor="middle" transform="rotate(-90 38 206)">比例</text>

  <!-- 图例 -->
  <g font-size="9">
    <rect x="638" y="58" width="10" height="10" rx="2" fill="#38BDF8"/>
    <text x="654" y="67" fill="#94A3B8">hood</text>
    <rect x="700" y="58" width="10" height="10" rx="2" fill="#A78BFA"/>
    <text x="716" y="67" fill="#94A3B8">belt</text>
    <rect x="762" y="58" width="10" height="10" rx="2" fill="#34D399"/>
    <text x="778" y="67" fill="#94A3B8">trunk</text>
  </g>

  <!-- sedan -->
  <g>
    <rect x="104.5" y="230" width="27" height="100" fill="#38BDF8"/>
    <rect x="134.5" y="160" width="27" height="170" fill="#A78BFA"/>
    <rect x="164.5" y="200" width="27" height="130" fill="#34D399"/>
  </g>
  <text x="118" y="224" fill="#7DD3FC" font-size="8" text-anchor="middle">.60</text>
  <text x="148" y="154" fill="#C4B5FD" font-size="8" text-anchor="middle">.74</text>
  <text x="178" y="194" fill="#6EE7B7" font-size="8" text-anchor="middle">.66</text>

  <!-- suv -->
  <g>
    <rect x="240.5" y="200" width="27" height="130" fill="#38BDF8"/>
    <rect x="270.5" y="130" width="27" height="200" fill="#A78BFA"/>
    <rect x="300.5" y="170" width="27" height="160" fill="#34D399"/>
  </g>
  <text x="254" y="194" fill="#7DD3FC" font-size="8" text-anchor="middle">.66</text>
  <text x="284" y="124" fill="#C4B5FD" font-size="8" text-anchor="middle">.80</text>
  <text x="314" y="164" fill="#6EE7B7" font-size="8" text-anchor="middle">.72</text>

  <!-- coupe -->
  <g>
    <rect x="376.5" y="220" width="27" height="110" fill="#38BDF8"/>
    <rect x="406.5" y="170" width="27" height="160" fill="#A78BFA"/>
    <rect x="436.5" y="180" width="27" height="150" fill="#34D399"/>
  </g>
  <text x="390" y="214" fill="#7DD3FC" font-size="8" text-anchor="middle">.62</text>
  <text x="420" y="164" fill="#C4B5FD" font-size="8" text-anchor="middle">.72</text>
  <text x="450" y="174" fill="#6EE7B7" font-size="8" text-anchor="middle">.70</text>

  <!-- sport -->
  <g>
    <rect x="512.5" y="200" width="27" height="130" fill="#38BDF8"/>
    <rect x="542.5" y="170" width="27" height="160" fill="#A78BFA"/>
    <rect x="572.5" y="170" width="27" height="160" fill="#34D399"/>
  </g>
  <text x="526" y="194" fill="#7DD3FC" font-size="8" text-anchor="middle">.66</text>
  <text x="556" y="164" fill="#C4B5FD" font-size="8" text-anchor="middle">.72</text>
  <text x="586" y="164" fill="#6EE7B7" font-size="8" text-anchor="middle">.72</text>

  <!-- mpv -->
  <g>
    <rect x="648.5" y="270" width="27" height="60" fill="#38BDF8"/>
    <rect x="678.5" y="150" width="27" height="180" fill="#A78BFA"/>
    <rect x="708.5" y="160" width="27" height="170" fill="#34D399"/>
  </g>
  <text x="662" y="264" fill="#7DD3FC" font-size="8" text-anchor="middle">.52</text>
  <text x="692" y="144" fill="#C4B5FD" font-size="8" text-anchor="middle">.76</text>
  <text x="722" y="154" fill="#6EE7B7" font-size="8" text-anchor="middle">.74</text>

  <!-- pickup -->
  <g>
    <rect x="784.5" y="230" width="27" height="100" fill="#38BDF8"/>
    <rect x="814.5" y="140" width="27" height="190" fill="#A78BFA"/>
    <rect x="844.5" y="130" width="27" height="200" fill="#34D399"/>
  </g>
  <text x="798" y="224" fill="#7DD3FC" font-size="8" text-anchor="middle">.60</text>
  <text x="828" y="134" fill="#C4B5FD" font-size="8" text-anchor="middle">.78</text>
  <text x="858" y="124" fill="#6EE7B7" font-size="8" text-anchor="middle">.80</text>

  <!-- x 标签 -->
  <g font-size="10" fill="#94A3B8" text-anchor="middle">
    <text x="148" y="348">sedan</text>
    <text x="284" y="348">suv</text>
    <text x="420" y="348">coupe</text>
    <text x="556" y="348">sport</text>
    <text x="692" y="348">mpv</text>
    <text x="828" y="348">pickup</text>
  </g>
  <text x="80" y="366" fill="#64748B" font-size="9">同一组 hood / belt / trunk 比例，分别驱动各车型的侧窗与腰线位置。</text>

  <text x="24" y="392" fill="#94A3B8" font-size="10.5">读图：每组三根柱依次是 hood、belt、trunk；SUV 的 belt 最高（0.80），MPV 的 hood 最低（0.52），pickup 的 trunk 最高（0.80）。</text>
  <text x="24" y="410" fill="#64748B" font-size="10">关键结论：SUV hood 取 0.66，逼近 SISA 实测 hood_height_ratio ≈ 0.69；分层比例而不是单一缩放，才是修复「SUV 比例失真」的关键。</text>
</svg>
