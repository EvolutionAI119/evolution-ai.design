<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="438" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#38BDF8"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">生产部署拓扑（内地合规 + 同域反代）</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Deployment Topology</text>
  <rect x="40" y="190" width="110" height="60" rx="10" fill="#0B101A" stroke="#64748B"/>
  <text x="95" y="218" fill="#E2E8F0" font-size="12" font-weight="700" text-anchor="middle">浏览器</text>
  <text x="95" y="236" fill="#94A3B8" font-size="10" text-anchor="middle">用户端</text>
  <rect x="210" y="170" width="150" height="100" rx="10" fill="#0B1A2E" stroke="#38BDF8"/>
  <text x="285" y="200" fill="#7DD3FC" font-size="12.5" font-weight="700" text-anchor="middle">Nginx (TLS)</text>
  <text x="285" y="222" fill="#94A3B8" font-size="10" text-anchor="middle">同域反代</text>
  <text x="285" y="240" fill="#64748B" font-size="9.5" text-anchor="middle">/ → dist 静态</text>
  <text x="285" y="256" fill="#64748B" font-size="9.5" text-anchor="middle">/api &amp; /admin → 后端</text>
  <rect x="420" y="70" width="180" height="70" rx="10" fill="#0B101A" stroke="#34D399"/>
  <text x="510" y="100" fill="#6EE7B7" font-size="12" font-weight="700" text-anchor="middle">GitHub Pages / dist</text>
  <text x="510" y="120" fill="#94A3B8" font-size="10" text-anchor="middle">公开静态站（零 Admin 代码）</text>
  <rect x="420" y="170" width="180" height="100" rx="10" fill="#0F241C" stroke="#A78BFA"/>
  <text x="510" y="200" fill="#C4B5FD" font-size="12" font-weight="700" text-anchor="middle">FastAPI 后端</text>
  <text x="510" y="220" fill="#94A3B8" font-size="10" text-anchor="middle">/api/v1/* 业务接口</text>
  <text x="510" y="238" fill="#94A3B8" font-size="10" text-anchor="middle">/admin 独立后台</text>
  <text x="510" y="256" fill="#64748B" font-size="9.5" text-anchor="middle">GUEST_MODE（封存期）</text>
  <rect x="420" y="290" width="180" height="70" rx="10" fill="#0B101A" stroke="#FBBF24"/>
  <text x="510" y="320" fill="#FCD34D" font-size="12" font-weight="700" text-anchor="middle">PostgreSQL + Redis</text>
  <text x="510" y="340" fill="#94A3B8" font-size="10" text-anchor="middle">数据 + 会话/限流</text>
  <rect x="680" y="150" width="220" height="130" rx="10" fill="#1A1230" stroke="#A78BFA" stroke-dasharray="4 3"/>
  <text x="790" y="178" fill="#C4B5FD" font-size="12" font-weight="700" text-anchor="middle">京东云 2C4G（内地合规）</text>
  <text x="790" y="198" fill="#94A3B8" font-size="10" text-anchor="middle">2G swap · Docker 四服务栈</text>
  <text x="790" y="216" fill="#94A3B8" font-size="10" text-anchor="middle">域名转入境内 + ICP 备案</text>
  <text x="790" y="234" fill="#64748B" font-size="9.5" text-anchor="middle">含微信扫码须内地服务器</text>
  <text x="790" y="256" fill="#FCD34D" font-size="9.5" text-anchor="middle">PIPL 数据不出境</text>
  <defs><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker></defs>
  <line x1="150" y1="220" x2="210" y2="220" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#d)"/>
  <line x1="360" y1="180" x2="420" y2="105" stroke="#34D399" stroke-width="1.6" marker-end="url(#d)"/>
  <line x1="360" y1="220" x2="420" y2="220" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#d)"/>
  <line x1="510" y1="270" x2="510" y2="290" stroke="#FBBF24" stroke-width="1.6" marker-end="url(#d)"/>
  <line x1="600" y1="220" x2="680" y2="220" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="640" y="212" fill="#64748B" font-size="9" text-anchor="middle">部署承载</text></svg>