<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">图例：本报告图表的符号、线型与阈值</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Legend · Symbols, Lines, Thresholds</text>

  <!-- A 线型 -->
  <rect x="40" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">A · 线型语义</text>
  <g font-size="10.5" fill="#94A3B8">
    <line x1="58" y1="105" x2="120" y2="105" stroke="#34D399" stroke-width="2"/>
    <text x="134" y="109">实测值 / 达标值（HUD 与公式一致）</text>
    <line x1="58" y1="127" x2="120" y2="127" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="134" y="131">设计限值：峰值 1.25 · 延迟 100 ms</text>
    <line x1="58" y1="149" x2="120" y2="149" stroke="#F87171" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="134" y="153">退化 / 越界：η 归零 → ×1.31</text>
    <line x1="58" y1="171" x2="120" y2="171" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
    <text x="134" y="175">舒适限：45°/s（晕动阈值内）</text>
    <line x1="58" y1="193" x2="120" y2="193" stroke="#A78BFA" stroke-width="2"/>
    <text x="134" y="197">理论上界：8.0× / 1.3145</text>
  </g>

  <!-- B 图元 -->
  <rect x="496" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">B · 图元语义</text>
  <g font-size="10.5" fill="#94A3B8">
    <circle cx="602" cy="105" r="6" fill="#34D399"/>
    <text x="620" y="109">实测点 / 单车型读数</text>
    <rect x="596" y="120" width="12" height="20" rx="2" fill="#0F241C" stroke="#34D399"/>
    <text x="620" y="134">柱 = 六车型数值（图 6 / 图 8）</text>
    <circle cx="602" cy="158" r="7" fill="none" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="620" y="162">环 = 风扇差动通道</text>
    <polygon points="602,175 610,191 594,191" fill="#2A1A0E" stroke="#FBBF24"/>
    <text x="620" y="190">三角 = 起飞瞬间能耗峰值</text>
    <rect x="590" y="200" width="24" height="14" rx="3" fill="none" stroke="#64748B" stroke-dasharray="3 3"/>
    <text x="620" y="211">虚线框 = 设计包络（±2° / ≥3×）</text>
  </g>

  <!-- C 判定 -->
  <rect x="40" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">C · 判定语义</text>
  <g font-size="10.5">
    <text x="58" y="292" fill="#34D399" font-size="12" font-weight="700">✓</text><text x="82" y="292" fill="#94A3B8">达标且余量 &gt; 10%（姿态、峰值因子）</text>
    <text x="58" y="314" fill="#FBBF24" font-size="12" font-weight="700">⚠</text><text x="82" y="314" fill="#94A3B8">达标但余量 &lt; 10%（sport 续航 5.7%）</text>
    <text x="58" y="336" fill="#F87171" font-size="12" font-weight="700">✕</text><text x="82" y="336" fill="#94A3B8">不达标 / 如实退化（UI 与后端同步转假）</text>
    <text x="58" y="358" fill="#A78BFA" font-size="12" font-weight="700">◆</text><text x="82" y="358" fill="#94A3B8">理论参考值，不参与达标判定</text>
    <text x="58" y="380" fill="#64748B" font-size="10">判定口径：五项指标全部达标才计「全达标」</text>
  </g>

  <!-- D 阈值 -->
  <rect x="496" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">D · 关键阈值与参数界</text>
  <g font-size="10.5" fill="#94A3B8">
    <text x="514" y="288">姿态偏差 ≤ ±2°（实测 0.728°~0.767°）</text>
    <text x="514" y="310">360° 转向 15.0 s @ 峰值 45°/s</text>
    <text x="514" y="332">续航倍数 ≥ 3×（实测 3.17×~3.83×）</text>
    <text x="514" y="354">峰值因子 ≤ 1.25（实测 1.14~1.17）</text>
    <text x="514" y="376">飞控延迟 ≤ 100 ms（实测 76~80 ms）</text>
    <text x="514" y="396">场份额 s ≤ 0.75 · η ∈ [0, 0.3]</text>
  </g>

  <text x="40" y="428" fill="#94A3B8" font-size="10">适用范围：图 1~图 10。所有阈值与数值取自本报告六车型包线表，不使用任何外部测试基线。</text>
  <text x="40" y="446" fill="#64748B" font-size="10">图号约定：图 9 为悬浮姿态全景，图 10 即本图例；图内琥珀色始终表示「达标但余量偏小」。</text>
</svg>
