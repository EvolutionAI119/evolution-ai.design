<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="428" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#FBBF24"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Source-Map Legend: Type, Evidence, Level</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Academic Sources</text>

  <rect x="40" y="56" width="286" height="290" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="56" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">Colour = source type</text>
  <g font-size="10.5">
    <rect x="58" y="96" width="14" height="14" rx="3" fill="#A78BFA"/><text x="82" y="107" fill="#CBD5E1">Meta-theory / design studies</text>
    <text x="82" y="121" fill="#64748B" font-size="8.5">Love's 9 levels · Zhang's triad</text>
    <rect x="58" y="136" width="14" height="14" rx="3" fill="#38BDF8"/><text x="82" y="147" fill="#CBD5E1">Automotive styling theory</text>
    <text x="82" y="161" fill="#64748B" font-size="8.5">Zhao's knowledge system · three layers</text>
    <rect x="58" y="176" width="14" height="14" rx="3" fill="#34D399"/><text x="82" y="187" fill="#CBD5E1">Practice and principles</text>
    <text x="82" y="201" fill="#64748B" font-size="8.5">Geely's nine · R-corner · colour</text>
    <rect x="58" y="216" width="14" height="14" rx="3" fill="#FBBF24"/><text x="82" y="227" fill="#CBD5E1">Traditional aesthetics</text>
    <text x="82" y="241" fill="#64748B" font-size="8.5">Kao Gong Ji · Tiangong Kaiwu · Six Laws</text>
  </g>
  <line x1="58" y1="262" x2="308" y2="262" stroke="#1E2A3A"/>
  <text x="58" y="282" fill="#94A3B8" font-size="9.5">Colour marks provenance, not academic rank</text>
  <text x="58" y="298" fill="#64748B" font-size="9.5">The same source keeps its colour everywhere.</text>
  <text x="58" y="318" fill="#475569" font-size="9.5">Four types support all ten dimensions.</text>

  <rect x="352" y="56" width="286" height="290" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="368" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">Marker = evidence strength</text>
  <g>
    <circle cx="376" cy="102" r="7" fill="#34D399"/><text x="396" y="106" fill="#CBD5E1" font-size="10.5">Primary source</text>
    <text x="396" y="120" fill="#64748B" font-size="8.5">Traceable; basis for definitions and frames</text>
    <circle cx="376" cy="142" r="7" fill="#0F1622" stroke="#FBBF24" stroke-width="1.6"/><path d="M369 142 A7 7 0 0 1 383 142 Z" fill="#FBBF24"/><text x="396" y="146" fill="#CBD5E1" font-size="10.5">Review / secondary citation</text>
    <text x="396" y="160" fill="#64748B" font-size="8.5">Second-hand; verify against the original</text>
    <circle cx="376" cy="182" r="7" fill="none" stroke="#64748B" stroke-width="1.6"/><text x="396" y="186" fill="#CBD5E1" font-size="10.5">To be evidenced</text>
    <text x="396" y="200" fill="#64748B" font-size="8.5">Raised here; no direct literature yet</text>
  </g>
  <line x1="368" y1="222" x2="622" y2="222" stroke="#1E2A3A"/>
  <text x="368" y="242" fill="#94A3B8" font-size="9.5">Evidence level does not decide inclusion</text>
  <text x="368" y="260" fill="#64748B" font-size="9">Unverified items stay but must be marked,</text>
  <text x="368" y="276" fill="#64748B" font-size="9">so inference is never passed off as fact.</text>
  <text x="368" y="300" fill="#475569" font-size="9">Rule: cite if you can, say so if you cannot.</text>

  <rect x="664" y="56" width="272" height="290" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="680" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">Levels and relations</text>
  <g>
    <rect x="680" y="92" width="28" height="12" rx="2" fill="#A78BFA" opacity=".9"/>
    <rect x="712" y="92" width="28" height="12" rx="2" fill="#A78BFA" opacity=".72"/>
    <rect x="744" y="92" width="28" height="12" rx="2" fill="#38BDF8" opacity=".62"/>
    <rect x="776" y="92" width="28" height="12" rx="2" fill="#38BDF8" opacity=".46"/>
    <rect x="808" y="92" width="28" height="12" rx="2" fill="#34D399" opacity=".5"/>
    <rect x="840" y="92" width="28" height="12" rx="2" fill="#FBBF24" opacity=".6"/>
  </g>
  <text x="680" y="122" fill="#64748B" font-size="9">L1–L9: philosophy (deep) to concept (shallow)</text>
  <g font-size="10.5">
    <line x1="680" y1="150" x2="740" y2="150" stroke="#94A3B8" stroke-width="2"/><text x="756" y="154" fill="#CBD5E1">Inherited</text>
    <line x1="680" y1="184" x2="740" y2="184" stroke="#F472B6" stroke-width="1.8" stroke-dasharray="6 5"/><text x="756" y="188" fill="#CBD5E1">Extended</text>
    <line x1="680" y1="218" x2="732" y2="218" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#meta2l-arw-en)" marker-start="url(#meta2l-arw-en)"/><text x="756" y="222" fill="#CBD5E1">Feed-back</text>
  </g>
  <line x1="680" y1="244" x2="920" y2="244" stroke="#1E2A3A"/>
  <text x="680" y="264" fill="#94A3B8" font-size="9.5">Read levels by question, not content:</text>
  <text x="680" y="280" fill="#64748B" font-size="9">L1 asks "what is the world"</text>
  <text x="680" y="294" fill="#64748B" font-size="9">L2 asks "how do we know"</text>
  <text x="680" y="308" fill="#64748B" font-size="9">L5–L7 ask "process and method"</text>
  <text x="680" y="326" fill="#475569" font-size="9">Same content, different level, different meaning.</text>

  <text x="40" y="378" fill="#64748B" font-size="10.5">How to read: for each index row, go source colour → evidence marker → level, i.e. credibility first, then the layer it serves.</text>
  <text x="40" y="402" fill="#475569" font-size="10">Every figure here shares the palette: purple = meta-theory, blue = styling theory, green = practice, amber = tradition.</text>
  <defs>
    <marker id="meta2l-arw-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#A78BFA"/>
    </marker>
  </defs>
</svg>
