<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Legend: colors, lines, nodes and markers in architecture figures</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Architecture Legend</text>

  <rect x="40" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">A · Layer colors</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="58" y="95" width="26" height="13" rx="3" fill="#38BDF8"/><text x="96" y="106">L1 Frontend (Vue 3 SPA)</text>
    <rect x="58" y="115" width="26" height="13" rx="3" fill="#F472B6"/><text x="96" y="126">L2 Gateway (proxy / tunnel)</text>
    <rect x="58" y="135" width="26" height="13" rx="3" fill="#34D399"/><text x="96" y="146">L3 Backend (FastAPI orchestration)</text>
    <rect x="58" y="155" width="26" height="13" rx="3" fill="#FBBF24"/><text x="96" y="166">L4 Algorithm (standalone package)</text>
    <rect x="58" y="175" width="26" height="13" rx="3" fill="#A78BFA"/><text x="96" y="186">L5 Infrastructure (data / storage)</text>
    <rect x="58" y="195" width="26" height="13" rx="3" fill="#F87171"/><text x="96" y="206">Failure / rejection / degradation path</text>
  </g>

  <rect x="496" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">B · Lines and links</text>
  <g font-size="10.5" fill="#94A3B8">
    <line x1="514" y1="105" x2="574" y2="105" stroke="#34D399" stroke-width="2"/>
    <text x="590" y="109">Synchronous call (HTTP / function)</text>
    <line x1="514" y1="127" x2="574" y2="127" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="590" y="131">Async trigger / polling (training, review)</text>
    <line x1="514" y1="149" x2="574" y2="149" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
    <text x="590" y="153">Optional / degraded path (explicit fallback)</text>
    <line x1="514" y1="171" x2="574" y2="171" stroke="#F87171" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="590" y="175">Error branch / rejection loop</text>
    <text x="514" y="194" fill="#94A3B8">1—N = one-to-many (Project → ModelFile …)</text>
  </g>

  <rect x="40" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">C · Node shapes</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="58" y="279" width="26" height="13" rx="3" fill="#12293D" stroke="#38BDF8"/>
    <text x="96" y="290">Rounded rect = module / service / layer</text>
    <ellipse cx="71" cy="301" rx="13" ry="5" fill="#241A40" stroke="#A78BFA"/>
    <rect x="58" y="301" width="26" height="11" fill="#241A40" stroke="#A78BFA"/>
    <ellipse cx="71" cy="312" rx="13" ry="5" fill="#241A40" stroke="#A78BFA"/>
    <text x="96" y="312">Cylinder = data table / persistence</text>
    <polygon points="71,325 79,333 71,341 63,333" fill="#2A1A0E" stroke="#FBBF24"/>
    <text x="96" y="337">Diamond = decision gate / branch</text>
    <polygon points="58,352 74,352 70,364 54,364" fill="#2A1420" stroke="#F472B6"/>
    <text x="96" y="363">Parallelogram = external package / service</text>
    <rect x="58" y="374" width="26" height="13" rx="3" fill="#12293D" stroke="#34D399"/>
    <rect x="61" y="377" width="20" height="7" rx="2" fill="none" stroke="#34D399" stroke-dasharray="2 2"/>
    <text x="96" y="385">Double border = optional capability (explicit fallback)</text>
  </g>

  <rect x="496" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">D · Markers and states</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="514" y="279" width="30" height="14" rx="3" fill="#2A1420" stroke="#F87171"/>
    <text x="529" y="290" fill="#F87171" font-size="9" text-anchor="middle">503</text>
    <text x="556" y="290">Capability not ready → explicit degradation</text>
    <text x="514" y="317" fill="#34D399" font-size="13">✓</text>
    <text x="556" y="316">Approved / completed / delivered</text>
    <text x="514" y="339" fill="#F87171" font-size="13">✕</text>
    <text x="556" y="338">Rejected / failed / terminal</text>
    <text x="514" y="360" fill="#94A3B8">①②</text>
    <text x="556" y="360">Step or path index (reading order)</text>
    <text x="514" y="382" fill="#94A3B8" font-size="9.5">0.1 mm / 1.0°</text>
    <text x="556" y="382">Geometric tolerance (position / angle)</text>
  </g>

  <text x="40" y="428" fill="#94A3B8" font-size="10">Prefix rule: module filename = route prefix; exceptions import_export → /import-export, llm_proxy → /llm, auth → /auth + /api-keys.</text>
  <text x="40" y="446" fill="#64748B" font-size="10">Figure numbering: Fig. X-Y = chapter X, figure Y; this card decodes the encoding used in the architecture figures above.</text>
</svg>
