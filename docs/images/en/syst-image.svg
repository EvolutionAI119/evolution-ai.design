    <path d="M352 352 L352 322 Q354 300 380 292 L406 284 Q434 250 478 246 L540 246 Q578 248 600 274 L624 288 Q638 296 638 316 L638 352 Z" fill="#0E1E2E" stroke="#38BDF8" stroke-width="1.8"/>
