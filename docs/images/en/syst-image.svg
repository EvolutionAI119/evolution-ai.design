  <rect x="236" y="118" width="488" height="262" rx="32" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="8 6"/>
  <text x="480" y="142" fill="#94A3B8" font-size="10.5" text-anchor="middle">Open boundary · continuous exchange of matter, energy and information</text>

