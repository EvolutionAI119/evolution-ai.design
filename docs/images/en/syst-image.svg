  <text x="480" y="178" fill="#E2E8F0" font-size="12.5" font-weight="700" text-anchor="middle">Styling Development OCGS</text>
  <text x="480" y="195" fill="#64748B" font-size="9.5" text-anchor="middle">open · giant · complex · not fully knowable</text>

  <g font-size="8.5" text-anchor="middle">
    <rect x="256" y="216" width="78" height="24" rx="6" fill="#131C2A" stroke="#1E2A3A"/><text x="295" y="232" fill="#94A3B8">Parameter space</text>
    <rect x="256" y="252" width="78" height="24" rx="6" fill="#131C2A" stroke="#1E2A3A"/><text x="295" y="268" fill="#94A3B8">Quality gates</text>
