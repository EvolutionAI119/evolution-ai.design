  <text x="40" y="442" fill="#64748B" font-size="10.5">How to read: the dashed box is the open boundary; six external sources keep crossing it with constraints and feedback,</text>
  <text x="40" y="458" fill="#64748B" font-size="10.5">while four subsystem chips inside are the giant part. The central vehicle is the emergent result of their coupling.</text>
  <defs>
    <marker id="systi-ar-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
