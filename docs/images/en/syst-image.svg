    <text x="842" y="358" fill="#64748B" font-size="9" font-weight="400">craft / tolerance / cost</text>

    <circle cx="300" cy="414" r="24" fill="#131C2A" stroke="#F472B6" stroke-width="1.6"/>
    <path d="M289 421 Q300 405 311 421 M300 417 L300 426" fill="none" stroke="#F472B6" stroke-width="1.3"/>
