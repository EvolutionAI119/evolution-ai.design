<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Legend: visual encoding of this whitepaper</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Symbols · Lines · Colors</text>

  <!-- A Layer colors -->
  <rect x="40" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">A · Layer colors</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="58" y="99" width="26" height="13" rx="3" fill="#38BDF8"/><text x="96" y="110">Frontend / access (Vue, Vite, Nginx, cpolar)</text>
    <rect x="58" y="121" width="26" height="13" rx="3" fill="#34D399"/><text x="96" y="132">Backend / orchestration (FastAPI, routes, auth)</text>
    <rect x="58" y="143" width="26" height="13" rx="3" fill="#FBBF24"/><text x="96" y="154">Algorithm / compute (NURBS, quality, Bayes, training)</text>
    <rect x="58" y="165" width="26" height="13" rx="3" fill="#A78BFA"/><text x="96" y="176">Data / storage (SQLite, files, Redis)</text>
    <rect x="58" y="187" width="26" height="13" rx="3" fill="#F87171"/><text x="96" y="198">Error / rejection / degradation (401, 400, 503)</text>
  </g>

  <!-- B Lines and arrows -->
  <rect x="496" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">B · Lines and arrows</text>
  <g font-size="10.5" fill="#94A3B8">
    <line x1="514" y1="105" x2="574" y2="105" stroke="#34D399" stroke-width="2"/>
    <text x="590" y="109">Synchronous call (HTTP / function call)</text>
    <line x1="514" y1="127" x2="574" y2="127" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="590" y="131">Async trigger / polling (training, review)</text>
    <line x1="514" y1="149" x2="574" y2="149" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
    <text x="590" y="153">Optional or degraded path (explicit fallback)</text>
    <line x1="514" y1="171" x2="574" y2="171" stroke="#F87171" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="590" y="175">Error branch / rejection loop</text>
  </g>

  <!-- C Auth markers -->
  <rect x="40" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">C · Auth markers</text>
  <g font-size="10.5" fill="#94A3B8">
    <text x="58" y="292" font-size="12">🔐</text><text x="96" y="292">Auth required: Bearer JWT (get_current_user)</text>
    <text x="58" y="314" font-size="12">👑</text><text x="96" y="314">Admin: require_admin / require_superadmin</text>
    <text x="58" y="336" font-size="12">🔹</text><text x="96" y="336">Optional auth: links the user when a JWT exists</text>
    <circle cx="64" cy="354" r="5" fill="none" stroke="#64748B"/>
    <text x="96" y="358">Unmarked: public endpoint, guest access</text>
  </g>

  <!-- D Shape grammar -->
  <rect x="496" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">D · Shape grammar</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="514" y="279" width="26" height="13" rx="3" fill="#12293D" stroke="#38BDF8"/>
    <text x="556" y="290">Rounded rect = module / service / layer</text>
    <circle cx="527" cy="311" r="7" fill="#12293D" stroke="#A78BFA"/>
    <text x="556" y="315">Dot = endpoint / data node / control point</text>
    <polygon points="527,333 535,341 527,349 519,341" fill="#2A1A0E" stroke="#FBBF24"/>
    <text x="556" y="345">Diamond = decision gate / branch</text>
    <polygon points="514,360 530,360 526,372 510,372" fill="#2A1420" stroke="#F472B6"/>
    <text x="556" y="371">Parallelogram = external capability / optional dep</text>
    <text x="514" y="392" fill="#94A3B8">1—N = one-to-many (Project → ModelFile …)</text>
  </g>

  <text x="40" y="428" fill="#94A3B8" font-size="10">Prefix rule: the module filename is the path prefix; exceptions: import_export → /import-export, llm_proxy → /llm, auth → /auth + /api-keys (3 endpoints).</text>
  <text x="40" y="446" fill="#64748B" font-size="10">Figure numbering: Fig. X-Y = chapter X, figure Y; this legend decodes colors, line types and markers used above.</text>
</svg>
