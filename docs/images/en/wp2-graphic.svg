<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="wp2g-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="438" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#FBBF24"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Dual geometry pipeline: one parameter source, two delivery paths</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">mesh vs NURBS</text>

  <g font-size="11" fill="#94A3B8" text-anchor="middle">
    <text x="215" y="92">① Source</text><text x="337" y="92">② Construct</text><text x="459" y="92">③ Kernel</text>
    <text x="581" y="92">④ Validate</text><text x="703" y="92">⑤ Output</text><text x="825" y="92">⑥ Use</text>
  </g>

  <!-- Shared parameter source -->
  <rect x="160" y="106" width="110" height="214" rx="10" fill="#1A1230" stroke="#A78BFA"/>
  <text x="215" y="150" fill="#C4B5FD" font-size="10.5" font-weight="700" text-anchor="middle">22 parameters</text>
  <text x="215" y="172" fill="#E2E8F0" font-size="10" text-anchor="middle">CarParams</text>
  <text x="215" y="192" fill="#94A3B8" font-size="9.5" text-anchor="middle">Boundary checks</text>
  <text x="215" y="210" fill="#94A3B8" font-size="9.5" text-anchor="middle">L ∈ [3.5, 6.0] m</text>
  <text x="215" y="240" fill="#64748B" font-size="9.5" text-anchor="middle">One input,</text>
  <text x="215" y="258" fill="#64748B" font-size="9.5" text-anchor="middle">shared by both</text>

  <!-- mesh row -->
  <text x="44" y="150" fill="#7DD3FC" font-size="12" font-weight="700">mesh pipeline</text>
  <text x="44" y="166" fill="#64748B" font-size="9.5">Live preview</text>
  <g text-anchor="middle">
    <rect x="282" y="106" width="110" height="98" rx="9" fill="#0E1E2E" stroke="#38BDF8" stroke-opacity=".55"/>
    <text x="337" y="138" fill="#7DD3FC" font-size="10.5" font-weight="700">48 sections</text>
    <text x="337" y="158" fill="#94A3B8" font-size="9.5">Three zones + arches</text>
    <text x="337" y="176" fill="#94A3B8" font-size="9.5">tumblehome</text>
    <rect x="404" y="106" width="110" height="98" rx="9" fill="#0E1E2E" stroke="#38BDF8" stroke-opacity=".55"/>
    <text x="459" y="138" fill="#7DD3FC" font-size="10.5" font-weight="700">trimesh</text>
    <text x="459" y="158" fill="#94A3B8" font-size="9.5">10-part assembly</text>
    <text x="459" y="176" fill="#94A3B8" font-size="9.5">glass / wheels</text>
    <rect x="526" y="106" width="110" height="98" rx="9" fill="#0E1E2E" stroke="#38BDF8" stroke-opacity=".55"/>
    <text x="581" y="138" fill="#7DD3FC" font-size="10.5" font-weight="700">Proportions</text>
    <text x="581" y="158" fill="#94A3B8" font-size="9.5">Bounding box / gaps</text>
    <text x="581" y="176" fill="#94A3B8" font-size="9.5">Instant feedback</text>
    <rect x="648" y="106" width="110" height="98" rx="9" fill="#0E1E2E" stroke="#38BDF8" stroke-opacity=".55"/>
    <text x="703" y="138" fill="#7DD3FC" font-size="10.5" font-weight="700">GLB / STL</text>
    <text x="703" y="158" fill="#94A3B8" font-size="9.5">Single or merged</text>
    <text x="703" y="176" fill="#94A3B8" font-size="9.5">Direct frontend load</text>
    <rect x="770" y="106" width="110" height="98" rx="9" fill="#0E1E2E" stroke="#38BDF8" stroke-opacity=".55"/>
    <text x="825" y="138" fill="#7DD3FC" font-size="10.5" font-weight="700">Live preview</text>
    <text x="825" y="158" fill="#94A3B8" font-size="9.5">Option comparison</text>
    <text x="825" y="176" fill="#94A3B8" font-size="9.5">Interactive iteration</text>
  </g>

  <!-- NURBS row -->
  <text x="44" y="266" fill="#FCD34D" font-size="12" font-weight="700">NURBS pipeline</text>
  <text x="44" y="282" fill="#64748B" font-size="9.5">Engineering delivery</text>
  <g text-anchor="middle">
    <rect x="282" y="222" width="110" height="98" rx="9" fill="#2A1A0E" stroke="#FBBF24" stroke-opacity=".55"/>
    <text x="337" y="254" fill="#FCD34D" font-size="10.5" font-weight="700">Sweep / fillet</text>
    <text x="337" y="274" fill="#94A3B8" font-size="9.5">Blend surfaces</text>
    <text x="337" y="292" fill="#94A3B8" font-size="9.5">4 end schemes</text>
    <rect x="404" y="222" width="110" height="98" rx="9" fill="#2A1A0E" stroke="#FBBF24" stroke-opacity=".55"/>
    <text x="459" y="254" fill="#FCD34D" font-size="10.5" font-weight="700">Own NURBS</text>
    <text x="459" y="274" fill="#94A3B8" font-size="9.5">Basis / knot vectors</text>
    <text x="459" y="292" fill="#94A3B8" font-size="9.5">Cython accelerated</text>
    <rect x="526" y="222" width="110" height="98" rx="9" fill="#2A1A0E" stroke="#FBBF24" stroke-opacity=".55"/>
    <text x="581" y="254" fill="#FCD34D" font-size="10.5" font-weight="700">G0 / G1 / G2</text>
    <text x="581" y="274" fill="#94A3B8" font-size="9.5">0.1 mm / 1.0°</text>
    <text x="581" y="292" fill="#94A3B8" font-size="9.5">Reflection score</text>
    <rect x="648" y="222" width="110" height="98" rx="9" fill="#2A1A0E" stroke="#FBBF24" stroke-opacity=".55"/>
    <text x="703" y="254" fill="#FCD34D" font-size="10.5" font-weight="700">STEP</text>
    <text x="703" y="274" fill="#94A3B8" font-size="9.5">Engineering writer</text>
    <text x="703" y="292" fill="#94A3B8" font-size="9.5">TXT / CSV reports</text>
    <rect x="770" y="222" width="110" height="98" rx="9" fill="#2A1A0E" stroke="#FBBF24" stroke-opacity=".55"/>
    <text x="825" y="254" fill="#FCD34D" font-size="10.5" font-weight="700">Class-A surface</text>
    <text x="825" y="274" fill="#94A3B8" font-size="9.5">Engineering delivery</text>
    <text x="825" y="292" fill="#94A3B8" font-size="9.5">Editable geometry</text>
  </g>

  <g stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#wp2g-ar)">
    <path d="M270 213 L276 213 L276 155 L282 155"/>
    <path d="M276 213 L276 271 L282 271"/>
    <line x1="392" y1="155" x2="402" y2="155"/><line x1="514" y1="155" x2="524" y2="155"/>
    <line x1="636" y1="155" x2="646" y2="155"/><line x1="758" y1="155" x2="768" y2="155"/>
    <line x1="392" y1="271" x2="402" y2="271"/><line x1="514" y1="271" x2="524" y2="271"/>
    <line x1="636" y1="271" x2="646" y2="271"/><line x1="758" y1="271" x2="768" y2="271"/>
  </g>

  <text x="40" y="352" fill="#94A3B8" font-size="10.5">Shared: the same 22 parameters and boundary checks. Difference: mesh optimizes interaction speed, NURBS guarantees G0/G1/G2 and STEP precision.</text>
  <text x="40" y="374" fill="#64748B" font-size="10">Both pipelines run in parallel and can cross-check each other; GLB/STL and STEP serve different downstream stages (live preview vs engineering delivery).</text>
  <text x="40" y="396" fill="#64748B" font-size="10">Zero framework dependencies: both pipelines run and test standalone outside the web platform.</text>
</svg>
