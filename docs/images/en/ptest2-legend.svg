<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Legend: test status, severity and blocking</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Legend · Status, Severity, Blocking</text>

  <!-- A Status -->
  <rect x="40" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">A · Status symbols</text>
  <g font-size="10.5">
    <circle cx="66" cy="105" r="5" fill="#34D399"/><text x="82" y="109" fill="#94A3B8">Running / ready (3/3 ports)</text>
    <text x="58" y="131" fill="#34D399" font-size="12" font-weight="700">✓</text><text x="82" y="131" fill="#94A3B8">Pass (modules 7/7, LLM 3/3)</text>
    <text x="58" y="153" fill="#FBBF24" font-size="12" font-weight="700">⚠</text><text x="82" y="153" fill="#94A3B8">Warning with fallback (Projects Mock)</text>
    <text x="58" y="175" fill="#F87171" font-size="12" font-weight="700">✕</text><text x="82" y="175" fill="#94A3B8">Fail / unexpected error (zero this round)</text>
    <text x="58" y="197" fill="#64748B" font-size="12" font-weight="700">⏭</text><text x="82" y="197" fill="#94A3B8">Skip (needs real LLM, not a failure)</text>
  </g>

  <!-- B Severity -->
  <rect x="496" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">B · Severity and blocking</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="514" y="98" width="26" height="13" rx="3" fill="#FBBF24"/><text x="552" y="109">Low: P1 / P2 / P3 (usable, degraded UX)</text>
    <rect x="514" y="120" width="26" height="13" rx="3" fill="#34D399"/><text x="552" y="131">Very low: P4 / P5 / P6 (cosmetic only)</text>
    <rect x="514" y="142" width="26" height="13" rx="3" fill="#F87171"/><text x="552" y="153">Blocking: stops a core flow (none)</text>
    <text x="514" y="176" fill="#E2E8F0" font-size="10.5" font-weight="700">Core flow defined</text>
    <text x="514" y="194" fill="#94A3B8">Designer generate → 3D/2D → Quality → Deliver</text>
  </g>

  <!-- C Chart syntax -->
  <rect x="40" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">C · Chart syntax</text>
  <g font-size="10.5" fill="#94A3B8">
    <polygon points="64,282 74,300 54,300" fill="#38BDF8" opacity="0.7"/>
    <text x="92" y="296">Triangle layer = test-pyramid level</text>
    <circle cx="66" cy="322" r="10" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="18 8"/>
    <text x="92" y="326">Ring = case composition (341 / 1 / 2)</text>
    <rect x="58" y="340" width="14" height="18" rx="2" fill="#34D399" opacity="0.8"/>
    <text x="92" y="354">Bar = case scale (26 / 10 files)</text>
    <line x1="58" y1="374" x2="82" y2="374" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="5 3"/>
    <polygon points="90,374 82,370 82,378" fill="#A78BFA"/>
    <text x="92" y="378">Dashed arrow = tunnel / async link</text>
    <text x="58" y="396" fill="#64748B" font-size="10">All figures are the 2026-08-11 same-day run</text>
  </g>

  <!-- D Figures -->
  <rect x="496" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">D · Key figure conventions</text>
  <g font-size="10.5" fill="#94A3B8">
    <text x="514" y="288">Backend 344 = 341 pass + 1 skip + 2 xfail</text>
    <text x="514" y="310">Frontend 142 / 142 pass · 10 test files</text>
    <text x="514" y="332">Total 483 = 341 + 142, zero unexpected fails</text>
    <text x="514" y="354">Modules 7/7 (6 core + Deep Learning)</text>
    <text x="514" y="376">LLM 3/3 PASS · generate endpoint 200 OK</text>
    <text x="514" y="396" fill="#6EE7B7">6 known issues (P1–P6) · 0 blockers</text>
  </g>

  <text x="40" y="428" fill="#94A3B8" font-size="10">Applies to Fig. 1-1, 4-1, 4-2 and Chapters 7–10. Table values in the body text are authoritative; no later baseline is mixed in.</text>
  <text x="40" y="446" fill="#64748B" font-size="10">Note: amber = low severity only, never failure; green means very low severity in the defect table but "healthy" in the status bar.</text>
</svg>
