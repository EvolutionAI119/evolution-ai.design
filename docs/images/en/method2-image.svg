<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#38BDF8"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Human–Machine Workbench: Parameters, Generation, Evaluation in One View</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Human–Machine Workbench</text>

  <!-- Monitor -->
  <rect x="226" y="90" width="540" height="266" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <rect x="238" y="102" width="516" height="230" rx="7" fill="#0B101A" stroke="#1E2A3A"/>
  <!-- Screen flow caption -->
  <text x="258" y="126" fill="#64748B" font-size="10">Parameters → Generate → Evaluate → Suggest</text>
  <text x="742" y="126" fill="#475569" font-size="9" text-anchor="end">live</text>
  <!-- Perspective grid -->
  <g stroke="#1E2A3A" stroke-width="1">
    <line x1="256" y1="160" x2="612" y2="160"/><line x1="256" y1="196" x2="612" y2="196"/>
    <line x1="256" y1="232" x2="612" y2="232"/><line x1="256" y1="268" x2="612" y2="268"/>
  </g>
  <!-- Vehicle -->
  <g>
    <path d="M262 318 L262 286 Q264 266 290 258 L318 250 Q348 218 392 214 L452 214 Q490 216 512 242 L532 256 Q544 264 544 280 L544 318 Z" fill="#0E1E2E" stroke="#38BDF8" stroke-width="1.8"/>
    <path d="M322 252 Q400 228 494 246" fill="none" stroke="#A78BFA" stroke-width="1.4"/>
    <path d="M354 222 Q420 210 470 220" fill="none" stroke="#F472B6" stroke-width="1.2"/>
    <circle cx="318" cy="318" r="20" fill="#0F1622" stroke="#475569"/>
    <circle cx="318" cy="318" r="8" fill="#131C2A" stroke="#475569"/>
    <circle cx="492" cy="318" r="20" fill="#0F1622" stroke="#475569"/>
    <circle cx="492" cy="318" r="8" fill="#131C2A" stroke="#475569"/>
  </g>
  <!-- Sliders -->
  <g>
    <text x="640" y="152" fill="#94A3B8" font-size="9.5">Size</text>
    <line x1="640" y1="164" x2="736" y2="164" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="640" y1="164" x2="690" y2="164" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="690" cy="164" r="5" fill="#0F1622" stroke="#38BDF8" stroke-width="2"/>
    <text x="640" y="190" fill="#94A3B8" font-size="9.5">Posture</text>
    <line x1="640" y1="202" x2="736" y2="202" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="640" y1="202" x2="714" y2="202" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/>
    <circle cx="714" cy="202" r="5" fill="#0F1622" stroke="#A78BFA" stroke-width="2"/>
    <text x="640" y="228" fill="#94A3B8" font-size="9.5">Surface</text>
    <line x1="640" y1="240" x2="736" y2="240" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="640" y1="240" x2="702" y2="240" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
    <circle cx="702" cy="240" r="5" fill="#0F1622" stroke="#34D399" stroke-width="2"/>
    <rect x="640" y="258" width="96" height="24" rx="6" fill="#0F241C" stroke="#34D399"/>
    <text x="688" y="274" fill="#6EE7B7" font-size="10" font-weight="600" text-anchor="middle">G2 0.87 · A</text>
    <rect x="640" y="290" width="96" height="24" rx="6" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="688" y="306" fill="#94A3B8" font-size="9.5" text-anchor="middle">Variant 07 / 12</text>
  </g>
  <!-- Stand and desk -->
  <path d="M470 356 L490 356 L498 374 L462 374 Z" fill="#1E2A3A"/>
  <rect x="40" y="374" width="880" height="8" rx="4" fill="#1E2A3A"/>
  <rect x="248" y="356" width="96" height="10" rx="3" fill="#0B101A" stroke="#334155"/>
  <rect x="360" y="360" width="26" height="8" rx="3" fill="#0B101A" stroke="#334155"/>

  <!-- Designer silhouette -->
  <g fill="none" stroke="#94A3B8" stroke-width="1.6">
    <circle cx="150" cy="236" r="22" fill="#0F1622"/>
    <path d="M108 374 C110 320 124 296 150 288 C176 296 190 320 192 374" fill="#131C2A"/>
    <path d="M186 320 C210 328 232 340 252 352" />
    <path d="M150 288 C146 268 146 250 150 236"/>
  </g>
  <!-- Right cards -->
  <g>
    <rect x="782" y="104" width="148" height="60" rx="9" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="798" y="124" fill="#7DD3FC" font-size="10.5" font-weight="600">Quality Center</text>
    <text x="798" y="140" fill="#64748B" font-size="9">G0/G1/G2 · A–D grade</text>
    <text x="798" y="154" fill="#64748B" font-size="9">Readable after each run</text>

    <rect x="782" y="180" width="148" height="60" rx="9" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="798" y="200" fill="#C4B5FD" font-size="10.5" font-weight="600">Variant Compare</text>
    <text x="798" y="216" fill="#64748B" font-size="9">Same space · rollback</text>
    <text x="798" y="230" fill="#64748B" font-size="9">Differences = parameters</text>

    <rect x="782" y="256" width="148" height="60" rx="9" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="798" y="276" fill="#6EE7B7" font-size="10.5" font-weight="600">Bayesian Session</text>
    <text x="798" y="292" fill="#64748B" font-size="9">Suggest → backfill → converge</text>
    <text x="798" y="306" fill="#64748B" font-size="9">Async status polling</text>
  </g>

  <!-- Numbered markers -->
  <g font-size="9.5" font-weight="700" text-anchor="middle">
    <circle cx="628" cy="152" r="8" fill="#0F1622" stroke="#38BDF8" stroke-width="1.3"/><text x="628" y="155" fill="#7DD3FC">1</text>
    <circle cx="272" cy="146" r="8" fill="#0F1622" stroke="#A78BFA" stroke-width="1.3"/><text x="272" y="149" fill="#C4B5FD">2</text>
    <circle cx="628" cy="270" r="8" fill="#0F1622" stroke="#34D399" stroke-width="1.3"/><text x="628" y="273" fill="#6EE7B7">3</text>
    <circle cx="770" cy="200" r="8" fill="#0F1622" stroke="#F472B6" stroke-width="1.3"/><text x="770" y="203" fill="#F9A8D4">4</text>
  </g>

  <g font-size="9.5" fill="#94A3B8">
    <text x="40" y="410">1 Sliders: size / posture / surface</text>
    <text x="300" y="410">2 Live 3D preview + feature lines</text>
    <text x="560" y="410">3 Quality grade returns instantly</text>
    <text x="790" y="410">4 Variants + Bayesian advice</text>
  </g>
  <text x="40" y="436" fill="#64748B" font-size="10.5">How to read: the screen is the working surface of "one parameter space, two geometry paths" — a person moves sliders to state intent,</text>
  <text x="40" y="452" fill="#64748B" font-size="10.5">the machine generates and scores inside the same space; the three cards on the right put the methodology's pillars on one desk.</text>
</svg>
