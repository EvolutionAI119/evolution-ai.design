<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Legend: pass, warn and degrade semantics</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Legend · Pass, Warn, Degrade</text>

  <!-- A States -->
  <rect x="40" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">A · State symbols</text>
  <g font-size="10.5">
    <text x="58" y="108" fill="#34D399" font-size="12" font-weight="700">✓</text><text x="82" y="108" fill="#94A3B8">Pass: case / self-check module / re-test</text>
    <text x="58" y="130" fill="#FBBF24" font-size="12" font-weight="700">⚠</text><text x="82" y="130" fill="#94A3B8">Known non-blocking warning (Pydantic, on_event)</text>
    <text x="58" y="152" fill="#F87171" font-size="12" font-weight="700">✕</text><text x="82" y="152" fill="#94A3B8">Failure (zero this round)</text>
    <text x="58" y="174" fill="#64748B" font-size="12" font-weight="700">○</text><text x="82" y="174" fill="#94A3B8">Out of scope / not covered (Chapter 8)</text>
    <text x="58" y="196" fill="#A78BFA" font-size="12" font-weight="700">◆</text><text x="82" y="196" fill="#94A3B8">Honest degradation: signal, never simulate</text>
  </g>

  <!-- B Lines -->
  <rect x="496" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">B · Lines and flows</text>
  <g font-size="10.5" fill="#94A3B8">
    <line x1="514" y1="105" x2="576" y2="105" stroke="#34D399" stroke-width="2"/>
    <text x="590" y="109">Solid: same-day run path (case to result)</text>
    <line x1="514" y1="127" x2="576" y2="127" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="590" y="131">Dashed: target threshold (±2° / ≥3× / ≤100 ms)</text>
    <line x1="514" y1="149" x2="576" y2="149" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
    <text x="590" y="153">Dotted: intentionally covered warning path</text>
    <line x1="514" y1="171" x2="576" y2="171" stroke="#A78BFA" stroke-width="2" stroke-dasharray="8 3 2 3"/>
    <text x="590" y="175">Dash-dot: historical baseline, never rewritten</text>
    <line x1="514" y1="193" x2="576" y2="193" stroke="#F87171" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="590" y="197">Red dashed: loop-back when regression fails</text>
  </g>

  <!-- C Colors -->
  <rect x="40" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">C · Color semantics</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="58" y="278" width="26" height="13" rx="3" fill="#34D399"/><text x="96" y="289">Pass / meets target (489 green)</text>
    <rect x="58" y="300" width="26" height="13" rx="3" fill="#FBBF24"/><text x="96" y="311">Warning / threshold line (non-blocking)</text>
    <rect x="58" y="322" width="26" height="13" rx="3" fill="#F87171"/><text x="96" y="333">Failure / defect (zero this round)</text>
    <rect x="58" y="344" width="26" height="13" rx="3" fill="#38BDF8"/><text x="96" y="355">Quantitative metric (cases, time, ratio)</text>
    <rect x="58" y="366" width="26" height="13" rx="3" fill="#A78BFA"/><text x="96" y="377">Document-code check / degradation contract</text>
  </g>

  <!-- D Figures -->
  <rect x="496" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">D · Key figure conventions</text>
  <g font-size="10.5" fill="#94A3B8">
    <text x="514" y="288">489 = 200 algorithm + 178 backend + 111 frontend</text>
    <text x="514" y="310">118 = 113 @router + 3 @keys_router + 2 @app</text>
    <text x="514" y="332">G1 5° / G2 2° (continuity.py defaults)</text>
    <text x="514" y="354">Grades A/B/C: 0.85 / 0.7 · 0.70 / 0.5 · 0.50</text>
    <text x="514" y="376" fill="#6EE7B7">Bayes −0.01 band: EI x=0.5000 · UCB x=0.4999</text>
    <text x="514" y="396">22 CarParams dimensions · 14 DEFAULT_SPEC entries</text>
  </g>

  <text x="40" y="428" fill="#94A3B8" font-size="10">Applies to Fig. 2-1 through Fig. 5-1. Every value comes from the 2026-09-27 same-day output and is reproducible with the appendix commands.</text>
  <text x="40" y="446" fill="#64748B" font-size="10">Note: a green line is a path while a green block is a verdict; amber never means failure, only "needs attention".</text>
</svg>
