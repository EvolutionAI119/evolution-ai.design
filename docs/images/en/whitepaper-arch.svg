<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34D399"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="538" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Platform Architecture (4 layers + 1 channel)</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">EVOLUTION AI · System Architecture</text>

  <!-- Frontend layer -->
  <g>
    <rect x="40" y="62" width="700" height="88" rx="12" fill="#0E1E2E" stroke="#38BDF8" stroke-width="1.3"/>
    <text x="64" y="90" fill="#7DD3FC" font-size="14" font-weight="700">Frontend · Vue 3 SPA</text>
    <text x="716" y="90" fill="#64748B" font-size="10.5" text-anchor="end">Vite / hash routing</text>
    <g font-size="11.5" fill="#94A3B8">
      <rect x="64" y="104" width="120" height="32" rx="8" fill="#12293D"/><text x="124" y="124" text-anchor="middle">10 view pages</text>
      <rect x="194" y="104" width="120" height="32" rx="8" fill="#12293D"/><text x="254" y="124" text-anchor="middle">Three.js 3D</text>
      <rect x="324" y="104" width="120" height="32" rx="8" fill="#12293D"/><text x="384" y="124" text-anchor="middle">Pinia state</text>
      <rect x="454" y="104" width="120" height="32" rx="8" fill="#12293D"/><text x="514" y="124" text-anchor="middle">Element Plus</text>
      <rect x="584" y="104" width="132" height="32" rx="8" fill="#12293D"/><text x="650" y="124" text-anchor="middle">i18n bilingual</text>
    </g>
  </g>

  <!-- Backend layer -->
  <g>
    <rect x="40" y="168" width="700" height="88" rx="12" fill="#0F241C" stroke="#34D399" stroke-width="1.3"/>
    <text x="64" y="196" fill="#6EE7B7" font-size="14" font-weight="700">Backend · FastAPI</text>
    <text x="716" y="196" fill="#64748B" font-size="10.5" text-anchor="end">REST /api/v1 · JWT auth</text>
    <g font-size="11.5" fill="#94A3B8">
      <rect x="64" y="210" width="150" height="32" rx="8" fill="#123528"/><text x="139" y="230" text-anchor="middle">15 route modules</text>
      <rect x="224" y="210" width="150" height="32" rx="8" fill="#123528"/><text x="299" y="230" text-anchor="middle">4-level RBAC</text>
      <rect x="384" y="210" width="150" height="32" rx="8" fill="#123528"/><text x="459" y="230" text-anchor="middle">CORS/security headers</text>
      <rect x="544" y="210" width="172" height="32" rx="8" fill="#123528"/><text x="630" y="230" text-anchor="middle">error log · audit trail</text>
    </g>
  </g>

  <!-- Algorithm layer -->
  <g>
    <rect x="40" y="274" width="700" height="88" rx="12" fill="#2A1A0E" stroke="#FBBF24" stroke-width="1.3"/>
    <text x="64" y="302" fill="#FCD34D" font-size="14" font-weight="700">Algorithm · algorithm_model (standalone)</text>
    <text x="716" y="302" fill="#64748B" font-size="10.5" text-anchor="end">200 unit tests</text>
    <g font-size="11.5" fill="#94A3B8">
      <rect x="64" y="316" width="120" height="32" rx="8" fill="#3A2A12"/><text x="124" y="336" text-anchor="middle">NURBS kernel</text>
      <rect x="194" y="316" width="120" height="32" rx="8" fill="#3A2A12"/><text x="254" y="336" text-anchor="middle">Bayesian opt.</text>
      <rect x="324" y="316" width="120" height="32" rx="8" fill="#3A2A12"/><text x="384" y="336" text-anchor="middle">Quality eval</text>
      <rect x="454" y="316" width="120" height="32" rx="8" fill="#3A2A12"/><text x="514" y="336" text-anchor="middle">Parametric texture</text>
      <rect x="584" y="316" width="132" height="32" rx="8" fill="#3A2A12"/><text x="650" y="336" text-anchor="middle">Deep learning/LLM</text>
    </g>
  </g>

  <!-- Data layer -->
  <g>
    <rect x="40" y="380" width="700" height="88" rx="12" fill="#1A1230" stroke="#A78BFA" stroke-width="1.3"/>
    <text x="64" y="408" fill="#C4B5FD" font-size="14" font-weight="700">Data</text>
    <text x="716" y="408" fill="#64748B" font-size="10.5" text-anchor="end">SQLAlchemy ORM · 11 tables</text>
    <g font-size="11.5" fill="#94A3B8">
      <rect x="64" y="422" width="150" height="32" rx="8" fill="#241A40"/><text x="139" y="442" text-anchor="middle">SQLite database</text>
      <rect x="224" y="422" width="150" height="32" rx="8" fill="#241A40"/><text x="299" y="442" text-anchor="middle">Model file storage</text>
      <rect x="384" y="422" width="150" height="32" rx="8" fill="#241A40"/><text x="459" y="442" text-anchor="middle">Redis (sessions)</text>
      <rect x="544" y="422" width="172" height="32" rx="8" fill="#241A40"/><text x="630" y="442" text-anchor="middle">Brand KB JSON</text>
    </g>
  </g>

  <!-- Right deployment channel -->
  <g>
    <rect x="764" y="62" width="172" height="406" rx="12" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="850" y="88" fill="#E2E8F0" font-size="13" font-weight="700" text-anchor="middle">Deployment</text>
    <g text-anchor="middle" font-size="11.5">
      <rect x="780" y="104" width="140" height="56" rx="9" fill="#12293D"/><text x="850" y="126" fill="#7DD3FC">Dev</text><text x="850" y="144" fill="#64748B" font-size="10.5">Vite 5173 + Uvicorn 8000</text>
      <rect x="780" y="176" width="140" height="56" rx="9" fill="#0F241C"/><text x="850" y="198" fill="#6EE7B7">Production</text><text x="850" y="216" fill="#64748B" font-size="10.5">docker-compose orchestration</text>
      <rect x="780" y="248" width="140" height="56" rx="9" fill="#2A1A0E"/><text x="850" y="270" fill="#FCD34D">Public tunnel</text><text x="850" y="288" fill="#64748B" font-size="10.5">cpolar HTTPS</text>
      <rect x="780" y="320" width="140" height="56" rx="9" fill="#1A1230"/><text x="850" y="342" fill="#C4B5FD">Static hosting</text><text x="850" y="360" fill="#64748B" font-size="10.5">GitHub Pages</text>
      <rect x="780" y="392" width="140" height="56" rx="9" fill="#0B101A" stroke="#1E2A3A"/><text x="850" y="414" fill="#94A3B8">Domain</text><text x="850" y="432" fill="#64748B" font-size="10.5">evolution-ai.design</text>
    </g>
  </g>

  <!-- Inter-layer call arrows -->
  <line x1="390" y1="152" x2="390" y2="164" stroke="#34D399" stroke-width="2" marker-end="url(#ar8)"/>
  <line x1="390" y1="258" x2="390" y2="270" stroke="#34D399" stroke-width="2" marker-end="url(#ar8)"/>
  <line x1="390" y1="364" x2="390" y2="376" stroke="#34D399" stroke-width="2" marker-end="url(#ar8)"/>
  <text x="404" y="160" fill="#64748B" font-size="10.5">HTTP/JSON</text>
  <text x="404" y="266" fill="#64748B" font-size="10.5">function call</text>
  <text x="404" y="372" fill="#64748B" font-size="10.5">ORM read/write</text>

  <text x="40" y="500" fill="#64748B" font-size="11.5">How to read: requests flow top-down — HTTP → backend → algo (framework-free) → ORM; right channel covers dev, prod &amp; public.</text>
  <text x="40" y="520" fill="#475569" font-size="10.5">Layering: upper layers may depend on lower; lower never knows upper (algo imports no FastAPI; DB has no business semantics).</text>
</svg>
