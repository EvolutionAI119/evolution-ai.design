<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34D399"/>
    </marker>
    <marker id="ar13r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#F87171"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="468" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Module Integration: Authentication → Token Training → Workflow Review</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Module Integration Flow</text>

  <!-- Stage band -->
  <g text-anchor="middle" font-size="11.5">
    <!-- A Authentication -->
    <rect x="36" y="70" width="200" height="128" rx="12" fill="#12293D" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="136" y="96" fill="#7DD3FC" font-weight="700">A · Authentication</text>
    <g fill="#94A3B8" font-size="10.5" text-anchor="start">
      <text x="56" y="120">· password / WeChat QR login</text>
      <text x="56" y="140">· backend issues JWT (role)</text>
      <text x="56" y="160">· token kept in memory</text>
      <text x="56" y="180">· RBAC: guest/user/admin</text>
    </g>

    <!-- B Token training -->
    <rect x="380" y="70" width="200" height="128" rx="12" fill="#0F241C" stroke="#34D399" stroke-width="1.2"/>
    <text x="480" y="96" fill="#6EE7B7" font-weight="700">B · Token Training</text>
    <g fill="#94A3B8" font-size="10.5" text-anchor="start">
      <text x="400" y="120">· start from DeepLearning page</text>
      <text x="400" y="140">· training.py checks login</text>
      <text x="400" y="160">· live progress feedback</text>
      <text x="400" y="180">· samples exportable</text>
    </g>

    <!-- C Workflow review -->
    <rect x="724" y="70" width="200" height="128" rx="12" fill="#2A1A0E" stroke="#FBBF24" stroke-width="1.2"/>
    <text x="824" y="96" fill="#FCD34D" font-weight="700">C · Workflow Review</text>
    <g fill="#94A3B8" font-size="10.5" text-anchor="start">
      <text x="744" y="120">· results enter review queue</text>
      <text x="744" y="140">· compliance + quality review</text>
      <text x="744" y="160">· state machine (below)</text>
      <text x="744" y="180">· sign-off/reject logged</text>
    </g>
  </g>

  <line x1="240" y1="134" x2="376" y2="134" stroke="#34D399" stroke-width="2" marker-end="url(#ar13)"/>
  <text x="308" y="124" fill="#64748B" font-size="10" text-anchor="middle">JWT carries identity</text>
  <line x1="584" y1="134" x2="720" y2="134" stroke="#34D399" stroke-width="2" marker-end="url(#ar13)"/>
  <text x="652" y="124" fill="#64748B" font-size="10" text-anchor="middle">submit package</text>

  <!-- State machine -->
  <g>
    <text x="480" y="248" fill="#E2E8F0" font-size="14" font-weight="700" text-anchor="middle">Review state machine (inside C)</text>
    <g text-anchor="middle" font-size="12">
      <rect x="80" y="286" width="128" height="52" rx="26" fill="#131B29" stroke="#64748B"/>
      <text x="144" y="316" fill="#CBD5E1">Draft</text>
      <rect x="288" y="286" width="128" height="52" rx="26" fill="#12293D" stroke="#38BDF8"/>
      <text x="352" y="316" fill="#7DD3FC">InReview</text>
      <rect x="496" y="286" width="128" height="52" rx="26" fill="#0F241C" stroke="#34D399"/>
      <text x="560" y="316" fill="#6EE7B7">Approved</text>
      <rect x="704" y="286" width="128" height="52" rx="26" fill="#2A1215" stroke="#F87171"/>
      <text x="768" y="316" fill="#FCA5A5">Rejected</text>
    </g>
    <line x1="210" y1="312" x2="284" y2="312" stroke="#34D399" stroke-width="2" marker-end="url(#ar13)"/>
    <text x="247" y="302" fill="#64748B" font-size="10" text-anchor="middle">Submit</text>
    <line x1="418" y1="312" x2="492" y2="312" stroke="#34D399" stroke-width="2" marker-end="url(#ar13)"/>
    <text x="455" y="302" fill="#64748B" font-size="10" text-anchor="middle">Both reviews pass</text>
    <line x1="494" y1="356" x2="420" y2="356" stroke="#F87171" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar13r)"/>
    <line x1="702" y1="330" x2="420" y2="352" stroke="#F87171" stroke-width="0" />
    <path d="M704 330 C 620 366, 500 370, 422 356" fill="none" stroke="#F87171" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar13r)"/>
    <text x="565" y="376" fill="#F87171" font-size="10" text-anchor="middle">Any rejection (with notes) → back to InReview</text>
    <text x="144" y="366" fill="#475569" font-size="10" text-anchor="middle">Owner-only edit</text>
    <text x="352" y="366" fill="#475569" font-size="10" text-anchor="middle">Admin co-sign</text>
    <text x="560" y="366" fill="#475569" font-size="10" text-anchor="middle">Triggers deliverables</text>
  </g>

  <!-- Bottom permission note -->
  <rect x="36" y="404" width="888" height="42" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
  <text x="56" y="430" fill="#94A3B8" font-size="11.5">Permission wiring: A gates entry (401/403), B checks who trains, C gates who reviews — all in backend DI; frontend only guides.</text>
</svg>
