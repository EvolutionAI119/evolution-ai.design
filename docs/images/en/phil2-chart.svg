<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="phil2c-bar-en" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="418" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#38BDF8"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">One Styling Loop by Era (log scale)</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Iteration Cycle · Log Scale</text>

  <g stroke="#1E2A3A" stroke-width="1">
    <line x1="110" y1="296" x2="600" y2="296"/>
    <line x1="110" y1="241" x2="600" y2="241"/>
    <line x1="110" y1="213" x2="600" y2="213"/>
    <line x1="110" y1="176" x2="600" y2="176"/>
    <line x1="110" y1="148" x2="600" y2="148"/>
    <line x1="110" y1="108" x2="600" y2="108"/>
  </g>
  <line x1="110" y1="330" x2="600" y2="330" stroke="#334155" stroke-width="1.2"/>
  <line x1="110" y1="330" x2="110" y2="92" stroke="#334155" stroke-width="1.2"/>
  <g fill="#475569" font-size="10" text-anchor="end">
    <text x="102" y="300">1 min</text>
    <text x="102" y="245">15 min</text>
    <text x="102" y="217">1 hour</text>
    <text x="102" y="180">6 hours</text>
    <text x="102" y="152">1 day</text>
    <text x="102" y="112">1 week</text>
  </g>
  <text x="70" y="210" fill="#64748B" font-size="10.5" transform="rotate(-90 70 210)" text-anchor="middle">Cycle time (log)</text>

  <g>
    <line x1="210" y1="330" x2="210" y2="115" stroke="url(#phil2c-bar-en)" stroke-width="72"/>
    <line x1="210" y1="330" x2="210" y2="115" stroke="#38BDF8" stroke-width="2" opacity=".5"/>
    <circle cx="210" cy="115" r="7" fill="#0F1622" stroke="#38BDF8" stroke-width="2.4"/>
    <text x="210" y="98" fill="#7DD3FC" font-size="14" font-weight="700" text-anchor="middle">~5 days</text>
    <text x="210" y="82" fill="#64748B" font-size="10" text-anchor="middle">120 hours</text>
    <text x="210" y="352" fill="#CBD5E1" font-size="12" font-weight="600" text-anchor="middle">Hand-drawn era</text>
    <text x="210" y="368" fill="#64748B" font-size="9.5" text-anchor="middle">experience-driven, hard to repeat</text>
  </g>
  <g>
    <line x1="350" y1="330" x2="350" y2="170" stroke="url(#phil2c-bar-en)" stroke-width="72"/>
    <line x1="350" y1="330" x2="350" y2="170" stroke="#FBBF24" stroke-width="2" opacity=".5"/>
    <circle cx="350" cy="170" r="7" fill="#0F1622" stroke="#FBBF24" stroke-width="2.4"/>
    <text x="350" y="153" fill="#FCD34D" font-size="14" font-weight="700" text-anchor="middle">~8 hours</text>
    <text x="350" y="137" fill="#64748B" font-size="10" text-anchor="middle">explicit, traceable dimensions</text>
    <text x="350" y="352" fill="#CBD5E1" font-size="12" font-weight="600" text-anchor="middle">Parametric era</text>
    <text x="350" y="368" fill="#64748B" font-size="9.5" text-anchor="middle">feature lines + parameters</text>
  </g>
  <g>
    <line x1="490" y1="330" x2="490" y2="304" stroke="#34D399" stroke-width="72" opacity=".18"/>
    <line x1="490" y1="330" x2="490" y2="304" stroke="#34D399" stroke-width="2"/>
    <circle cx="490" cy="304" r="7" fill="#0F1622" stroke="#34D399" stroke-width="2.4"/>
    <text x="490" y="288" fill="#6EE7B7" font-size="14" font-weight="700" text-anchor="middle">~40 s</text>
    <text x="490" y="272" fill="#64748B" font-size="10" text-anchor="middle">generate + evaluate + suggest</text>
    <text x="490" y="352" fill="#CBD5E1" font-size="12" font-weight="600" text-anchor="middle">AI generation era</text>
    <text x="490" y="368" fill="#64748B" font-size="9.5" text-anchor="middle">automated closed loop</text>
  </g>
  <path d="M225 122 L475 296" stroke="#34D399" stroke-width="1" stroke-dasharray="3 4" opacity=".45"/>
  <text x="352" y="196" fill="#6EE7B7" font-size="10" text-anchor="middle" opacity=".85">~10⁴× order-of-magnitude gain</text>

  <g>
    <rect x="632" y="76" width="304" height="254" rx="12" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="652" y="100" fill="#E2E8F0" font-size="12.5" font-weight="700">Order-of-magnitude compression</text>
    <g>
      <rect x="648" y="114" width="272" height="46" rx="8" fill="#0E1E2E"/>
      <text x="668" y="134" fill="#7DD3FC" font-size="12" font-weight="600">Hand-drawn → parametric</text>
      <text x="668" y="150" fill="#64748B" font-size="9.5">5 days → 8 hours</text>
      <text x="904" y="143" fill="#7DD3FC" font-size="14" font-weight="700" text-anchor="end">×15</text>
    </g>
    <g>
      <rect x="648" y="170" width="272" height="46" rx="8" fill="#2A1A0E"/>
      <text x="668" y="190" fill="#FCD34D" font-size="12" font-weight="600">Parametric → AI loop</text>
      <text x="668" y="206" fill="#64748B" font-size="9.5">8 hours → 40 seconds</text>
      <text x="904" y="199" fill="#FCD34D" font-size="14" font-weight="700" text-anchor="end">×720</text>
    </g>
    <g>
      <rect x="648" y="226" width="272" height="46" rx="8" fill="#0F241C"/>
      <text x="668" y="246" fill="#6EE7B7" font-size="12" font-weight="600">Hand-drawn → AI loop</text>
      <text x="668" y="262" fill="#64748B" font-size="9.5">5 days → 40 seconds</text>
      <text x="904" y="255" fill="#6EE7B7" font-size="14" font-weight="700" text-anchor="end">×10,800</text>
    </g>
    <text x="652" y="296" fill="#64748B" font-size="10">Basis: one loop of generate → evaluate → suggest</text>
    <text x="652" y="312" fill="#64748B" font-size="10">for the same styling intent; AI side is seconds.</text>
  </g>
  <text x="40" y="398" fill="#64748B" font-size="11.5">How to read: the y-axis is logarithmic, so equal steps mean 10× — lower dots are faster. The gain is orders of magnitude, not percent: shrinking a loop from weeks to minutes is what makes large-scale proposal comparison possible.</text>
</svg>
