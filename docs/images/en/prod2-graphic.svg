<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="prod2en-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity=".30"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity=".12"/>
    </linearGradient>
    <marker id="prod2en-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FBBF24"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#FBBF24"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Parametric Proportions: one vector, four representations</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">22-Field CarParams</text>

  <!-- left: side view -->
  <rect x="24" y="58" width="548" height="322" rx="12" fill="#0B101A" stroke="#1E2A3A"/>
  <text x="298" y="82" fill="#7DD3FC" font-size="12.5" font-weight="700" text-anchor="middle">Side wireframe · three-band proportion overlay</text>

  <path d="M104 286 L104 250 Q104 238 116 236 L178 232 Q190 231 198 224 L258 186 Q266 181 276 181 L410 181 Q422 181 430 190 L484 238 Q492 244 502 244 L540 244 Q552 246 552 258 L552 286"
        fill="none" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="5 4" opacity=".75"/>
  <path d="M96 286 L96 254 Q96 242 108 240 L172 236 Q184 235 192 228 L254 190 Q262 185 272 185 L404 185 Q416 185 424 194 L478 242 Q486 248 496 248 L534 248 Q546 250 546 262 L546 286 Z"
        fill="url(#prod2en-body)" stroke="#34D399" stroke-width="1.8"/>
  <path d="M268 194 L392 194 L438 236 L286 236 Z" fill="#0F1622" stroke="#38BDF8" stroke-opacity=".55"/>
  <line x1="358" y1="194" x2="362" y2="236" stroke="#38BDF8" stroke-opacity=".55"/>
  <g>
    <circle cx="176" cy="286" r="30" fill="#0B101A" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="176" cy="286" r="17" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
    <circle cx="176" cy="286" r="4" fill="#94A3B8"/>
    <circle cx="474" cy="286" r="30" fill="#0B101A" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="474" cy="286" r="17" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
    <circle cx="474" cy="286" r="4" fill="#94A3B8"/>
  </g>
  <line x1="56" y1="316" x2="540" y2="316" stroke="#475569" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="64" y="330" fill="#64748B" font-size="9.5">ground z = 0</text>

  <line x1="96" y1="340" x2="546" y2="340" stroke="#FBBF24" stroke-width="1.2" marker-start="url(#prod2en-dim)" marker-end="url(#prod2en-dim)"/>
  <text x="321" y="356" fill="#FCD34D" font-size="10" text-anchor="middle">overall_length 4000 – 6200 mm</text>
  <line x1="176" y1="300" x2="474" y2="300" stroke="#FBBF24" stroke-width="1" marker-start="url(#prod2en-dim)" marker-end="url(#prod2en-dim)"/>
  <text x="325" y="295" fill="#FCD34D" font-size="9.5" text-anchor="middle">wheel_base 2400 – 3700</text>
  <text x="321" y="374" fill="#94A3B8" font-size="9" text-anchor="middle">front_overhang 750–1150 · rear_overhang 850–1350</text>
  <line x1="96" y1="262" x2="96" y2="316" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="84" y="212" fill="#7DD3FC" font-size="9" transform="rotate(-90 84 212)" text-anchor="middle">overall_height 1100–2050</text>
  <text x="556" y="310" fill="#94A3B8" font-size="9" text-anchor="end">ground_clearance 80–280</text>

  <!-- right: four consumers -->
  <rect x="592" y="58" width="344" height="322" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="610" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">22-field CarParams → four consumers</text>
  <g font-size="10.5">
    <rect x="610" y="100" width="308" height="40" rx="8" fill="#0E1E2E" stroke="#38BDF8" stroke-opacity=".35"/>
    <circle cx="628" cy="120" r="4" fill="#38BDF8"/>
    <text x="642" y="117" fill="#7DD3FC" font-weight="700">Real-time 3D mesh preview</text>
    <text x="642" y="132" fill="#64748B" font-size="9.5">same parameters, refreshed on drag</text>

    <rect x="610" y="148" width="308" height="40" rx="8" fill="#0F241C" stroke="#34D399" stroke-opacity=".35"/>
    <circle cx="628" cy="168" r="4" fill="#34D399"/>
    <text x="642" y="165" fill="#6EE7B7" font-weight="700">NURBS body + G1 end caps</text>
    <text x="642" y="180" fill="#64748B" font-size="9.5">generated from parameters, no fitting</text>

    <rect x="610" y="196" width="308" height="40" rx="8" fill="#2A1A0E" stroke="#FBBF24" stroke-opacity=".35"/>
    <circle cx="628" cy="216" r="4" fill="#FBBF24"/>
    <text x="642" y="213" fill="#FCD34D" font-weight="700">G0 / G1 / G2 quality evaluation</text>
    <text x="642" y="228" fill="#64748B" font-size="9.5">grade A–D plus continuity report</text>

    <rect x="610" y="244" width="308" height="40" rx="8" fill="#1A1230" stroke="#A78BFA" stroke-opacity=".35"/>
    <circle cx="628" cy="264" r="4" fill="#A78BFA"/>
    <text x="642" y="261" fill="#C4B5FD" font-weight="700">STEP / IGES / STL hand-off</text>
    <text x="642" y="276" fill="#64748B" font-size="9.5">engineering formats into downstream CAD</text>
  </g>
  <line x1="610" y1="302" x2="918" y2="302" stroke="#1E2A3A"/>
  <text x="610" y="322" fill="#94A3B8" font-size="10">Edit any field → control points re-seat → all four stay in sync.</text>
  <text x="610" y="340" fill="#64748B" font-size="9.5">There is no second mesh-to-NURBS fitting step.</text>
  <text x="610" y="360" fill="#475569" font-size="9.5">Purple reference outline compares proportions only.</text>

  <text x="24" y="404" fill="#94A3B8" font-size="10.5">How to read: amber lines are hard parameter bounds; green is the generated profile; the purple dashed outline is an alternative proportion set.</text>
  <text x="24" y="426" fill="#64748B" font-size="10">Every annotated value is a lower/upper bound, not a measured vehicle; the body is a proportion sketch.</text>
  <text x="24" y="446" fill="#475569" font-size="9.5">Source: PRODUCT_SPEC §4.2 Designer parameter panel; CarParams shares its fields with the 14-D search space.</text>
</svg>
