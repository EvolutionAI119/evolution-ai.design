<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="438" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#38BDF8"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Production topology (mainland compliance + same-origin proxy)</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Deployment Topology</text>
  <rect x="40" y="190" width="110" height="60" rx="10" fill="#0B101A" stroke="#64748B"/>
  <text x="95" y="218" fill="#E2E8F0" font-size="12" font-weight="700" text-anchor="middle">Browser</text>
  <text x="95" y="236" fill="#94A3B8" font-size="10" text-anchor="middle">User side</text>
  <rect x="210" y="170" width="150" height="100" rx="10" fill="#0B1A2E" stroke="#38BDF8"/>
  <text x="285" y="200" fill="#7DD3FC" font-size="12.5" font-weight="700" text-anchor="middle">Nginx (TLS)</text>
  <text x="285" y="222" fill="#94A3B8" font-size="10" text-anchor="middle">Same-origin proxy</text>
  <text x="285" y="240" fill="#64748B" font-size="9.5" text-anchor="middle">/ → dist static</text>
  <text x="285" y="256" fill="#64748B" font-size="9" text-anchor="middle">/api &amp; /admin → backend</text>
  <rect x="420" y="70" width="180" height="70" rx="10" fill="#0B101A" stroke="#34D399"/>
  <text x="510" y="100" fill="#6EE7B7" font-size="12" font-weight="700" text-anchor="middle">GitHub Pages / dist</text>
  <text x="510" y="120" fill="#94A3B8" font-size="9.5" text-anchor="middle">Public site (zero admin code)</text>
  <rect x="420" y="170" width="180" height="100" rx="10" fill="#0F241C" stroke="#A78BFA"/>
  <text x="510" y="200" fill="#C4B5FD" font-size="12.5" font-weight="700" text-anchor="middle">FastAPI backend</text>
  <text x="510" y="220" fill="#94A3B8" font-size="10" text-anchor="middle">/api/v1/* business APIs</text>
  <text x="510" y="238" fill="#94A3B8" font-size="10" text-anchor="middle">/admin standalone console</text>
  <text x="510" y="256" fill="#64748B" font-size="9.5" text-anchor="middle">GUEST_MODE (mothballed)</text>
  <rect x="420" y="290" width="180" height="70" rx="10" fill="#0B101A" stroke="#FBBF24"/>
  <text x="510" y="320" fill="#FCD34D" font-size="12" font-weight="700" text-anchor="middle">PostgreSQL + Redis</text>
  <text x="510" y="340" fill="#94A3B8" font-size="10" text-anchor="middle">Data + sessions/rate-limit</text>
  <rect x="680" y="150" width="220" height="130" rx="10" fill="#1A1230" stroke="#A78BFA" stroke-dasharray="4 3"/>
  <text x="790" y="178" fill="#C4B5FD" font-size="11.5" font-weight="700" text-anchor="middle">JD Cloud 2C4G (CN compliant)</text>
  <text x="790" y="198" fill="#94A3B8" font-size="10" text-anchor="middle">2G swap · 4-service Docker stack</text>
  <text x="790" y="216" fill="#94A3B8" font-size="10" text-anchor="middle">Domain onshore + ICP filing</text>
  <text x="790" y="234" fill="#64748B" font-size="9.5" text-anchor="middle">WeChat QR needs mainland server</text>
  <text x="790" y="256" fill="#FCD34D" font-size="9.5" text-anchor="middle">PIPL: data stays onshore</text>
  <defs><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker></defs>
  <line x1="150" y1="220" x2="210" y2="220" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#d)"/>
