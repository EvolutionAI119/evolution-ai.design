<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="428" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#38BDF8"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Counted Structural Units of the Knowledge System</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Structural Units</text>

  <g stroke="#1E2A3A" stroke-width="1">
    <line x1="330" y1="84" x2="330" y2="356"/>
    <line x1="450" y1="84" x2="450" y2="356"/>
    <line x1="570" y1="84" x2="570" y2="356"/>
    <line x1="690" y1="84" x2="690" y2="356"/>
    <line x1="210" y1="84" x2="210" y2="356"/>
  </g>
  <line x1="210" y1="356" x2="690" y2="356" stroke="#334155" stroke-width="1.2"/>
  <g fill="#475569" font-size="10" text-anchor="middle">
    <text x="210" y="374">0</text><text x="330" y="374">3</text><text x="450" y="374">6</text><text x="570" y="374">9</text><text x="690" y="374">12</text>
  </g>
  <text x="450" y="390" fill="#64748B" font-size="10" text-anchor="middle">Number of items</text>

  <g font-size="10.5">
    <rect x="210" y="94" width="160" height="18" rx="4" fill="#A78BFA" opacity=".3"/><rect x="210" y="94" width="160" height="18" rx="4" fill="none" stroke="#A78BFA"/>
    <text x="200" y="107" fill="#CBD5E1" text-anchor="end">Philosophical roots</text><text x="378" y="107" fill="#C4B5FD" font-size="12" font-weight="700">4</text>

    <rect x="210" y="132" width="360" height="18" rx="4" fill="#38BDF8" opacity=".3"/><rect x="210" y="132" width="360" height="18" rx="4" fill="none" stroke="#38BDF8"/>
    <text x="200" y="145" fill="#CBD5E1" text-anchor="end">Abstraction L1–L9</text><text x="578" y="145" fill="#7DD3FC" font-size="12" font-weight="700">9</text>

    <rect x="210" y="170" width="400" height="18" rx="4" fill="#34D399" opacity=".3"/><rect x="210" y="170" width="400" height="18" rx="4" fill="none" stroke="#34D399"/>
    <text x="200" y="183" fill="#CBD5E1" text-anchor="end">Knowledge dimensions</text><text x="618" y="183" fill="#6EE7B7" font-size="12" font-weight="700">10</text>

    <rect x="210" y="208" width="360" height="18" rx="4" fill="#FBBF24" opacity=".3"/><rect x="210" y="208" width="360" height="18" rx="4" fill="none" stroke="#FBBF24"/>
    <text x="200" y="221" fill="#CBD5E1" text-anchor="end">Nine principles</text><text x="578" y="221" fill="#FCD34D" font-size="12" font-weight="700">9</text>

    <rect x="210" y="246" width="240" height="18" rx="4" fill="#F472B6" opacity=".3"/><rect x="210" y="246" width="240" height="18" rx="4" fill="none" stroke="#F472B6"/>
    <text x="200" y="259" fill="#CBD5E1" text-anchor="end">Six laws of painting</text><text x="458" y="259" fill="#F9A8D4" font-size="12" font-weight="700">6</text>

    <rect x="210" y="284" width="200" height="18" rx="4" fill="#38BDF8" opacity=".24"/><rect x="210" y="284" width="200" height="18" rx="4" fill="none" stroke="#38BDF8"/>
    <text x="200" y="297" fill="#CBD5E1" text-anchor="end">Aesthetic regions</text><text x="418" y="297" fill="#7DD3FC" font-size="12" font-weight="700">5</text>

    <rect x="210" y="322" width="240" height="18" rx="4" fill="#A78BFA" opacity=".24"/><rect x="210" y="322" width="240" height="18" rx="4" fill="none" stroke="#A78BFA"/>
    <text x="200" y="335" fill="#CBD5E1" text-anchor="end">Pattern themes</text><text x="458" y="335" fill="#C4B5FD" font-size="12" font-weight="700">6</text>
  </g>

  <g>
    <rect x="716" y="86" width="220" height="264" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="732" y="108" fill="#E2E8F0" font-size="12" font-weight="700">Counting basis</text>
    <text x="732" y="130" fill="#94A3B8" font-size="9.5">4 roots → 9 levels → 10 dims →</text>
    <text x="732" y="146" fill="#94A3B8" font-size="9.5">9 principles → 6 laws → 5 regions</text>
    <text x="732" y="162" fill="#94A3B8" font-size="9.5">→ 6 pattern themes; + 4 institutions.</text>
    <line x1="732" y1="176" x2="920" y2="176" stroke="#1E2A3A"/>
    <text x="732" y="196" fill="#6EE7B7" font-size="12" font-weight="600">53 structural units in total</text>
    <text x="732" y="214" fill="#64748B" font-size="9.5">excludes references and figures</text>
    <line x1="732" y1="228" x2="920" y2="228" stroke="#1E2A3A"/>
    <text x="732" y="248" fill="#94A3B8" font-size="9.5">Dimensions grow from 5 to 10:</text>
    <text x="732" y="264" fill="#C4B5FD" font-size="11" font-weight="600">coverage roughly doubles</text>
    <text x="732" y="282" fill="#64748B" font-size="9.5">The 5 additions sit at the</text>
    <text x="732" y="297" fill="#64748B" font-size="9.5">"root" level: philosophy, culture,</text>
    <text x="732" y="312" fill="#64748B" font-size="9.5">knowledge, principles, language.</text>
    <text x="732" y="334" fill="#475569" font-size="9.5">Source: tables in this document</text>
  </g>
  <text x="40" y="412" fill="#64748B" font-size="11">How to read: bar length equals the item count of that unit; grid lines every 3 items aid estimation. The contrast shows the weight sits in levels and dimensions rather than scattered items — the structural signature of a meta-theory.</text>
</svg>
