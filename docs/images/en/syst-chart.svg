<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="systc-conv-en" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity=".02"/>
      <stop offset="1" stop-color="#34D399" stop-opacity=".14"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="438" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Qualitative → Quantitative: Score Convergence</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Convergence over Observations</text>

  <rect x="375" y="88" width="275" height="246" fill="url(#systc-conv-en)"/>
  <line x1="375" y1="88" x2="375" y2="334" stroke="#34D399" stroke-width="1" stroke-dasharray="3 4" opacity=".5"/>

  <g stroke="#1E2A3A" stroke-width="1">
    <line x1="100" y1="300" x2="650" y2="300"/>
    <line x1="100" y1="240" x2="650" y2="240"/>
    <line x1="100" y1="180" x2="650" y2="180"/>
    <line x1="100" y1="120" x2="650" y2="120"/>
  </g>
  <line x1="100" y1="330" x2="650" y2="330" stroke="#334155" stroke-width="1.2"/>
  <line x1="100" y1="330" x2="100" y2="88" stroke="#334155" stroke-width="1.2"/>
  <g fill="#475569" font-size="10" text-anchor="end">
    <text x="92" y="304">0.60</text><text x="92" y="244">0.70</text><text x="92" y="184">0.80</text><text x="92" y="124">0.90</text>
  </g>
  <g fill="#475569" font-size="10" text-anchor="middle">
    <text x="100" y="350">0</text><text x="238" y="350">10</text><text x="375" y="350">20</text><text x="513" y="350">30</text><text x="650" y="350">40</text>
  </g>
  <text x="375" y="370" fill="#64748B" font-size="10" text-anchor="middle">Observations (Bayesian observe)</text>
  <text x="64" y="210" fill="#64748B" font-size="10" transform="rotate(-90 64 210)" text-anchor="middle">Composite quality score (0–1)</text>

  <line x1="100" y1="120" x2="650" y2="120" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 5"/>
  <text x="650" y="112" fill="#94A3B8" font-size="9.5" text-anchor="end">0.90 target band</text>

  <path d="M100 288 C200 250 300 205 375 168 C450 148 560 130 650 124 L650 132 C560 140 450 160 375 178 C300 216 200 262 100 296 Z" fill="#38BDF8" opacity=".12"/>
  <path d="M100 288 C200 250 300 205 375 168 C450 148 560 130 650 124" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
  <path d="M100 296 C200 262 300 216 375 178 C450 160 560 140 650 132" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>

  <path d="M100 288 C125 270 140 250 155 240 C180 222 195 214 210 210 C235 200 250 192 265 186 C290 174 305 170 320 168 C345 164 360 158 375 153 C400 148 415 144 430 141 C455 137 470 135 485 132 C510 128 525 126 540 125 C565 123 580 121 595 120 C620 118 635 118 650 117"
        fill="none" stroke="#34D399" stroke-width="2.4"/>

  <g fill="#0F1622" stroke="#34D399" stroke-width="2">
    <circle cx="100" cy="288" r="4"/><circle cx="210" cy="210" r="4"/><circle cx="320" cy="168" r="4"/>
    <circle cx="430" cy="141" r="4"/><circle cx="540" cy="125" r="4"/><circle cx="650" cy="117" r="4"/>
  </g>

  <text x="112" y="278" fill="#94A3B8" font-size="10">first round 0.62</text>
  <text x="118" y="266" fill="#64748B" font-size="9">qualitative prior</text>
  <text x="300" y="238" fill="#7DD3FC" font-size="10">GP belief band narrows</text>
  <text x="452" y="104" fill="#6EE7B7" font-size="10" font-weight="600">20–40 rounds: plateau</text>
  <text x="386" y="222" fill="#64748B" font-size="9.5">EI / UCB sampling</text>
  <text x="386" y="236" fill="#64748B" font-size="9.5">one small step per round</text>

  <g>
    <rect x="674" y="88" width="256" height="246" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="692" y="110" fill="#E2E8F0" font-size="12" font-weight="700">Three readings</text>
    <line x1="692" y1="122" x2="912" y2="122" stroke="#1E2A3A"/>
    <text x="692" y="142" fill="#6EE7B7" font-size="10.5" font-weight="600">① The start is not zero</text>
    <text x="692" y="158" fill="#64748B" font-size="9.5">0.62 comes from brand benchmark</text>
    <text x="692" y="172" fill="#64748B" font-size="9.5">and priors, not random parameters.</text>
    <text x="692" y="196" fill="#7DD3FC" font-size="10.5" font-weight="600">② Band width = uncertainty</text>
    <text x="692" y="212" fill="#64748B" font-size="9.5">Narrower band, more certain;</text>
    <text x="692" y="226" fill="#64748B" font-size="9.5">a rising tail means model mismatch.</text>
    <text x="692" y="250" fill="#FCD34D" font-size="10.5" font-weight="600">③ Converge, then regress</text>
    <text x="692" y="266" fill="#64748B" font-size="9.5">955 tests (205 algo / 388 backend /</text>
    <text x="692" y="280" fill="#64748B" font-size="9.5">362 frontend) lock behaviour.</text>
    <text x="692" y="318" fill="#475569" font-size="9">30 rounds typical; 20–40 allowed</text>
  </g>
  <text x="40" y="404" fill="#64748B" font-size="11">How to read: x counts observations, y is the composite score; the green line is the best estimate under current belief, the blue dashed band is GP uncertainty.</text>
  <text x="40" y="424" fill="#475569" font-size="10">Watch three things — start (prior strength), slope (information per round), band (missing evidence). Curve is typical; statistics follow the validation report.</text>
</svg>
