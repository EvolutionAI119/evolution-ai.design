<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="428" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Partitioning the Parameter Space: 14 of 22 Dimensions Are Searched</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Parameter-Space Partition</text>

  <!-- Grid -->
  <g stroke="#1E2A3A" stroke-width="1">
    <line x1="245" y1="96" x2="245" y2="300"/>
    <line x1="370" y1="96" x2="370" y2="300"/>
    <line x1="495" y1="96" x2="495" y2="300"/>
    <line x1="620" y1="96" x2="620" y2="300"/>
  </g>
  <line x1="120" y1="300" x2="670" y2="300" stroke="#334155" stroke-width="1.2"/>
  <g fill="#475569" font-size="10" text-anchor="middle">
    <text x="120" y="318">0</text><text x="245" y="318">5</text><text x="370" y="318">10</text><text x="495" y="318">15</text><text x="620" y="318">20</text><text x="670" y="318">22</text>
  </g>
  <text x="395" y="334" fill="#64748B" font-size="10" text-anchor="middle">Parameter dimensions</text>

  <!-- Bars -->
  <g>
    <text x="112" y="158" fill="#CBD5E1" font-size="10" text-anchor="end">Vehicle space</text>
    <rect x="120" y="140" width="550" height="34" rx="5" fill="#A78BFA" opacity=".28"/>
    <rect x="120" y="140" width="550" height="34" rx="5" fill="none" stroke="#A78BFA"/>
    <text x="680" y="162" fill="#C4B5FD" font-size="12" font-weight="700">22</text>

    <text x="112" y="214" fill="#CBD5E1" font-size="10" text-anchor="end">Bayes-searchable</text>
    <rect x="120" y="196" width="350" height="34" rx="5" fill="#34D399" opacity=".3"/>
    <rect x="120" y="196" width="350" height="34" rx="5" fill="none" stroke="#34D399"/>
    <text x="480" y="218" fill="#6EE7B7" font-size="12" font-weight="700">14</text>
    <text x="496" y="218" fill="#64748B" font-size="9.5">= 64%, acquisition searches here</text>

    <text x="112" y="270" fill="#CBD5E1" font-size="10" text-anchor="end">Frozen points</text>
    <rect x="120" y="252" width="200" height="34" rx="5" fill="#FBBF24" opacity=".28"/>
    <rect x="120" y="252" width="200" height="34" rx="5" fill="none" stroke="#FBBF24"/>
    <text x="330" y="274" fill="#FCD34D" font-size="12" font-weight="700">8</text>
    <text x="346" y="274" fill="#64748B" font-size="9.5">= 36%, size / regulation frozen first</text>
  </g>

  <!-- Right card -->
  <g>
    <rect x="702" y="90" width="228" height="218" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
    <circle cx="816" cy="150" r="42" fill="none" stroke="#FBBF24" stroke-width="14" opacity=".55"/>
    <circle cx="816" cy="150" r="42" fill="none" stroke="#34D399" stroke-width="14" stroke-dasharray="169 264" transform="rotate(-90 816 150)"/>
    <text x="816" y="147" fill="#E2E8F0" font-size="17" font-weight="700" text-anchor="middle">64%</text>
    <text x="816" y="164" fill="#64748B" font-size="9" text-anchor="middle">searchable</text>
    <text x="718" y="212" fill="#94A3B8" font-size="10">· 8 dims frozen, then search 14</text>
    <text x="718" y="230" fill="#94A3B8" font-size="10">· Bounds set by validators / rules</text>
    <text x="718" y="248" fill="#94A3B8" font-size="10">· Variant compare touches free dims</text>
    <text x="718" y="272" fill="#64748B" font-size="9.5">Hard points first = a real baseline</text>
    <text x="718" y="290" fill="#475569" font-size="9.5">otherwise search idles with no ground</text>
  </g>
  <text x="40" y="378" fill="#64748B" font-size="10.5">How to read: the three bars share one 0–22 ruler — not all 22 dimensions are searched; 8 are frozen hard points, and optimization runs in the remaining 14.</text>
  <text x="40" y="396" fill="#64748B" font-size="10.5">The clearer the partition, the easier it is to see that constraint is freedom.</text>
  <text x="40" y="416" fill="#475569" font-size="9.5">Basis: 22-dim CarParams and the 14-dim default Bayesian space from the platform parameter definitions; the 8 frozen dimensions are size, regulation and structure.</text>
</svg>
