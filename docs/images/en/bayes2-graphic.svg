<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="bayes2en-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity=".20"/>
      <stop offset="1" stop-color="#34D399" stop-opacity=".04"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="428" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#F472B6"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Two acquisitions: EI probability of gain vs UCB confidence bound</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Acquisition Functions</text>

  <rect x="24" y="56" width="450" height="310" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
  <text x="44" y="80" fill="#F9A8D4" font-size="12.5" font-weight="700">EI · Expected Improvement (default)</text>
  <text x="44" y="98" fill="#64748B" font-size="9.5">Expectation over both the size and the probability of improvement</text>

  <g stroke="#1E2A3A">
    <line x1="64" y1="130" x2="450" y2="130"/>
    <line x1="64" y1="180" x2="450" y2="180"/>
    <line x1="64" y1="230" x2="450" y2="230"/>
    <line x1="64" y1="280" x2="450" y2="280"/>
  </g>
  <line x1="64" y1="320" x2="452" y2="320" stroke="#475569"/>
  <line x1="64" y1="120" x2="64" y2="320" stroke="#475569"/>
  <text x="52" y="226" fill="#64748B" font-size="9.5" text-anchor="middle" transform="rotate(-90 52 226)">EI(x)</text>
  <g font-size="9" fill="#64748B" text-anchor="middle">
    <text x="64" y="336">0</text><text x="161" y="336">0.25</text><text x="258" y="336">0.5</text><text x="355" y="336">0.75</text><text x="452" y="336">1</text>
  </g>
  <text x="452" y="352" fill="#64748B" font-size="9.5" text-anchor="end">normalized parameter x</text>

  <path d="M64 300 C 130 296, 180 286, 222 262 C 262 238, 300 176, 331 158 C 362 144, 392 168, 440 230"
        fill="none" stroke="#F472B6" stroke-width="2.4"/>
  <line x1="331" y1="158" x2="331" y2="320" stroke="#F472B6" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="331" cy="158" r="5" fill="#F472B6"/>
  <text x="331" y="146" fill="#F9A8D4" font-size="10" text-anchor="middle">EI maximum → next sample</text>
  <text x="339" y="176" fill="#64748B" font-size="9">x*</text>

  <g font-size="9.5">
    <text x="450" y="112" fill="#94A3B8" text-anchor="end">xi = 0.01 minimum improvement</text>
    <text x="88" y="212" fill="#64748B">explore: σ large, EI rises</text>
    <text x="404" y="286" fill="#64748B" text-anchor="end">exploit: μ high, σ small</text>
  </g>
  <text x="44" y="378" fill="#64748B" font-size="9">Converges fast on smooth objectives; the default for most styling scores.</text>

  <rect x="486" y="56" width="450" height="310" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
  <text x="506" y="80" fill="#7DD3FC" font-size="12.5" font-weight="700">UCB · Upper Confidence Bound</text>
  <text x="506" y="98" fill="#64748B" font-size="9.5">μ + κσ explicitly makes uncertain regions more attractive</text>

  <g stroke="#1E2A3A">
    <line x1="526" y1="130" x2="912" y2="130"/>
    <line x1="526" y1="180" x2="912" y2="180"/>
    <line x1="526" y1="230" x2="912" y2="230"/>
    <line x1="526" y1="280" x2="912" y2="280"/>
  </g>
  <line x1="526" y1="320" x2="914" y2="320" stroke="#475569"/>
  <line x1="526" y1="120" x2="526" y2="320" stroke="#475569"/>
  <text x="514" y="226" fill="#64748B" font-size="9.5" text-anchor="middle" transform="rotate(-90 514 226)">score</text>
  <g font-size="9" fill="#64748B" text-anchor="middle">
    <text x="526" y="336">0</text><text x="623" y="336">0.25</text><text x="720" y="336">0.5</text><text x="817" y="336">0.75</text><text x="914" y="336">1</text>
  </g>
  <text x="914" y="352" fill="#64748B" font-size="9.5" text-anchor="end">normalized parameter x</text>

  <path d="M526 226 C 586 202, 626 236, 676 212 C 726 188, 760 158, 806 164 C 846 170, 878 188, 912 182 L 912 238 C 878 246, 846 228, 806 222 C 760 216, 726 250, 676 262 C 626 274, 586 274, 526 262 Z"
        fill="url(#bayes2en-band)"/>
  <path d="M526 226 C 586 202, 626 236, 676 212 C 726 188, 760 158, 806 164 C 846 170, 878 188, 912 182"
        fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <path d="M526 250 C 586 238, 626 262, 676 246 C 726 230, 760 196, 806 198 C 846 202, 878 216, 912 210"
        fill="none" stroke="#34D399" stroke-width="2.2"/>
  <text x="838" y="158" fill="#7DD3FC" font-size="9.5">UCB = μ + κσ</text>
  <text x="838" y="240" fill="#6EE7B7" font-size="9.5">posterior mean μ(x)</text>

  <line x1="806" y1="164" x2="806" y2="198" stroke="#F472B6" stroke-width="1.2"/>
  <line x1="799" y1="164" x2="813" y2="164" stroke="#F472B6" stroke-width="1.2"/>
  <line x1="799" y1="198" x2="813" y2="198" stroke="#F472B6" stroke-width="1.2"/>
  <text x="816" y="188" fill="#F9A8D4" font-size="9">κσ</text>

  <g fill="#FBBF24">
    <circle cx="586" cy="220" r="4"/><circle cx="676" cy="222" r="4"/><circle cx="806" cy="190" r="4"/>
  </g>
  <g font-size="9.5">
    <text x="548" y="112" fill="#94A3B8">κ = 2.0 (default weight)</text>
    <text x="506" y="378" fill="#64748B">κ↑ explores more; κ↓ favors known good regions; suits multi-modal objectives.</text>
  </g>

  <text x="24" y="392" fill="#94A3B8" font-size="10.5">How to read: EI weights gain by probability and peaks where room for improvement meets uncertainty; UCB lifts the upper bound, so larger κ explores more.</text>
  <text x="24" y="410" fill="#64748B" font-size="10">Implementation: the maximum over a 4096-point random pool; EI xi = 0.01 and UCB κ = 2.0 are defaults, both switchable at session creation.</text>
</svg>
