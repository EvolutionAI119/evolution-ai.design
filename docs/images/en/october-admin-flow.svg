<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="438" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#F87171"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Admin relocation: public frontend → backend hosting</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Admin Relocation Flow</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#38BDF8"/>
    </marker>
  </defs>
  <rect x="40" y="80" width="200" height="90" rx="10" fill="#2A0F1A" stroke="#F87171"/>
  <text x="140" y="112" fill="#F87171" font-size="13" font-weight="700" text-anchor="middle">❌ Old: public frontend</text>
  <text x="140" y="134" fill="#94A3B8" font-size="10.5" text-anchor="middle">Main SPA bundled /admin routes</text>
  <text x="140" y="152" fill="#64748B" font-size="9.5" text-anchor="middle">Admin code served via gh-pages</text>
  <rect x="40" y="250" width="200" height="90" rx="10" fill="#0F241C" stroke="#34D399"/>
  <text x="140" y="282" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">✅ New: backend-hosted</text>
  <text x="140" y="304" fill="#94A3B8" font-size="10.5" text-anchor="middle">FastAPI StaticFiles /admin</text>
  <text x="140" y="322" fill="#64748B" font-size="10" text-anchor="middle">Zero admin code on public site</text>
  <line x1="140" y1="170" x2="140" y2="250" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="300" y="120" width="140" height="110" rx="10" fill="#0B101A" stroke="#38BDF8"/>
  <circle cx="370" cy="110" r="11" fill="#38BDF8"/>
  <text x="370" y="114" fill="#0F1622" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="370" y="148" fill="#7DD3FC" font-size="11.5" font-weight="700" text-anchor="middle">Site removal</text>
  <text x="370" y="172" fill="#94A3B8" font-size="9" text-anchor="middle">/admin routes</text>
  <text x="370" y="188" fill="#94A3B8" font-size="9" text-anchor="middle">+ sidebar admin group</text>
  <text x="370" y="204" fill="#94A3B8" font-size="9" text-anchor="middle">+ Admin chunk</text>
  <line x1="440" y1="175" x2="455" y2="175" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="455" y="120" width="140" height="110" rx="10" fill="#0B101A" stroke="#A78BFA"/>
  <circle cx="525" cy="110" r="11" fill="#A78BFA"/>
  <text x="525" y="114" fill="#0F1622" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="525" y="148" fill="#C4B5FD" font-size="11.5" font-weight="700" text-anchor="middle">Standalone build</text>
  <text x="525" y="172" fill="#94A3B8" font-size="9" text-anchor="middle">admin.html</text>
  <text x="525" y="188" fill="#94A3B8" font-size="9" text-anchor="middle">admin_main.js</text>
  <text x="525" y="204" fill="#94A3B8" font-size="9" text-anchor="middle">AdminGate login gate</text>
  <line x1="595" y1="175" x2="610" y2="175" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="610" y="120" width="140" height="110" rx="10" fill="#0B101A" stroke="#34D399"/>
  <circle cx="680" cy="110" r="11" fill="#34D399"/>
  <text x="680" y="114" fill="#0F1622" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="680" y="148" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">Backend hosting</text>
  <text x="680" y="172" fill="#94A3B8" font-size="9" text-anchor="middle">vite.admin.config.js</text>
  <text x="680" y="188" fill="#94A3B8" font-size="9" text-anchor="middle">→ static/admin</text>
  <text x="680" y="204" fill="#94A3B8" font-size="9" text-anchor="middle">FastAPI mount /admin</text>
  <line x1="750" y1="175" x2="765" y2="175" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="765" y="120" width="140" height="110" rx="10" fill="#0B101A" stroke="#FBBF24"/>
  <circle cx="835" cy="110" r="11" fill="#FBBF24"/>
  <text x="835" y="114" fill="#0F1622" font-size="11" font-weight="700" text-anchor="middle">4</text>
  <text x="835" y="148" fill="#FCD34D" font-size="11.5" font-weight="700" text-anchor="middle">CSP scoping</text>
  <text x="835" y="172" fill="#94A3B8" font-size="9" text-anchor="middle">/admin docs only</text>
  <text x="835" y="188" fill="#94A3B8" font-size="9" text-anchor="middle">unsafe-eval allowed</text>
  <text x="835" y="204" fill="#94A3B8" font-size="9" text-anchor="middle">public site stays strict</text>
  <rect x="320" y="268" width="580" height="102" rx="10" fill="#0B101A" stroke="#A78BFA"/>
  <text x="340" y="294" fill="#C4B5FD" font-size="12.5" font-weight="700">Login gate semantics</text>
  <g font-size="10.5" fill="#94A3B8">
    <circle cx="340" cy="316" r="2.5" fill="#34D399"/><text x="350" y="320">Guest mode: auto-enter (guest/superadmin)</text>
    <circle cx="340" cy="338" r="2.5" fill="#38BDF8"/><text x="350" y="342">Production: admin email+password login; non-admins see no permission</text>
    <circle cx="340" cy="360" r="2.5" fill="#FBBF24"/><text x="350" y="364">All 5 tabs kept: login records / users / backend errors / audit logs / impact evidence</text>
  </g>
</svg>