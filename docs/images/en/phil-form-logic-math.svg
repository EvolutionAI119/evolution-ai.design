<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#38BDF8"/>
    </marker>
    <marker id="ar2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34D399"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="428" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Framework: Form · Logic · Mathematics</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">A self-consistent 3-layer system</text>

  <!-- Layer 1: Form -->
  <g>
    <rect x="40" y="60" width="640" height="96" rx="12" fill="#1A1230" stroke="#A78BFA" stroke-width="1.2"/>
    <text x="64" y="94" fill="#A78BFA" font-size="17" font-weight="700">Form</text>
    <text x="150" y="94" fill="#94A3B8" font-size="12">— the visible aesthetic layer</text>
    <g font-size="12" fill="#C4B5FD">
      <rect x="64" y="108" width="118" height="30" rx="8" fill="#241A40"/><text x="123" y="127" text-anchor="middle">Feature lines</text>
      <rect x="192" y="108" width="118" height="30" rx="8" fill="#241A40"/><text x="251" y="127" text-anchor="middle">Light &amp; shadow</text>
      <rect x="320" y="108" width="118" height="30" rx="8" fill="#241A40"/><text x="379" y="127" text-anchor="middle">Stance &amp; proportion</text>
      <rect x="448" y="108" width="118" height="30" rx="8" fill="#241A40"/><text x="507" y="127" text-anchor="middle">Brand DNA</text>
    </g>
    <text x="640" y="127" fill="#64748B" font-size="11">→ render / 3D preview</text>
  </g>

  <!-- Layer 2: Logic -->
  <g>
    <rect x="40" y="172" width="640" height="96" rx="12" fill="#0E1E2E" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="64" y="206" fill="#38BDF8" font-size="17" font-weight="700">Logic</text>
    <text x="156" y="206" fill="#94A3B8" font-size="12">— parametric constraints &amp; styling logic</text>
    <g font-size="12" fill="#7DD3FC">
      <rect x="64" y="220" width="118" height="30" rx="8" fill="#12293D"/><text x="123" y="239" text-anchor="middle">Vehicle dims</text>
      <rect x="192" y="220" width="118" height="30" rx="8" fill="#12293D"/><text x="251" y="239" text-anchor="middle">Proportion rules</text>
      <rect x="320" y="220" width="118" height="30" rx="8" fill="#12293D"/><text x="379" y="239" text-anchor="middle">Line topology</text>
      <rect x="448" y="220" width="118" height="30" rx="8" fill="#12293D"/><text x="507" y="239" text-anchor="middle">Hardpoints</text>
    </g>
    <text x="640" y="239" fill="#64748B" font-size="11">→ param validation</text>
  </g>

  <!-- Layer 3: Mathematics -->
  <g>
    <rect x="40" y="284" width="640" height="96" rx="12" fill="#0F241C" stroke="#34D399" stroke-width="1.4"/>
    <text x="64" y="318" fill="#34D399" font-size="17" font-weight="700">Mathematics</text>
    <text x="212" y="318" fill="#94A3B8" font-size="12">— the math foundation (final form of all expression)</text>
    <g font-size="12" fill="#6EE7B7">
      <rect x="64" y="332" width="130" height="30" rx="8" fill="#123528"/><text x="129" y="351" text-anchor="middle">NURBS math</text>
      <rect x="204" y="332" width="130" height="30" rx="8" fill="#123528"/><text x="269" y="351" text-anchor="middle">Differential geometry</text>
      <rect x="344" y="332" width="130" height="30" rx="8" fill="#123528"/><text x="409" y="351" text-anchor="middle">Bayesian opt.</text>
      <rect x="484" y="332" width="130" height="30" rx="8" fill="#123528"/><text x="549" y="351" text-anchor="middle">DL evaluation</text>
    </g>
  </g>

  <!-- Right: layer relations -->
  <g>
    <rect x="706" y="60" width="224" height="320" rx="12" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="818" y="90" fill="#E2E8F0" font-size="13" font-weight="700" text-anchor="middle">Layer relations</text>
    <line x1="756" y1="112" x2="756" y2="352" stroke="#334155" stroke-width="1"/>
    <path d="M782 128 C 830 150, 830 300, 782 340" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#ar2)"/>
    <text x="836" y="228" fill="#7DD3FC" font-size="11.5" text-anchor="middle" transform="rotate(90 836 228)">Top-down: intent → parameters</text>
    <path d="M742 340 C 694 300, 694 150, 742 128" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#ar2g)"/>
    <text x="700" y="228" fill="#6EE7B7" font-size="11.5" text-anchor="middle" transform="rotate(-90 700 228)">Bottom-up: math optimum → form</text>
    <text x="818" y="368" fill="#64748B" font-size="10.5" text-anchor="middle">Bidirectional loop, not one-way</text>
  </g>

  <text x="40" y="408" fill="#64748B" font-size="11.5">How to read: each aesthetic decision becomes a Logic-layer constraint; each maps to a unique math form; math changes reflect back into Form instantly.</text>
</svg>
