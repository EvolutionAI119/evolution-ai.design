<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="438" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#38BDF8"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Three Systems Principles → Platform Decisions</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Principles Internalized</text>

  <text x="56" y="62" fill="#64748B" font-size="10">Systems-science principle</text>
  <text x="520" y="62" fill="#64748B" font-size="10">Platform design decision</text>

  <!-- Row 1 -->
  <rect x="40" y="74" width="320" height="82" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <rect x="40" y="74" width="4" height="82" rx="2" fill="#38BDF8"/>
  <text x="60" y="98" fill="#E2E8F0" font-size="12" font-weight="700">① Holism first</text>
  <text x="60" y="118" fill="#94A3B8" font-size="10">the whole exceeds the sum of parts</text>
  <text x="60" y="136" fill="#64748B" font-size="9.5">structure before individual features</text>
  <path d="M372 115 L500 115" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#systd-ar-en)"/>
  <rect x="512" y="74" width="408" height="82" rx="10" fill="#0E1E2E" stroke="#38BDF8"/>
  <text x="532" y="98" fill="#7DD3FC" font-size="11.5" font-weight="700">Five-layer architecture first</text>
  <text x="532" y="118" fill="#94A3B8" font-size="10">parameter space and quality standards before generation</text>
  <g font-size="9" text-anchor="middle">
    <rect x="532" y="128" width="64" height="18" rx="4" fill="#131C2A" stroke="#1E2A3A"/><text x="564" y="141" fill="#64748B">UI</text>
    <rect x="604" y="128" width="64" height="18" rx="4" fill="#131C2A" stroke="#1E2A3A"/><text x="636" y="141" fill="#64748B">Orch.</text>
    <rect x="676" y="128" width="64" height="18" rx="4" fill="#131C2A" stroke="#1E2A3A"/><text x="708" y="141" fill="#64748B">Algo</text>
    <rect x="748" y="128" width="64" height="18" rx="4" fill="#131C2A" stroke="#1E2A3A"/><text x="780" y="141" fill="#64748B">Data</text>
    <rect x="820" y="128" width="64" height="18" rx="4" fill="#131C2A" stroke="#1E2A3A"/><text x="852" y="141" fill="#64748B">Quality</text>
  </g>

  <!-- Row 2 -->
  <rect x="40" y="172" width="320" height="82" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <rect x="40" y="172" width="4" height="82" rx="2" fill="#A78BFA"/>
  <text x="60" y="196" fill="#E2E8F0" font-size="12" font-weight="700">② Clear hierarchy</text>
  <text x="60" y="216" fill="#94A3B8" font-size="10">different levels obey different laws</text>
  <text x="60" y="234" fill="#64748B" font-size="9.5">translate across layers, never command</text>
  <path d="M372 213 L500 213" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#systd-ar2-en)"/>
  <rect x="512" y="172" width="408" height="82" rx="10" fill="#1A1430" stroke="#A78BFA"/>
  <text x="532" y="196" fill="#C4B5FD" font-size="11.5" font-weight="700">Four-layer pyramid + three-layer cognition</text>
  <g font-size="9" text-anchor="middle">
    <rect x="532" y="208" width="88" height="18" rx="4" fill="#131C2A" stroke="#A78BFA" opacity=".8"/><text x="576" y="221" fill="#C4B5FD">philosophy</text>
    <rect x="628" y="208" width="88" height="18" rx="4" fill="#131C2A" stroke="#A78BFA" opacity=".8"/><text x="672" y="221" fill="#C4B5FD">strategy</text>
    <rect x="724" y="208" width="88" height="18" rx="4" fill="#131C2A" stroke="#A78BFA" opacity=".8"/><text x="768" y="221" fill="#C4B5FD">arch</text>
    <rect x="820" y="208" width="70" height="18" rx="4" fill="#131C2A" stroke="#A78BFA" opacity=".8"/><text x="855" y="221" fill="#C4B5FD">quality</text>
  </g>
  <text x="532" y="244" fill="#64748B" font-size="9">volume → form → graphic: each layer answers only its own question</text>

  <!-- Row 3 -->
  <rect x="40" y="270" width="320" height="82" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <rect x="40" y="270" width="4" height="82" rx="2" fill="#34D399"/>
  <text x="60" y="294" fill="#E2E8F0" font-size="12" font-weight="700">③ Dynamic evolution</text>
  <text x="60" y="314" fill="#94A3B8" font-size="10">order emerges through feedback</text>
  <text x="60" y="332" fill="#64748B" font-size="9.5">no backfill, no evolution</text>
  <path d="M372 311 L500 311" stroke="#34D399" stroke-width="1.6" marker-end="url(#systd-ar3-en)"/>
  <rect x="512" y="262" width="408" height="98" rx="10" fill="#0F241C" stroke="#34D399"/>
  <text x="532" y="284" fill="#6EE7B7" font-size="11.5" font-weight="700">Deep-evolution loop</text>
  <text x="532" y="302" fill="#94A3B8" font-size="9.5">suggest → evaluate → observe → converge → export → train → revise theory</text>
  <path d="M900 318 C900 344 860 350 812 344 C764 338 730 330 700 318" fill="none" stroke="#34D399" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#systd-ar3-en)"/>
  <text x="636" y="346" fill="#64748B" font-size="9" text-anchor="middle">every observe returns to belief</text>

  <text x="40" y="390" fill="#64748B" font-size="11">How to read: left are the three systems-science principles, right their concrete landing points; arrows give the translation direction.</text>
  <text x="40" y="408" fill="#64748B" font-size="11">Holism constrains structure, hierarchy constrains translation, dynamics constrains time — drop one and it becomes feature stacking.</text>
  <text x="40" y="426" fill="#475569" font-size="10">Source: Qian Xuesen, "Open Complex Giant Systems and Their Methodology"; platform mapping see §2 table.</text>
  <defs>
    <marker id="systd-ar-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker>
    <marker id="systd-ar2-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A78BFA"/></marker>
    <marker id="systd-ar3-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34D399"/></marker>
  </defs>
</svg>
