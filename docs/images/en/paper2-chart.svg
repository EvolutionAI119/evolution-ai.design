<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="418" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">1000+ test cases across three independent layers (measured 2026-10-25)</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Test Baseline</text>

  <rect x="24" y="56" width="600" height="330" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
  <text x="44" y="80" fill="#7DD3FC" font-size="12.5" font-weight="700">Cases per layer</text>
  <text x="604" y="80" fill="#64748B" font-size="9" text-anchor="end">pytest / pytest / vitest</text>

  <g stroke="#1E2A3A">
    <line x1="96" y1="82" x2="592" y2="82"/>
    <line x1="96" y1="110" x2="592" y2="110"/>
    <line x1="96" y1="165" x2="592" y2="165"/>
    <line x1="96" y1="220" x2="592" y2="220"/>
    <line x1="96" y1="275" x2="592" y2="275"/>
  </g>
  <line x1="96" y1="330" x2="592" y2="330" stroke="#475569"/>
  <line x1="96" y1="82" x2="96" y2="330" stroke="#475569"/>
  <g font-size="9" fill="#64748B" text-anchor="end">
    <text x="86" y="333">0</text><text x="86" y="278">100</text><text x="86" y="223">200</text><text x="86" y="168">300</text><text x="86" y="113">400</text><text x="86" y="85">450</text>
  </g>
  <text x="44" y="220" fill="#64748B" font-size="9.5" text-anchor="middle" transform="rotate(-90 44 220)">cases</text>

  <rect x="140" y="220" width="104" height="110" rx="4" fill="#38BDF8"/>
  <text x="192" y="211" fill="#E2E8F0" font-size="12" font-weight="700" text-anchor="middle">200</text>
  <text x="192" y="350" fill="#7DD3FC" font-size="10" text-anchor="middle">algorithm_model</text>
  <text x="192" y="366" fill="#64748B" font-size="9" text-anchor="middle">pytest · NURBS / quality / SOP</text>

  <rect x="300" y="104" width="104" height="226" rx="4" fill="#A78BFA"/>
  <text x="352" y="95" fill="#E2E8F0" font-size="12" font-weight="700" text-anchor="middle">411</text>
  <text x="352" y="350" fill="#C4B5FD" font-size="10" text-anchor="middle">backend</text>
  <text x="352" y="366" fill="#64748B" font-size="9" text-anchor="middle">collected · incl. 1 skip + 2 xfail</text>

  <rect x="460" y="101" width="104" height="229" rx="4" fill="#34D399"/>
  <text x="512" y="92" fill="#E2E8F0" font-size="12" font-weight="700" text-anchor="middle">416</text>
  <text x="512" y="350" fill="#6EE7B7" font-size="10" text-anchor="middle">frontend</text>
  <text x="512" y="366" fill="#64748B" font-size="9" text-anchor="middle">stores · components · guards</text>

  <text x="44" y="316" fill="#475569" font-size="9">Each layer runs on its own; any failure breaks the baseline.</text>

  <!-- 右：汇总 -->
  <rect x="648" y="56" width="288" height="330" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="666" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">Total</text>
  <text x="666" y="126" fill="#E2E8F0" font-size="34" font-weight="700">1027</text>
  <text x="760" y="124" fill="#94A3B8" font-size="10">cases</text>
  <text x="666" y="146" fill="#64748B" font-size="9">200 + 411 + 416 = 1027</text>

  <g font-size="9.5">
    <rect x="666" y="166" width="252" height="16" rx="3" fill="#0B101A" stroke="#1E2A3A"/>
    <rect x="666" y="166" width="49" height="16" rx="3" fill="#38BDF8"/>
    <text x="725" y="178" fill="#CBD5E1">200 · 19.5%</text>
    <rect x="666" y="188" width="252" height="16" rx="3" fill="#0B101A" stroke="#1E2A3A"/>
    <rect x="666" y="188" width="101" height="16" rx="3" fill="#A78BFA"/>
    <text x="777" y="200" fill="#CBD5E1">411 · 40.0%</text>
    <rect x="666" y="210" width="252" height="16" rx="3" fill="#0B101A" stroke="#1E2A3A"/>
    <rect x="666" y="210" width="102" height="16" rx="3" fill="#34D399"/>
    <text x="778" y="222" fill="#CBD5E1">416 · 40.5%</text>
  </g>

  <line x1="666" y1="242" x2="918" y2="242" stroke="#1E2A3A"/>
  <text x="666" y="262" fill="#FCD34D" font-size="9.5">Outside the total</text>
  <text x="666" y="280" fill="#94A3B8" font-size="9">algorithm self-check: 5 modules</text>
  <text x="666" y="296" fill="#64748B" font-size="9">one-command end-to-end gate</text>
  <text x="666" y="318" fill="#64748B" font-size="9">Not counted in the 1027 total.</text>
  <text x="666" y="340" fill="#475569" font-size="9">Suites were re-run after two</text>
  <text x="666" y="354" fill="#475569" font-size="9">fixture/contract fixes; all passed.</text>
  <text x="666" y="374" fill="#475569" font-size="9">The baseline is a regression gate.</text>

  <text x="24" y="404" fill="#94A3B8" font-size="10.5">How to read: bar heights are case counts on a 0–450 axis, not pass rates; the right panel converts them to shares of 1027. The 5-module self-check sits outside the sum.</text>
  <text x="24" y="418" fill="#475569" font-size="9">Source: §8.1 test-baseline table.</text>
</svg>
