<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Legend: symbols, lines and thresholds in this report</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Legend · Symbols, Lines, Thresholds</text>

  <!-- A Line semantics -->
  <rect x="40" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">A · Line semantics</text>
  <g font-size="10.5" fill="#94A3B8">
    <line x1="58" y1="105" x2="120" y2="105" stroke="#34D399" stroke-width="2"/>
    <text x="134" y="109">Measured / passing value (HUD = formula)</text>
    <line x1="58" y1="127" x2="120" y2="127" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="134" y="131">Design limit: peak 1.25 · latency 100 ms</text>
    <line x1="58" y1="149" x2="120" y2="149" stroke="#F87171" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="134" y="153">Degradation / out-of-bound: η→0 gives ×1.31</text>
    <line x1="58" y1="171" x2="120" y2="171" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
    <text x="134" y="175">Comfort limit: 45°/s (below motion threshold)</text>
    <line x1="58" y1="193" x2="120" y2="193" stroke="#A78BFA" stroke-width="2"/>
    <text x="134" y="197">Theoretical bound: 8.0× / 1.3145</text>
  </g>

  <!-- B Shapes -->
  <rect x="496" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">B · Shape semantics</text>
  <g font-size="10.5" fill="#94A3B8">
    <circle cx="602" cy="105" r="6" fill="#34D399"/>
    <text x="620" y="109">Measured point / per-type reading</text>
    <rect x="596" y="120" width="12" height="20" rx="2" fill="#0F241C" stroke="#34D399"/>
    <text x="620" y="134">Bar = six-type value (Fig. 6 / Fig. 8)</text>
    <circle cx="602" cy="158" r="7" fill="none" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="620" y="162">Ring = fan differential channel</text>
    <polygon points="602,175 610,191 594,191" fill="#2A1A0E" stroke="#FBBF24"/>
    <text x="620" y="190">Triangle = takeoff energy peak</text>
    <rect x="590" y="200" width="24" height="14" rx="3" fill="none" stroke="#64748B" stroke-dasharray="3 3"/>
    <text x="620" y="211">Dashed box = design envelope (±2° / ≥3×)</text>
  </g>

  <!-- C Verdict -->
  <rect x="40" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">C · Verdict semantics</text>
  <g font-size="10.5">
    <text x="58" y="292" fill="#34D399" font-size="12" font-weight="700">✓</text><text x="82" y="292" fill="#94A3B8">Pass with &gt; 10% margin (attitude, peak)</text>
    <text x="58" y="314" fill="#FBBF24" font-size="12" font-weight="700">⚠</text><text x="82" y="314" fill="#94A3B8">Pass with &lt; 10% margin (sport 5.7%)</text>
    <text x="58" y="336" fill="#F87171" font-size="12" font-weight="700">✕</text><text x="82" y="336" fill="#94A3B8">Fail / honest degradation (UI flips false)</text>
    <text x="58" y="358" fill="#A78BFA" font-size="12" font-weight="700">◆</text><text x="82" y="358" fill="#94A3B8">Theoretical reference, not a pass criterion</text>
    <text x="58" y="380" fill="#64748B" font-size="10">All five targets must pass to count as "all pass"</text>
  </g>

  <!-- D Thresholds -->
  <rect x="496" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">D · Key thresholds and bounds</text>
  <g font-size="10.5" fill="#94A3B8">
    <text x="514" y="288">Attitude ≤ ±2° (measured 0.728°–0.767°)</text>
    <text x="514" y="310">360° turn 15.0 s at 45°/s peak</text>
    <text x="514" y="332">Endurance ≥ 3× (measured 3.17×–3.83×)</text>
    <text x="514" y="354">Peak factor ≤ 1.25 (measured 1.14–1.17)</text>
    <text x="514" y="376">Latency ≤ 100 ms (measured 76–80 ms)</text>
    <text x="514" y="396">Field share s ≤ 0.75 · η ∈ [0, 0.3]</text>
  </g>

  <text x="40" y="428" fill="#94A3B8" font-size="10">Applies to Figures 1–10. Every threshold and value comes from this report's six-type envelope table; no external test baseline is used.</text>
  <text x="40" y="446" fill="#64748B" font-size="10">Fig. 9 is the hover panorama; Fig. 10 is this legend. Amber always means "passing with a slim margin".</text>
</svg>
