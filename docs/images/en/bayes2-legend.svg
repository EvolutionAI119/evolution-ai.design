<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="428" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#FBBF24"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Optimization legend: units · bounds · stages · thresholds</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Encoding Guide</text>

  <rect x="24" y="56" width="290" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="42" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">Colour = dimension unit</text>
  <rect x="42" y="94" width="14" height="14" rx="3" fill="#38BDF8"/><text x="64" y="106" fill="#CBD5E1" font-size="10.5">Length mm · 11 dims</text>
  <text x="64" y="121" fill="#64748B" font-size="9">length/width/height, wheelbase, track, clearance</text>
  <text x="64" y="135" fill="#64748B" font-size="9">hood, roof, wheel dia., front/rear overhang</text>
  <rect x="42" y="148" width="14" height="14" rx="3" fill="#FBBF24"/><text x="64" y="160" fill="#CBD5E1" font-size="10.5">Angle ° · 3 dims</text>
  <text x="64" y="175" fill="#64748B" font-size="9">windshield 18–50 · rear window 10–50</text>
  <text x="64" y="189" fill="#64748B" font-size="9">rear slant 5–55</text>

  <text x="42" y="214" fill="#94A3B8" font-size="9.5">Normalized: x_norm = (x − min) / (max − min) ∈ [0,1]</text>
  <line x1="42" y1="232" x2="296" y2="232" stroke="#1E2A3A"/>
  <text x="42" y="252" fill="#CBD5E1" font-size="9.5">Range bar example · overall_length</text>
  <line x1="52" y1="270" x2="286" y2="270" stroke="#38BDF8" stroke-width="7" stroke-opacity=".35"/>
  <line x1="52" y1="264" x2="52" y2="276" stroke="#38BDF8" stroke-width="1.4"/>
  <line x1="286" y1="264" x2="286" y2="276" stroke="#38BDF8" stroke-width="1.4"/>
  <text x="52" y="290" fill="#7DD3FC" font-size="9">4000</text>
  <text x="286" y="290" fill="#7DD3FC" font-size="9" text-anchor="end">6200</text>
  <circle cx="180" cy="270" r="4" fill="#F472B6"/>
  <text x="180" y="260" fill="#F472B6" font-size="9" text-anchor="middle">suggestions stay inside</text>
  <text x="42" y="316" fill="#64748B" font-size="9">All 14 dims are continuous; names must be unique.</text>
  <text x="42" y="336" fill="#475569" font-size="9">Out-of-bound values or max ≤ min → 400.</text>

  <rect x="336" y="56" width="290" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="354" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">Dot / line = loop stage</text>
  <g font-size="10">
    <circle cx="364" cy="102" r="5.5" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <text x="380" y="106" fill="#CBD5E1" font-size="9.5">cold-start random fill (obs &lt; 2)</text>
    <circle cx="364" cy="126" r="5.5" fill="#FBBF24"/>
    <text x="380" y="130" fill="#CBD5E1" font-size="9.5">evaluated sample (observe)</text>
    <circle cx="364" cy="150" r="5.5" fill="#34D399"/>
    <text x="380" y="154" fill="#CBD5E1" font-size="9.5">current best</text>
    <line x1="354" y1="176" x2="374" y2="176" stroke="#F472B6" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="380" y="180" fill="#CBD5E1" font-size="9.5">next EI pick</text>
    <line x1="354" y1="200" x2="374" y2="200" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 3"/>
    <text x="380" y="204" fill="#CBD5E1" font-size="9.5">UCB bound μ + κσ</text>
  </g>
  <line x1="354" y1="220" x2="608" y2="220" stroke="#1E2A3A"/>
  <text x="354" y="240" fill="#E2E8F0" font-size="11" font-weight="600">Line style = acquisition</text>
  <g font-size="10">
    <text x="354" y="260" fill="#F472B6">—— EI (default)</text>
    <text x="354" y="278" fill="#64748B" font-size="9">expected improvement: balanced</text>
    <text x="354" y="298" fill="#38BDF8">-- UCB</text>
    <text x="354" y="316" fill="#64748B" font-size="9">κ explicitly tunes exploration</text>
  </g>
  <text x="354" y="340" fill="#475569" font-size="9">minimize is negated internally to maximize.</text>

  <rect x="648" y="56" width="288" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="666" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">Number = hyperparameter / gate</text>
  <g font-size="10">
    <text x="666" y="104" fill="#CBD5E1">GP kernel</text>
    <text x="916" y="104" fill="#7DD3FC" text-anchor="end">RBF · ℓ = 0.25</text>
    <text x="666" y="126" fill="#CBD5E1">observation noise</text>
    <text x="916" y="126" fill="#7DD3FC" text-anchor="end">1e-6</text>
    <text x="666" y="148" fill="#CBD5E1">EI minimum improvement xi</text>
    <text x="916" y="148" fill="#F472B6" text-anchor="end">0.01</text>
    <text x="666" y="170" fill="#CBD5E1">UCB weight kappa</text>
    <text x="916" y="170" fill="#38BDF8" text-anchor="end">2.0</text>
    <text x="666" y="192" fill="#CBD5E1">cold-start observations</text>
    <text x="916" y="192" fill="#FBBF24" text-anchor="end">2</text>
    <text x="666" y="214" fill="#CBD5E1">candidate pool</text>
    <text x="916" y="214" fill="#94A3B8" text-anchor="end">4096 points</text>
  </g>
  <line x1="666" y1="230" x2="918" y2="230" stroke="#1E2A3A"/>
  <text x="666" y="250" fill="#CBD5E1" font-size="10">Convergence experiment (1-D -(x−0.7)²)</text>
  <text x="666" y="270" fill="#94A3B8" font-size="9.5">15 rounds · EI and UCB reach |regret| &lt; 0.01</text>
  <rect x="666" y="282" width="252" height="14" rx="3" fill="#1E2A3A"/>
  <rect x="666" y="282" width="126" height="14" rx="3" fill="#34D399" opacity=".7"/>
  <text x="666" y="312" fill="#64748B" font-size="9">round 1 → round 15; pale = not yet converged</text>
  <text x="666" y="332" fill="#475569" font-size="9">Thresholds are engineering conventions, not fitted.</text>

  <text x="24" y="382" fill="#64748B" font-size="10.5">How to use: colour tells millimetres from degrees; dot and line tell whether a sample is cold-start, observed or pending; the thresholds at right let you verify that an experiment really converged.</text>
  <text x="24" y="404" fill="#475569" font-size="10">Shared encoding with Fig. 1-1: amber = evaluated, green = current best, pink = EI pick, blue = UCB / bound.</text>
</svg>
