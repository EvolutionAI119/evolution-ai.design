<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34D399"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="378" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">API Request Lifecycle: 8 Steps from axios to Response</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Request Lifecycle</text>

  <!-- Top row 1-4 -->
  <g text-anchor="middle" font-size="11.5">
    <rect x="40" y="76" width="200" height="88" rx="10" fill="#12293D" stroke="#38BDF8" stroke-opacity=".4"/>
    <text x="140" y="102" fill="#7DD3FC" font-weight="700">① axios instance</text>
    <text x="140" y="122" fill="#94A3B8" font-size="10.5">baseURL=/api/v1 · 60s timeout</text>
    <text x="140" y="140" fill="#94A3B8" font-size="10.5">in-memory token into Authorization</text>

    <rect x="270" y="76" width="200" height="88" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="370" y="102" fill="#E2E8F0" font-weight="700">② CORS gateway</text>
    <text x="370" y="122" fill="#94A3B8" font-size="10.5">Origin allowlist match</text>
    <text x="370" y="140" fill="#94A3B8" font-size="10.5">ACAO*/ACAC bad combo fix</text>

    <rect x="500" y="76" width="200" height="88" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="600" y="102" fill="#E2E8F0" font-weight="700">③ Security headers</text>
    <text x="600" y="122" fill="#94A3B8" font-size="10.5">CSP / XFO / XCTO injected</text>
    <text x="600" y="140" fill="#94A3B8" font-size="10.5">server: uvicorn scrubbed</text>

    <rect x="730" y="76" width="200" height="88" rx="10" fill="#0F241C" stroke="#34D399" stroke-opacity=".5"/>
    <text x="830" y="102" fill="#6EE7B7" font-weight="700">④ Route matching</text>
    <text x="830" y="122" fill="#94A3B8" font-size="10.5">/api/v1/&lt;module&gt;/&lt;action&gt;</text>
    <text x="830" y="140" fill="#94A3B8" font-size="10.5">15 routers matched in order</text>
  </g>
  <line x1="242" y1="120" x2="266" y2="120" stroke="#34D399" stroke-width="2" marker-end="url(#ar10)"/>
  <line x1="472" y1="120" x2="496" y2="120" stroke="#34D399" stroke-width="2" marker-end="url(#ar10)"/>
  <line x1="702" y1="120" x2="726" y2="120" stroke="#34D399" stroke-width="2" marker-end="url(#ar10)"/>

  <!-- Bottom row 5-8 (right to left) -->
  <g text-anchor="middle" font-size="11.5">
    <rect x="730" y="210" width="200" height="88" rx="10" fill="#2A1A0E" stroke="#FBBF24" stroke-opacity=".5"/>
    <text x="830" y="236" fill="#FCD34D" font-weight="700">⑤ DI authentication</text>
    <text x="830" y="256" fill="#94A3B8" font-size="10.5">get_current_user parses JWT</text>
    <text x="830" y="274" fill="#94A3B8" font-size="10.5">require_roles role gate</text>

    <rect x="500" y="210" width="200" height="88" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="600" y="236" fill="#E2E8F0" font-weight="700">⑥ Pydantic validation</text>
    <text x="600" y="256" fill="#94A3B8" font-size="10.5">body/query type constraints</text>
    <text x="600" y="274" fill="#94A3B8" font-size="10.5">422 rejects bad input instantly</text>

    <rect x="270" y="210" width="200" height="88" rx="10" fill="#0F241C" stroke="#34D399" stroke-opacity=".5"/>
    <text x="370" y="236" fill="#6EE7B7" font-weight="700">⑦ Business logic</text>
    <text x="370" y="256" fill="#94A3B8" font-size="10.5">ORM read/write · algo calls</text>
    <text x="370" y="274" fill="#94A3B8" font-size="10.5">owner check / audit log</text>

    <rect x="40" y="210" width="200" height="88" rx="10" fill="#1A1230" stroke="#A78BFA" stroke-opacity=".5"/>
    <text x="140" y="236" fill="#C4B5FD" font-weight="700">⑧ Unified response</text>
    <text x="140" y="256" fill="#94A3B8" font-size="10.5">JSON + security headers + Vary: Origin</text>
    <text x="140" y="274" fill="#94A3B8" font-size="10.5">4xx/5xx with structured detail</text>
  </g>
  <line x1="830" y1="166" x2="830" y2="206" stroke="#34D399" stroke-width="2" marker-end="url(#ar10)"/>
  <line x1="726" y1="254" x2="704" y2="254" stroke="#34D399" stroke-width="2" marker-end="url(#ar10)"/>
  <line x1="496" y1="254" x2="474" y2="254" stroke="#34D399" stroke-width="2" marker-end="url(#ar10)"/>
  <line x1="266" y1="254" x2="244" y2="254" stroke="#34D399" stroke-width="2" marker-end="url(#ar10)"/>

  <!-- Error channel -->
  <path d="M830 300 L 830 330 L 140 330 L 140 302" fill="none" stroke="#F87171" stroke-width="1.6" stroke-dasharray="6 4"/>
  <defs><marker id="ar10r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F87171"/></marker></defs>
  <path d="M830 300 L 830 330 L 145 330" fill="none" stroke="#F87171" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar10r)"/>
  <text x="485" y="349" fill="#F87171" font-size="10.5" text-anchor="middle">Any step raising HTTPException / uncaught error → unified handler → 500 into backend-error.log → structured error returned</text>

  <text x="40" y="368" fill="none" font-size="1"> </text>
</svg>
