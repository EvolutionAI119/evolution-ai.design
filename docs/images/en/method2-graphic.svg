<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">One Parameter Space, Two Geometry Paths: Mesh vs NURBS</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Dual Geometry Paths</text>

  <!-- Left: fast path -->
  <rect x="40" y="66" width="424" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="90" fill="#38BDF8" font-size="12" font-weight="700">Fast path · parametric section mesh</text>
  <text x="58" y="106" fill="#64748B" font-size="9.5">Seconds to generate / concept exploration &amp; comparison</text>
  <!-- Sections and loft -->
  <g fill="none" stroke="#38BDF8" stroke-width="1.6">
    <path d="M96 322 Q118 272 96 222"/>
    <path d="M150 318 Q174 262 150 206"/>
    <path d="M204 314 Q228 254 204 196"/>
    <path d="M258 312 Q282 250 258 190"/>
    <path d="M312 312 Q336 250 312 188"/>
    <path d="M366 316 Q390 256 366 194"/>
    <path d="M420 322 Q444 264 420 202"/>
  </g>
  <g fill="none" stroke="#1E2A3A" stroke-width="1.1">
    <path d="M96 222 Q258 150 420 202"/>
    <path d="M96 252 Q258 190 420 232"/>
    <path d="M96 282 Q258 236 420 272"/>
    <path d="M96 322 Q258 286 420 322"/>
  </g>
  <text x="258" y="342" fill="#475569" font-size="9.5" text-anchor="middle">7 sections → loft → assessable mesh</text>

  <!-- Right: exact path -->
  <rect x="488" y="66" width="432" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="506" y="90" fill="#34D399" font-size="12" font-weight="700">Exact path · NURBS free-form surface</text>
  <text x="506" y="106" fill="#64748B" font-size="9.5">G2 fairing / continuity report / STEP delivery</text>
  <!-- Control polygon -->
  <g stroke="#64748B" stroke-width="1" stroke-dasharray="5 4" fill="none">
    <path d="M534 320 L604 210 L686 250 L764 186 L848 236 L888 320"/>
  </g>
  <g fill="#64748B">
    <circle cx="534" cy="320" r="3.5"/><circle cx="604" cy="210" r="3.5"/><circle cx="686" cy="250" r="3.5"/>
    <circle cx="764" cy="186" r="3.5"/><circle cx="848" cy="236" r="3.5"/><circle cx="888" cy="320" r="3.5"/>
  </g>
  <!-- NURBS curve -->
  <path d="M534 320 C590 220 640 216 686 250 C730 282 728 196 764 186 C806 174 842 218 888 320" fill="none" stroke="#34D399" stroke-width="2.4"/>
  <!-- Curvature comb -->
  <g stroke="#34D399" stroke-width="1" opacity=".8">
    <line x1="560" y1="268" x2="560" y2="252"/><line x1="600" y1="236" x2="600" y2="214"/>
    <line x1="640" y1="228" x2="640" y2="202"/><line x1="680" y1="244" x2="680" y2="216"/>
    <line x1="720" y1="258" x2="720" y2="228"/><line x1="760" y1="196" x2="760" y2="164"/>
    <line x1="800" y1="200" x2="800" y2="172"/><line x1="840" y1="234" x2="840" y2="212"/>
  </g>
  <text x="706" y="342" fill="#475569" font-size="9.5" text-anchor="middle">Control points → curvature → faired surface</text>

  <!-- Shared parameters -->
  <g>
    <rect x="366" y="382" width="252" height="34" rx="8" fill="#0F241C" stroke="#34D399"/>
    <text x="492" y="403" fill="#6EE7B7" font-size="10.5" font-weight="600" text-anchor="middle">Shared 22-dim CarParams</text>
    <path d="M366 399 L300 399" stroke="#34D399" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#method2g-ar-en)"/>
    <path d="M618 399 L684 399" stroke="#34D399" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#method2g-ar-en)"/>
    <text x="150" y="390" fill="#64748B" font-size="9.5" text-anchor="middle">Seen</text>
    <text x="760" y="390" fill="#64748B" font-size="9.5" text-anchor="middle">Delivered</text>
  </g>
  <text x="40" y="434" fill="#64748B" font-size="10.5">How to read: both sides consume one parameter vector — the left lofts sections into a mesh assessable in seconds, the right builds G2-faired NURBS from control points.</text>
  <text x="40" y="452" fill="#64748B" font-size="10.5">Different paths, same parameters — that is what "what you see is what you deliver" means.</text>
  <defs>
    <marker id="method2g-ar-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#34D399"/>
    </marker>
  </defs>
</svg>
