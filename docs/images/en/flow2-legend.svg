<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#FBBF24"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Legend: roles, lines, states and gates in the main-chain figures</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Integration Flow Legend</text>

  <rect x="40" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">A · Role and credential colors</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="58" y="95" width="26" height="13" rx="3" fill="#34D399"/><text x="96" y="106">JWT / Bearer Token</text>
    <rect x="58" y="117" width="26" height="13" rx="3" fill="#38BDF8"/><text x="96" y="128">Caller / frontend</text>
    <rect x="58" y="139" width="26" height="13" rx="3" fill="#FBBF24"/><text x="96" y="150">Training task / async polling</text>
    <rect x="58" y="161" width="26" height="13" rx="3" fill="#F472B6"/><text x="96" y="172">Human review / workflow</text>
    <rect x="58" y="183" width="26" height="13" rx="3" fill="#F87171"/><text x="96" y="194">Failure / rejection</text>
  </g>

  <rect x="496" y="58" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="84" fill="#E2E8F0" font-size="12.5" font-weight="700">B · Line types</text>
  <g font-size="10.5" fill="#94A3B8">
    <line x1="514" y1="105" x2="574" y2="105" stroke="#34D399" stroke-width="2"/>
    <text x="590" y="109">Synchronous request (HTTP call)</text>
    <line x1="514" y1="127" x2="574" y2="127" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="590" y="131">Auto trigger / polling</text>
    <line x1="514" y1="149" x2="574" y2="149" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
    <text x="590" y="153">Polling / optional path</text>
    <line x1="514" y1="171" x2="574" y2="171" stroke="#F87171" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="590" y="175">Rejection / error fallback</text>
    <text x="514" y="194">①→② = step order (reading order)</text>
  </g>

  <rect x="40" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="58" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">C · State colors</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="58" y="278" width="58" height="16" rx="3" fill="#2A1A0E" stroke="#FBBF24"/><text x="87" y="290" fill="#FCD34D" font-size="9" text-anchor="middle">pending</text>
    <text x="130" y="290">Waiting for review / not started</text>
    <rect x="58" y="300" width="58" height="16" rx="3" fill="#12293D" stroke="#38BDF8"/><text x="87" y="312" fill="#7DD3FC" font-size="9" text-anchor="middle">running</text>
    <text x="130" y="312">In progress / partly approved</text>
    <rect x="58" y="322" width="58" height="16" rx="3" fill="#0F241C" stroke="#34D399"/><text x="87" y="334" fill="#6EE7B7" font-size="9" text-anchor="middle">completed</text>
    <text x="130" y="334">Done / deliverable</text>
    <rect x="58" y="344" width="58" height="16" rx="3" fill="#2A1420" stroke="#F87171"/><text x="87" y="356" fill="#F87171" font-size="9" text-anchor="middle">failed</text>
    <text x="130" y="356">Failed / terminal workflow state</text>
    <text x="58" y="382" fill="#64748B" font-size="9.5">A step-level rejected rolls up to failed; retrain or open a new flow</text>
  </g>

  <rect x="496" y="238" width="424" height="168" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="514" y="264" fill="#E2E8F0" font-size="12.5" font-weight="700">D · Gates and verdict markers</text>
  <g font-size="10.5" fill="#94A3B8">
    <text x="514" y="292" font-size="12">🔐</text><text x="552" y="292">Auth gate: no valid JWT → 401</text>
    <text x="514" y="314" font-size="12">👑</text><text x="552" y="314">Admin gate: superadmin only</text>
    <text x="514" y="336" font-size="12">🔹</text><text x="552" y="336">Optional auth: link user when JWT exists</text>
    <text x="514" y="360" fill="#34D399" font-size="13">✓</text><text x="552" y="360">Approved: status and reviewer persisted</text>
    <text x="514" y="382" fill="#F87171" font-size="13">✕</text><text x="552" y="382">Rejected: cannot be bypassed or delegated</text>
  </g>

  <text x="40" y="430" fill="#94A3B8" font-size="10">How to read: Fig. 5-1; the token travels only in Authorization: Bearer; all numbers are measured endpoint or scenario counts.</text>
  <text x="40" y="448" fill="#64748B" font-size="10">Color encodes semantics, never quantity; quantities are read from bar length, cell numbers and column totals.</text>
</svg>
