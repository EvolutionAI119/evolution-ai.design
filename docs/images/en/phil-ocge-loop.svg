<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34D399"/>
    </marker>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34D399" stop-opacity=".22"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="958" height="468" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Philosophy: Observe · Constrain · Generate · Evolve (OCGE)</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Design Cognition Loop</text>

  <circle cx="470" cy="262" r="128" fill="url(#core)"/>
  <circle cx="470" cy="262" r="118" fill="none" stroke="#1E2A3A" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- Center -->
  <text x="470" y="252" fill="#34D399" font-size="17" font-weight="700" text-anchor="middle">Design Cognition Loop</text>
  <text x="470" y="276" fill="#94A3B8" font-size="11.5" text-anchor="middle">Each iteration produces</text>
  <text x="470" y="293" fill="#94A3B8" font-size="11.5" text-anchor="middle">a better valid design</text>

  <!-- Four nodes on the ring (clockwise) -->
  <!-- Observe: top -->
  <g>
    <rect x="390" y="86" width="160" height="74" rx="12" fill="#0E1E2E" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="470" y="114" fill="#38BDF8" font-size="15" font-weight="700" text-anchor="middle">① Observe</text>
    <text x="470" y="136" fill="#94A3B8" font-size="11" text-anchor="middle">Trend / brand / eng. / user</text>
    <text x="470" y="151" fill="#94A3B8" font-size="11" text-anchor="middle">Multi-source input into view</text>
  </g>
  <!-- Constrain: right -->
  <g>
    <rect x="620" y="222" width="170" height="80" rx="12" fill="#2A1A0E" stroke="#FBBF24" stroke-width="1.4"/>
    <text x="705" y="250" fill="#FBBF24" font-size="15" font-weight="700" text-anchor="middle">② Constrain</text>
    <text x="705" y="272" fill="#94A3B8" font-size="11" text-anchor="middle">Hardpoints / regs / proportion / mfg</text>
    <text x="705" y="287" fill="#94A3B8" font-size="11" text-anchor="middle">Distill insight into computable bounds</text>
  </g>
  <!-- Generate: bottom -->
  <g>
    <rect x="390" y="360" width="160" height="74" rx="12" fill="#0F241C" stroke="#34D399" stroke-width="1.4"/>
    <text x="470" y="388" fill="#34D399" font-size="15" font-weight="700" text-anchor="middle">③ Generate</text>
    <text x="470" y="410" fill="#94A3B8" font-size="11" text-anchor="middle">NURBS surfaces / variants</text>
    <text x="470" y="425" fill="#94A3B8" font-size="11" text-anchor="middle">Batch candidates within bounds</text>
  </g>
  <!-- Evolve: left -->
  <g>
    <rect x="150" y="222" width="170" height="80" rx="12" fill="#1A1230" stroke="#A78BFA" stroke-width="1.4"/>
    <text x="235" y="250" fill="#A78BFA" font-size="15" font-weight="700" text-anchor="middle">④ Evolve</text>
    <text x="235" y="272" fill="#94A3B8" font-size="11" text-anchor="middle">Quality eval / Bayes selection</text>
    <text x="235" y="287" fill="#94A3B8" font-size="11" text-anchor="middle">Feeds next Observe &amp; Constrain</text>
  </g>

  <!-- Clockwise arc arrows -->
  <path d="M556 128 A 128 128 0 0 1 636 214" fill="none" stroke="#34D399" stroke-width="2.2" marker-end="url(#ar3)" opacity=".85"/>
  <path d="M660 312 A 128 128 0 0 1 560 384" fill="none" stroke="#34D399" stroke-width="2.2" marker-end="url(#ar3)" opacity=".85"/>
  <path d="M382 386 A 128 128 0 0 1 284 314" fill="none" stroke="#34D399" stroke-width="2.2" marker-end="url(#ar3)" opacity=".85"/>
  <path d="M278 216 A 128 128 0 0 1 380 122" fill="none" stroke="#34D399" stroke-width="2.2" marker-end="url(#ar3)" opacity=".85"/>

  <!-- Right: platform mapping -->
  <g>
    <rect x="810" y="86" width="126" height="348" rx="12" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="873" y="112" fill="#E2E8F0" font-size="12.5" font-weight="700" text-anchor="middle">Platform mapping</text>
    <g font-size="11" fill="#94A3B8">
      <rect x="822" y="126" width="102" height="56" rx="8" fill="#0E1E2E"/><text x="873" y="148" fill="#7DD3FC" text-anchor="middle">Brand KB</text><text x="873" y="164" fill="#64748B" text-anchor="middle">19 vehicle metrics</text>
      <rect x="822" y="196" width="102" height="56" rx="8" fill="#2A1A0E"/><text x="873" y="218" fill="#FCD34D" text-anchor="middle">Param validator</text><text x="873" y="234" fill="#64748B" text-anchor="middle">regs / proportion</text>
      <rect x="822" y="266" width="102" height="56" rx="8" fill="#0F241C"/><text x="873" y="288" fill="#6EE7B7" text-anchor="middle">Gen pipeline</text><text x="873" y="304" fill="#64748B" text-anchor="middle">NURBS algo layer</text>
      <rect x="822" y="336" width="102" height="56" rx="8" fill="#1A1230"/><text x="873" y="358" fill="#C4B5FD" text-anchor="middle">Bayes engine</text><text x="873" y="374" fill="#64748B" text-anchor="middle">score → suggest</text>
    </g>
  </g>

  <text x="40" y="452" fill="#64748B" font-size="11.5">How to read: not a pipeline but a cognition loop — Evolve's quality insight redefines the next Observe &amp; Constrain, converging toward better designs.</text>
</svg>
