<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Quality gate panorama: three test layers into one self-check</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Quality Gate Panorama · 489 / 489</text>

  <text x="40" y="56" fill="#94A3B8" font-size="10.5">2026-09-27 · Windows + Python 3.11 · SQLite, zero external deps</text>
  <text x="920" y="56" fill="#64748B" font-size="10.5" text-anchor="end">489 = 200 + 178 + 111</text>

  <!-- Three test lanes -->
  <g>
    <rect x="60" y="86" width="360" height="48" rx="9" fill="#131C2A" stroke="#1E2A3A"/>
    <rect x="60" y="86" width="5" height="48" rx="2" fill="#34D399"/>
    <text x="80" y="107" fill="#E2E8F0" font-size="12" font-weight="700">Algorithm · pytest</text>
    <text x="80" y="124" fill="#64748B" font-size="10">NURBS math / sweep and fillet / constructor / quality</text>
    <text x="400" y="115" fill="#6EE7B7" font-size="14" font-weight="700" text-anchor="end">200 · 3.87 s</text>
  </g>
  <g>
    <rect x="60" y="146" width="360" height="48" rx="9" fill="#131C2A" stroke="#1E2A3A"/>
    <rect x="60" y="146" width="5" height="48" rx="2" fill="#38BDF8"/>
    <text x="80" y="167" fill="#E2E8F0" font-size="12" font-weight="700">Backend · pytest</text>
    <text x="80" y="184" fill="#64748B" font-size="10">Routes / schemas / optimization / security / persistence</text>
    <text x="400" y="175" fill="#7DD3FC" font-size="14" font-weight="700" text-anchor="end">178 · 28.30 s</text>
  </g>
  <g>
    <rect x="60" y="206" width="360" height="48" rx="9" fill="#131C2A" stroke="#1E2A3A"/>
    <rect x="60" y="206" width="5" height="48" rx="2" fill="#A78BFA"/>
    <text x="80" y="227" fill="#E2E8F0" font-size="12" font-weight="700">Frontend · vitest</text>
    <text x="80" y="244" fill="#64748B" font-size="10">Stores / components / API modules / router guards</text>
    <text x="400" y="235" fill="#C4B5FD" font-size="14" font-weight="700" text-anchor="end">111 · 1.25 s</text>
  </g>

  <!-- Merge arrows -->
  <g stroke="#34D399" stroke-width="1.6" fill="none">
    <line x1="424" y1="110" x2="538" y2="110"/>
    <line x1="424" y1="170" x2="538" y2="170"/>
    <line x1="424" y1="230" x2="538" y2="230"/>
  </g>
  <g fill="#34D399">
    <polygon points="546,110 536,106 536,114"/>
    <polygon points="546,170 536,166 536,174"/>
    <polygon points="546,230 536,226 536,234"/>
  </g>

  <!-- Self-check gate -->
  <rect x="552" y="80" width="328" height="200" rx="12" fill="#0F241C" stroke="#34D399"/>
  <text x="572" y="106" fill="#6EE7B7" font-size="13" font-weight="700">One-stop self-check · gate</text>
  <text x="572" y="126" fill="#94A3B8" font-size="10.5">test_all.py · 5 modules run in series</text>
  <text x="572" y="170" fill="#E2E8F0" font-size="30" font-weight="700">7.13 s</text>
  <text x="572" y="192" fill="#94A3B8" font-size="10.5">5 / 5 modules pass · 0 exceptions</text>
  <text x="572" y="222" fill="#94A3B8" font-size="10.5">Body model 176 vertices / 316 faces</text>
  <text x="572" y="240" fill="#94A3B8" font-size="10.5">Grade C surface · 80-step anneal · storyboard</text>
  <text x="572" y="258" fill="#94A3B8" font-size="10.5">Bayes 15 rounds · full pipeline runs</text>
  <circle cx="836" cy="126" r="20" fill="none" stroke="#34D399" stroke-width="2"/>
  <path d="M826 126 L833 134 L847 118" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Result badges -->
  <g>
    <rect x="60" y="300" width="270" height="58" rx="10" fill="#0F241C" stroke="#34D399"/>
    <text x="76" y="326" fill="#6EE7B7" font-size="17" font-weight="700">489 / 489</text>
    <text x="76" y="346" fill="#94A3B8" font-size="10">All three layers green (200 + 178 + 111)</text>
    <rect x="350" y="300" width="270" height="58" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="366" y="326" fill="#E2E8F0" font-size="17" font-weight="700">0 / 0</text>
    <text x="366" y="346" fill="#94A3B8" font-size="10">Failures / skips; 9 known warnings (6+3)</text>
    <rect x="640" y="300" width="270" height="58" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="656" y="326" fill="#C4B5FD" font-size="17" font-weight="700">9 / 9</text>
    <text x="656" y="346" fill="#94A3B8" font-size="10">Fact baseline consistent; 118 endpoints</text>
  </g>

  <text x="40" y="398" fill="#94A3B8" font-size="10">How to read: three independent case streams converge on the test_all.py gate, which releases only an all-green batch; the badges are the receipts.</text>
  <text x="40" y="418" fill="#64748B" font-size="10">Scope note: every number is the 2026-09-27 same-day run snapshot; no later-version test baseline is mixed in.</text>
  <text x="40" y="438" fill="#64748B" font-size="10">The self-check also covers warning paths and out-of-range parameter capture, all known and non-blocking.</text>
</svg>
