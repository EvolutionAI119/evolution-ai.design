<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Volume → Treatment → Graphic: Three Layers</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Layered Semantics</text>

  <g>
    <path d="M60 340 L60 296 Q63 268 96 258 L142 248 Q184 210 246 204 L336 204 Q392 206 424 238 L452 256 Q470 266 470 288 L470 340 Z" fill="#A78BFA" opacity=".09"/>
    <path d="M60 340 L60 296 Q63 268 96 258 L142 248 Q184 210 246 204 L336 204 Q392 206 424 238 L452 256 Q470 266 470 288 L470 340 Z" fill="none" stroke="#A78BFA" stroke-width="1.8"/>
    <line x1="60" y1="204" x2="470" y2="204" stroke="#A78BFA" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
    <line x1="246" y1="204" x2="246" y2="340" stroke="#A78BFA" stroke-width="1" stroke-dasharray="4 4" opacity=".45"/>
    <path d="M96 282 Q230 258 444 274" fill="none" stroke="#38BDF8" stroke-width="2.2"/>
    <g stroke="#38BDF8" stroke-width="1" opacity=".85">
      <line x1="160" y1="274" x2="160" y2="262"/><line x1="200" y1="270" x2="200" y2="254"/>
      <line x1="240" y1="266" x2="240" y2="248"/><line x1="280" y1="264" x2="280" y2="246"/>
      <line x1="320" y1="264" x2="320" y2="248"/><line x1="360" y1="266" x2="360" y2="252"/>
      <line x1="400" y1="270" x2="400" y2="260"/>
    </g>
    <rect x="424" y="286" width="34" height="12" rx="4" fill="#34D399" opacity=".85"/>
    <rect x="418" y="304" width="42" height="14" rx="3" fill="none" stroke="#34D399" stroke-width="1.4"/>
    <g stroke="#64748B" stroke-width="1" stroke-dasharray="4 4" fill="none">
      <path d="M142 248 L246 204 L336 204 L424 238"/>
    </g>
    <g fill="#64748B">
      <circle cx="142" cy="248" r="3"/><circle cx="246" cy="204" r="3"/><circle cx="336" cy="204" r="3"/><circle cx="424" cy="238" r="3"/>
    </g>
    <circle cx="132" cy="340" r="32" fill="#0F1622" stroke="#334155" stroke-width="1.5"/>
    <circle cx="132" cy="340" r="13" fill="#131C2A" stroke="#475569"/>
    <circle cx="400" cy="340" r="32" fill="#0F1622" stroke="#334155" stroke-width="1.5"/>
    <circle cx="400" cy="340" r="13" fill="#131C2A" stroke="#475569"/>
  </g>

  <g font-size="10">
    <rect x="52" y="96" width="10" height="10" rx="2" fill="#A78BFA"/><text x="68" y="105" fill="#CBD5E1">Volume: envelope &amp; posture</text>
    <rect x="218" y="96" width="10" height="10" rx="2" fill="#38BDF8"/><text x="234" y="105" fill="#CBD5E1">Treatment: lines &amp; curvature</text>
    <rect x="400" y="96" width="10" height="10" rx="2" fill="#34D399"/><text x="416" y="105" fill="#CBD5E1">Graphic: lamps/grille</text>
  </g>
  <text x="60" y="392" fill="#94A3B8" font-size="10">Proportion reference (example): wheelbase 2900 · height 1450 · height/base ≈ 0.50 · overhang ratio ≈ 0.88</text>
  <text x="60" y="410" fill="#64748B" font-size="10">Order matters: volume envelope → surface treatment → graphic elements. Reverse it and the style drifts.</text>

  <g>
    <text x="620" y="86" fill="#E2E8F0" font-size="12.5" font-weight="700">Semantics descend layer by layer</text>
    <path d="M620 100 L730 100 L782 128 L672 128 Z" fill="#A78BFA" opacity=".16" stroke="#A78BFA"/>
    <text x="636" y="120" fill="#C4B5FD" font-size="11" font-weight="600">Volume</text>
    <text x="760" y="118" fill="#94A3B8" font-size="9">proportion · abstract</text>

    <path d="M632 140 L742 140 L794 168 L684 168 Z" fill="#38BDF8" opacity=".14" stroke="#38BDF8"/>
    <text x="648" y="160" fill="#7DD3FC" font-size="11" font-weight="600">Treatment</text>
    <text x="772" y="158" fill="#94A3B8" font-size="9">gesture · indexical</text>

    <path d="M644 180 L754 180 L806 208 L696 208 Z" fill="#34D399" opacity=".14" stroke="#34D399"/>
    <text x="660" y="200" fill="#6EE7B7" font-size="11" font-weight="600">Graphic</text>
    <text x="784" y="198" fill="#94A3B8" font-size="9">icons · symbolic</text>

    <path d="M700 224 L700 262" stroke="#64748B" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="620" y="284" fill="#64748B" font-size="9.5">Upper layers govern lower ones: a wrong volume cannot be</text>
    <text x="620" y="298" fill="#64748B" font-size="9.5">rescued by finer surfaces. Lower layers feed back as memory.</text>

    <rect x="620" y="318" width="300" height="74" rx="9" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="636" y="338" fill="#94A3B8" font-size="10">Three readings of one body</text>
    <text x="636" y="354" fill="#64748B" font-size="9.5">Lay users read volume, experts read treatment,</text>
    <text x="636" y="370" fill="#64748B" font-size="9.5">owners remember graphic. All three must agree.</text>
  </g>
  <text x="40" y="440" fill="#64748B" font-size="11">How to read: the left drawing overlays three representations of one side profile — translucent envelope (volume), blue curve plus comb (treatment), green details (graphic); the right stack turns them into a semantic ladder read in modelling order.</text>
</svg>
