<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">G0 / G1 / G2: Curvature Combs and Continuity</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Continuity Orders</text>

  <rect x="40" y="56" width="280" height="330" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="56" y="78" fill="#F87171" font-size="12.5" font-weight="700">G0 · position only</text>
  <text x="56" y="95" fill="#64748B" font-size="9.5">positions meet / tangent breaks</text>
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4">
    <path d="M60 300 L110 250 L180 198" fill="none"/>
    <path d="M180 198 L250 222 L295 298" fill="none"/>
  </g>
  <path d="M60 300 Q110 250 180 198" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M180 198 Q250 222 295 298" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <g stroke="#F87171" stroke-width="1.1">
    <line x1="60" y1="300" x2="60" y2="292"/><line x1="86" y1="275" x2="86" y2="261"/><line x1="115" y1="250" x2="115" y2="230"/><line x1="146" y1="224" x2="146" y2="196"/><line x1="180" y1="198" x2="180" y2="166"/>
    <line x1="213" y1="185" x2="213" y2="177"/><line x1="244" y1="198" x2="244" y2="188"/><line x1="271" y1="236" x2="271" y2="228"/><line x1="295" y1="298" x2="295" y2="290"/>
  </g>
  <circle cx="180" cy="198" r="5" fill="#0F1622" stroke="#F87171" stroke-width="2"/>
  <text x="180" y="334" fill="#F87171" font-size="11" font-weight="600" text-anchor="middle">comb snaps at the joint</text>
  <text x="180" y="352" fill="#64748B" font-size="10" text-anchor="middle">reflection line kinks</text>
  <text x="180" y="372" fill="#94A3B8" font-size="10" text-anchor="middle">only guarantees contact</text>

  <rect x="340" y="56" width="280" height="330" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="356" y="78" fill="#FBBF24" font-size="12.5" font-weight="700">G1 · tangent continuous</text>
  <text x="356" y="95" fill="#64748B" font-size="9.5">same tangent / curvature jumps</text>
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4">
    <path d="M360 300 L410 250 L480 198" fill="none"/>
    <path d="M480 198 L550 146 L595 298" fill="none"/>
  </g>
  <path d="M360 300 Q410 250 480 198" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M480 198 Q554 146 595 298" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <g stroke="#FBBF24" stroke-width="1.1">
    <line x1="360" y1="300" x2="360" y2="292"/><line x1="386" y1="275" x2="386" y2="261"/><line x1="415" y1="250" x2="415" y2="230"/><line x1="446" y1="224" x2="446" y2="196"/><line x1="480" y1="198" x2="480" y2="166"/>
    <line x1="511" y1="185" x2="511" y2="177"/><line x1="541" y1="199" x2="541" y2="181"/><line x1="570" y1="238" x2="570" y2="222"/><line x1="595" y1="298" x2="595" y2="288"/>
  </g>
  <circle cx="480" cy="198" r="5" fill="#0F1622" stroke="#FBBF24" stroke-width="2"/>
  <text x="480" y="334" fill="#FBBF24" font-size="11" font-weight="600" text-anchor="middle">comb length jumps</text>
  <text x="480" y="352" fill="#64748B" font-size="10" text-anchor="middle">highlight creases</text>
  <text x="480" y="372" fill="#94A3B8" font-size="10" text-anchor="middle">guarantees the flow</text>

  <rect x="640" y="56" width="280" height="330" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="656" y="78" fill="#34D399" font-size="12.5" font-weight="700">G2 · curvature continuous</text>
  <text x="656" y="95" fill="#64748B" font-size="9.5">curvature blends / comb smooth</text>
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4">
    <path d="M660 300 L710 250 L780 198" fill="none"/>
    <path d="M780 198 L850 146 L860 210 L895 298" fill="none"/>
  </g>
  <path d="M660 300 Q710 250 780 198" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M780 198 C850 146 860 210 895 298" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <g stroke="#34D399" stroke-width="1.1">
    <line x1="660" y1="300" x2="660" y2="292"/><line x1="686" y1="275" x2="686" y2="261"/><line x1="715" y1="250" x2="715" y2="230"/><line x1="746" y1="224" x2="746" y2="196"/><line x1="780" y1="198" x2="780" y2="166"/>
    <line x1="823" y1="179" x2="823" y2="149"/><line x1="851" y1="195" x2="851" y2="169"/><line x1="872" y1="238" x2="872" y2="218"/><line x1="895" y1="298" x2="895" y2="288"/>
  </g>
  <circle cx="780" cy="198" r="5" fill="#0F1622" stroke="#34D399" stroke-width="2"/>
  <text x="780" y="334" fill="#34D399" font-size="11" font-weight="600" text-anchor="middle">comb crosses smoothly</text>
  <text x="780" y="352" fill="#64748B" font-size="10" text-anchor="middle">reflection line unbroken</text>
  <text x="780" y="372" fill="#94A3B8" font-size="10" text-anchor="middle">minimum for Class-A surfaces</text>

  <text x="40" y="410" fill="#64748B" font-size="11.5">How to read: the short vertical teeth are curvature combs; longer teeth mean higher curvature. Whether the comb is continuous across the joint is the geometric test for G0/G1/G2.</text>
  <text x="40" y="432" fill="#475569" font-size="10">Dashed lines are control polygons: moving a control point reshapes the curvature distribution, so the parameter-to-surface mapping stays explainable.</text>
</svg>
