<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="paper2-wb-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="418" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#38BDF8"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Inside the design workbench: from sliders to an engineering model</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Design-to-Engineering Scene</text>

  <!-- 左：参数滑杆 -->
  <rect x="24" y="56" width="270" height="320" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="42" y="80" fill="#7DD3FC" font-size="12.5" font-weight="700">① Parameter panel</text>
  <text x="42" y="98" fill="#64748B" font-size="9.5">22 fields, every value bounded</text>

  <g font-size="9.5">
    <text x="42" y="126" fill="#CBD5E1">overall_length</text>
    <text x="276" y="126" fill="#FCD34D" text-anchor="end">4 000 – 6 200</text>
    <line x1="42" y1="138" x2="276" y2="138" stroke="#1E2A3A" stroke-width="4"/>
    <line x1="42" y1="138" x2="172" y2="138" stroke="#38BDF8" stroke-width="4"/>
    <circle cx="172" cy="138" r="6" fill="#E2E8F0" stroke="#38BDF8" stroke-width="2"/>

    <text x="42" y="174" fill="#CBD5E1">wheel_base</text>
    <text x="276" y="174" fill="#FCD34D" text-anchor="end">2 400 – 3 700</text>
    <line x1="42" y1="186" x2="276" y2="186" stroke="#1E2A3A" stroke-width="4"/>
    <line x1="42" y1="186" x2="184" y2="186" stroke="#34D399" stroke-width="4"/>
    <circle cx="184" cy="186" r="6" fill="#E2E8F0" stroke="#34D399" stroke-width="2"/>

    <text x="42" y="222" fill="#CBD5E1">windshield_angle</text>
    <text x="276" y="222" fill="#FCD34D" text-anchor="end">18° – 50°</text>
    <line x1="42" y1="234" x2="276" y2="234" stroke="#1E2A3A" stroke-width="4"/>
    <line x1="42" y1="234" x2="132" y2="234" stroke="#FBBF24" stroke-width="4"/>
    <circle cx="132" cy="234" r="6" fill="#E2E8F0" stroke="#FBBF24" stroke-width="2"/>

    <text x="42" y="270" fill="#CBD5E1">ground_clearance</text>
    <text x="276" y="270" fill="#FCD34D" text-anchor="end">80 – 280</text>
    <line x1="42" y1="282" x2="276" y2="282" stroke="#1E2A3A" stroke-width="4"/>
    <line x1="42" y1="282" x2="120" y2="282" stroke="#A78BFA" stroke-width="4"/>
    <circle cx="120" cy="282" r="6" fill="#E2E8F0" stroke="#A78BFA" stroke-width="2"/>
  </g>
  <text x="42" y="318" fill="#64748B" font-size="9">Drag any slider: the same vector re-seats</text>
  <text x="42" y="334" fill="#64748B" font-size="9">control points — nothing is baked.</text>
  <rect x="42" y="348" width="234" height="14" rx="3" fill="#0E1E2E" stroke="#1E2A3A"/>
  <text x="50" y="359" fill="#7DD3FC" font-size="9">22-field CarParams · continuous</text>

  <line x1="296" y1="206" x2="314" y2="206" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#paper2-wb-ar)"/>
  <line x1="622" y1="206" x2="640" y2="206" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#paper2-wb-ar)"/>

  <!-- 中：视口 -->
  <rect x="318" y="56" width="300" height="320" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
  <text x="336" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">② Viewport</text>
  <text x="600" y="80" fill="#64748B" font-size="9" text-anchor="end">real-time mesh</text>
  <g stroke="#16202E">
    <line x1="336" y1="120" x2="600" y2="120"/><line x1="336" y1="160" x2="600" y2="160"/>
    <line x1="336" y1="200" x2="600" y2="200"/><line x1="336" y1="240" x2="600" y2="240"/>
    <line x1="380" y1="100" x2="380" y2="300"/><line x1="450" y1="100" x2="450" y2="300"/>
    <line x1="520" y1="100" x2="520" y2="300"/>
  </g>
  <path d="M348 268 L348 240 Q348 232 358 231 L400 228 L422 204 Q427 200 434 200 L488 200 Q495 200 500 206 L520 228 L550 231 Q560 233 560 242 L560 268 Z"
        fill="#0F241C" stroke="#34D399" stroke-width="1.8"/>
  <path d="M430 208 L486 208 L506 228 L438 228 Z" fill="#0F1622" stroke="#38BDF8" stroke-opacity=".55"/>
  <circle cx="386" cy="268" r="18" fill="#0B101A" stroke="#E2E8F0" stroke-width="1.8"/>
  <circle cx="386" cy="268" r="9" fill="none" stroke="#94A3B8"/>
  <circle cx="524" cy="268" r="18" fill="#0B101A" stroke="#E2E8F0" stroke-width="1.8"/>
  <circle cx="524" cy="268" r="9" fill="none" stroke="#94A3B8"/>
  <line x1="340" y1="286" x2="590" y2="286" stroke="#475569" stroke-dasharray="5 4"/>

  <g font-size="9">
    <rect x="336" y="300" width="120" height="18" rx="4" fill="#131C2A" stroke="#1E2A3A"/>
    <text x="344" y="313" fill="#94A3B8">22 fields</text>
    <rect x="464" y="300" width="136" height="18" rx="4" fill="#131C2A" stroke="#1E2A3A"/>
    <text x="472" y="313" fill="#94A3B8">G2 boundaries</text>
    <text x="336" y="340" fill="#64748B">One vector, four synchronized outputs:</text>
    <text x="336" y="356" fill="#94A3B8">mesh · NURBS · quality · STEP</text>
  </g>

  <!-- 右：交付卡 -->
  <rect x="644" y="56" width="292" height="320" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="662" y="80" fill="#F9A8D4" font-size="12.5" font-weight="700">③ Quality &amp; hand-off</text>
  <g font-size="9.5">
    <rect x="662" y="94" width="256" height="34" rx="6" fill="#0F241C" stroke="#34D399" stroke-opacity=".35"/>
    <text x="674" y="108" fill="#6EE7B7">G0 position · threshold 0.1 mm</text>
    <text x="674" y="121" fill="#64748B" font-size="8.5">seam gap reported per pair</text>

    <rect x="662" y="134" width="256" height="34" rx="6" fill="#0E1E2E" stroke="#38BDF8" stroke-opacity=".35"/>
    <text x="674" y="148" fill="#7DD3FC">G1 tangent · threshold 1.0°</text>
    <text x="674" y="161" fill="#64748B" font-size="8.5">angle deviation into TXT / CSV</text>

    <rect x="662" y="174" width="256" height="34" rx="6" fill="#2A1A0E" stroke="#FBBF24" stroke-opacity=".35"/>
    <text x="674" y="188" fill="#FCD34D">G2 curvature · 5° visual band</text>
    <text x="674" y="201" fill="#64748B" font-size="8.5">raw geometry is graded, not assumed</text>

    <rect x="662" y="218" width="256" height="40" rx="6" fill="#1A1230" stroke="#A78BFA" stroke-opacity=".35"/>
    <text x="674" y="235" fill="#C4B5FD">STEP · ISO 10303-21</text>
    <text x="674" y="249" fill="#64748B" font-size="8.5">written without a heavy CAD kernel</text>
  </g>
  <line x1="662" y1="272" x2="918" y2="272" stroke="#1E2A3A"/>
  <text x="662" y="292" fill="#94A3B8" font-size="9.5">Designer edits stay interpretable;</text>
  <text x="662" y="308" fill="#64748B" font-size="9">engineers receive the same numbers</text>
  <text x="662" y="324" fill="#64748B" font-size="9">plus seam-by-seam evidence.</text>
  <text x="662" y="346" fill="#475569" font-size="8.5">No mesh-to-NURBS fitting step.</text>
  <text x="662" y="360" fill="#475569" font-size="8.5">No opaque single quality score.</text>

  <text x="24" y="400" fill="#94A3B8" font-size="10.5">How to read: sliders are the only input; the viewport is one consumer, the right column is the engineering contract — all outputs are graded from the same 22-field vector.</text>
  <text x="24" y="414" fill="#475569" font-size="9.5">Scene is illustrative; ranges and thresholds are the values used by the pipeline.</text>
</svg>
