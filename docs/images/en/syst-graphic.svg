<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="systg-env-en" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".22"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity=".06"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#F472B6"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Fast Variables and Order Parameters: Two Time Scales</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Dual-Time-Scale Graphic</text>

  <!-- Legend -->
  <line x1="94" y1="60" x2="128" y2="60" stroke="#F472B6" stroke-width="1.8"/>
  <text x="136" y="64" fill="#94A3B8" font-size="9.5">Fast-variable trace (22-dim, per round)</text>
  <line x1="366" y1="60" x2="400" y2="60" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="408" y="64" fill="#94A3B8" font-size="9.5">Envelope (range allowed by order parameters)</text>

  <!-- Axes -->
  <line x1="90" y1="340" x2="890" y2="340" stroke="#334155" stroke-width="1.2"/>
  <line x1="90" y1="340" x2="90" y2="86" stroke="#334155" stroke-width="1.2"/>
  <text x="62" y="216" fill="#64748B" font-size="10" transform="rotate(-90 62 216)" text-anchor="middle">Value / Deviation</text>
  <g fill="#475569" font-size="10" text-anchor="middle">
    <text x="90" y="358">sec</text><text x="290" y="358">round</text><text x="490" y="358">day</text><text x="690" y="358">month</text><text x="880" y="358">year</text>
  </g>
  <text x="880" y="374" fill="#64748B" font-size="9.5" text-anchor="end">Time (non-linear scale)</text>

  <!-- Envelope -->
  <path d="M90 224 C200 216 400 206 600 199 L620 149 C740 141 820 139 880 140 L880 160 C820 162 740 170 620 181 L600 231 C400 252 200 290 90 276 Z" fill="url(#systg-env-en)" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- Fast variables -->
  <polyline points="90,224 123,273 156,221 189,267 222,218 255,261 288,214 321,256 354,211 387,250 420,208 453,244 486,205 519,238 552,202 585,232 618,152 651,178 684,147 717,173 750,145 783,168 816,142 849,163 882,140"
            fill="none" stroke="#F472B6" stroke-width="1.8"/>

  <!-- Transition line -->
  <line x1="620" y1="340" x2="620" y2="96" stroke="#F87171" stroke-width="1.2" stroke-dasharray="4 4" opacity=".7"/>
  <text x="628" y="88" fill="#FCA5A5" font-size="10" font-weight="600">Order-parameter jump: knowledge base / retrain / thresholds</text>

  <!-- Amplitude annotation -->
  <g stroke="#94A3B8" stroke-width="1">
    <line x1="288" y1="214" x2="288" y2="256"/>
    <line x1="282" y1="214" x2="294" y2="214"/>
    <line x1="282" y1="256" x2="294" y2="256"/>
  </g>
  <text x="300" y="240" fill="#94A3B8" font-size="9.5">Amplitude = tunable range</text>

  <!-- Slow-variable baseline -->
  <path d="M90 250 C250 242 450 222 600 215 L620 165 C740 158 820 152 880 150" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <text x="96" y="204" fill="#C4B5FD" font-size="9.5">Order-parameter baseline</text>
  <path d="M150 208 L128 244" stroke="#A78BFA" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="640" y="128" fill="#C4B5FD" font-size="9.5">Baseline raised after jump</text>
  <path d="M676 132 L664 152" stroke="#A78BFA" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Three readings -->
  <g font-size="10">
    <text x="40" y="396" fill="#94A3B8">1. Pink sawtooth = fast variables: second-to-round scale, driven by the acquisition function, serving current convergence;</text>
    <text x="40" y="414" fill="#94A3B8">2. Purple band = range granted by order parameters: brand genes, philosophy and quality thresholds, moving only month-to-year;</text>
    <text x="40" y="432" fill="#94A3B8">3. Red vertical line = a "knowledge-system event": an order-parameter jump must follow process, never a single-round score rewrite.</text>
  </g>
  <text x="40" y="452" fill="#475569" font-size="9.5">Fast-variable convergence alone is local optimization; order-parameter jump alone is a castle in the air; only their coupling is deep evolution.</text>
</svg>
