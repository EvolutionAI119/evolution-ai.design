<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34D399"/>
    </marker>
    <linearGradient id="pnet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity=".35"/><stop offset="1" stop-color="#38BDF8" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="478" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">NURBS Class-A Pipeline: Control Net → Surface → Continuity Checks</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Class-A Surface Pipeline</text>

  <!-- ① Control net -->
  <g>
    <rect x="34" y="66" width="270" height="250" rx="12" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="169" y="92" fill="#7DD3FC" font-size="13.5" font-weight="700" text-anchor="middle">① Control Net</text>
    <text x="169" y="110" fill="#64748B" font-size="10.5" text-anchor="middle">de Boor control points driven by styling params</text>
    <g stroke="#38BDF8" stroke-opacity=".45" fill="none">
      <path d="M70 140 L 140 128 L 210 132 L 276 122"/>
      <path d="M70 178 L 140 166 L 210 172 L 276 160"/>
      <path d="M70 216 L 140 208 L 210 214 L 276 202"/>
      <path d="M70 140 L 70 216 M 140 128 L 140 208 M 210 132 L 210 214 M 276 122 L 276 202"/>
    </g>
    <g fill="#38BDF8">
      <circle cx="70" cy="140" r="3"/><circle cx="140" cy="128" r="3"/><circle cx="210" cy="132" r="3"/><circle cx="276" cy="122" r="3"/>
      <circle cx="70" cy="178" r="3"/><circle cx="140" cy="166" r="3"/><circle cx="210" cy="172" r="3"/><circle cx="276" cy="160" r="3"/>
      <circle cx="70" cy="216" r="3"/><circle cx="140" cy="208" r="3"/><circle cx="210" cy="214" r="3"/><circle cx="276" cy="202" r="3"/>
    </g>
    <text x="169" y="252" fill="#94A3B8" font-size="10.5" text-anchor="middle">each control point = param-space function</text>
    <text x="169" y="270" fill="#64748B" font-size="10.5" text-anchor="middle">P(u,v) = Σ Nᵢₚ(u) Nⱼq(v) · Pᵢⱼ</text>
    <text x="169" y="296" fill="#475569" font-size="10.5" text-anchor="middle">length/wheelbase → points reflow → surface follows</text>
  </g>

  <!-- ② Surface lofting -->
  <g>
    <rect x="346" y="66" width="270" height="250" rx="12" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="481" y="92" fill="#6EE7B7" font-size="13.5" font-weight="700" text-anchor="middle">② Surface Eval &amp; Lofting</text>
    <text x="481" y="110" fill="#64748B" font-size="10.5" text-anchor="middle">sections → skin loft → semantic stitching</text>
    <path d="M370 240 C 390 150, 440 130, 481 140 C 530 150, 570 190, 592 236 C 560 210, 520 196, 481 198 C 440 200, 400 218, 370 240 Z" fill="url(#pnet)" stroke="#34D399" stroke-opacity=".6"/>
    <g stroke="#34D399" stroke-opacity=".28" fill="none">
      <path d="M400 158 C 430 150, 540 156, 576 196"/>
      <path d="M384 186 C 430 172, 540 180, 586 216"/>
      <path d="M372 218 C 430 196, 540 206, 590 230"/>
    </g>
    <g font-size="10.5" fill="#94A3B8" text-anchor="middle">
      <text x="481" y="266">hood / windshield / roof / tail zones</text>
      <text x="481" y="284">zone borders forced G2 (curvature match)</text>
      <text x="481" y="302" fill="#475569">output: watertight OBJ / STEP</text>
    </g>
  </g>

  <!-- ③ Continuity checks -->
  <g>
    <rect x="658" y="66" width="272" height="250" rx="12" fill="#0B101A" stroke="#1E2A3A"/>
    <text x="794" y="92" fill="#C4B5FD" font-size="13.5" font-weight="700" text-anchor="middle">③ Continuity Spectrum</text>
    <!-- G0/G1/G2 mini plots -->
    <g>
      <rect x="676" y="112" width="76" height="120" rx="8" fill="#0F1622"/>
      <path d="M686 200 L 716 160 L 746 200" fill="none" stroke="#F87171" stroke-width="2"/>
      <circle cx="716" cy="160" r="3" fill="#F87171"/>
      <text x="714" y="132" fill="#F87171" font-size="11" font-weight="700" text-anchor="middle">G0</text>
      <text x="714" y="216" fill="#64748B" font-size="9.5" text-anchor="middle">Position</text>
      <text x="714" y="228" fill="#475569" font-size="9" text-anchor="middle">kink</text>
    </g>
    <g>
      <rect x="758" y="112" width="76" height="120" rx="8" fill="#0F1622"/>
      <path d="M766 204 C 782 204, 792 196, 796 186 C 800 176, 810 156, 826 156" fill="none" stroke="#FBBF24" stroke-width="2"/>
      <circle cx="796" cy="186" r="3" fill="#FBBF24"/>
      <text x="796" y="132" fill="#FBBF24" font-size="11" font-weight="700" text-anchor="middle">G1</text>
      <text x="796" y="216" fill="#64748B" font-size="9.5" text-anchor="middle">Tangent</text>
      <text x="796" y="228" fill="#475569" font-size="9" text-anchor="middle">curvature jump</text>
    </g>
    <g>
      <rect x="840" y="112" width="76" height="120" rx="8" fill="#0F1622"/>
      <path d="M848 200 C 862 176, 872 162, 880 158 C 890 154, 902 162, 908 172" fill="none" stroke="#34D399" stroke-width="2"/>
      <circle cx="880" cy="158" r="3" fill="#34D399"/>
      <path d="M868 142 C 876 150, 884 150, 892 142" fill="none" stroke="#34D399" stroke-width="1.2" stroke-dasharray="3 2"/>
      <text x="878" y="130" fill="#34D399" font-size="11" font-weight="700" text-anchor="middle">G2</text>
      <text x="878" y="216" fill="#64748B" font-size="9.5" text-anchor="middle">Curvature</text>
      <text x="878" y="228" fill="#475569" font-size="9" text-anchor="middle">Class-A bar</text>
    </g>
    <text x="794" y="258" fill="#94A3B8" font-size="10.5" text-anchor="middle">curvature comb: no abrupt inflection</text>
    <text x="794" y="276" fill="#64748B" font-size="10.5" text-anchor="middle">platform evaluator scores per zone</text>
    <text x="794" y="296" fill="#475569" font-size="10.5" text-anchor="middle">G2 pass → counts into total score</text>
  </g>

  <!-- Top flow arrows -->
  <line x1="306" y1="190" x2="342" y2="190" stroke="#34D399" stroke-width="2" marker-end="url(#ar11)"/>
  <line x1="618" y1="190" x2="654" y2="190" stroke="#34D399" stroke-width="2" marker-end="url(#ar11)"/>

  <!-- Bottom note band -->
  <rect x="34" y="344" width="896" height="100" rx="10" fill="#0B101A" stroke="#1E2A3A"/>
  <text x="56" y="372" fill="#E2E8F0" font-size="12.5" font-weight="600">Why NURBS over polygon meshes:</text>
  <g font-size="11.5" fill="#94A3B8">
    <text x="56" y="396">· Analytic precision — curvature/normals differentiable, metrics computed directly, no mesh discretization error</text>
    <text x="56" y="416">· Param-driven — explicit mapping from control points to styling params; every Bayes dimension has geometric meaning</text>
    <text x="56" y="436">· Industry-ready — STEP/IGS direct export, seamless into downstream Class-A flows (CATIA/Alias/ICEM)</text>
  </g>
</svg>
