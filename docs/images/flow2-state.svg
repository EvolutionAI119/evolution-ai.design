<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="flow2s-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34D399"/>
    </marker>
    <marker id="flow2s-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#FBBF24"/>
    </marker>
    <marker id="flow2s-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#F472B6"/>
    </marker>
    <marker id="flow2s-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#F87171"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="478" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#F472B6"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">送审请求的生命周期状态机（含错误出口）</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Request Lifecycle State Machine</text>

  <!-- Row 1 -->
  <rect x="60" y="88" width="130" height="56" rx="9" fill="#131C2A" stroke="#64748B"/>
  <text x="125" y="111" fill="#94A3B8" font-size="11.5" font-weight="700" text-anchor="middle">未认证</text>
  <text x="125" y="129" fill="#64748B" font-size="9" text-anchor="middle">无 token</text>

  <rect x="230" y="88" width="150" height="56" rx="9" fill="#0F241C" stroke="#34D399"/>
  <text x="305" y="111" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">已认证</text>
  <text x="305" y="129" fill="#64748B" font-size="9" text-anchor="middle">JWT 7d · HS256</text>

  <rect x="420" y="88" width="140" height="56" rx="9" fill="#12293D" stroke="#38BDF8"/>
  <text x="490" y="111" fill="#7DD3FC" font-size="11.5" font-weight="700" text-anchor="middle">训练运行中</text>
  <text x="490" y="129" fill="#64748B" font-size="9" text-anchor="middle">Task.user_id</text>

  <rect x="610" y="88" width="160" height="56" rx="9" fill="#2A1A0E" stroke="#FBBF24"/>
  <text x="690" y="111" fill="#FCD34D" font-size="11.5" font-weight="700" text-anchor="middle">待送审</text>
  <text x="690" y="129" fill="#64748B" font-size="9" text-anchor="middle">task completed</text>

  <g font-size="9" fill="#94A3B8" text-anchor="middle">
    <text x="208" y="78">① 邮箱 + 密码</text>
    <text x="398" y="78">② Bearer</text>
    <text x="583" y="78">③ completed 轮询</text>
  </g>
  <g stroke="#34D399" stroke-width="1.8" marker-end="url(#flow2s-g)">
    <line x1="190" y1="116" x2="226" y2="116"/>
    <line x1="380" y1="116" x2="416" y2="116"/>
    <line x1="560" y1="116" x2="606" y2="116"/>
  </g>

  <!-- Row 2 -->
  <rect x="610" y="190" width="160" height="56" rx="9" fill="#2A1420" stroke="#F472B6"/>
  <text x="690" y="213" fill="#F9A8D4" font-size="11.5" font-weight="700" text-anchor="middle">审核中</text>
  <text x="690" y="231" fill="#64748B" font-size="9" text-anchor="middle">pending → running</text>

  <rect x="400" y="190" width="170" height="56" rx="9" fill="#0F241C" stroke="#34D399"/>
  <text x="485" y="213" fill="#6EE7B7" font-size="11.5" font-weight="700" text-anchor="middle">审核完成</text>
  <text x="485" y="231" fill="#64748B" font-size="9" text-anchor="middle">completed</text>

  <rect x="800" y="190" width="120" height="56" rx="9" fill="#2A1420" stroke="#F87171"/>
  <text x="860" y="213" fill="#F87171" font-size="11.5" font-weight="700" text-anchor="middle">审核失败</text>
  <text x="860" y="231" fill="#64748B" font-size="9" text-anchor="middle">failed</text>

  <line x1="690" y1="144" x2="690" y2="186" stroke="#FBBF24" stroke-width="1.8" marker-end="url(#flow2s-a)"/>
  <text x="700" y="170" fill="#FCD34D" font-size="9">④ 送审 201 · POST /training-review</text>
  <line x1="606" y1="218" x2="574" y2="218" stroke="#34D399" stroke-width="1.8" marker-end="url(#flow2s-g)"/>
  <text x="590" y="182" fill="#6EE7B7" font-size="9" text-anchor="middle">两步通过</text>
  <line x1="774" y1="218" x2="796" y2="218" stroke="#F87171" stroke-width="1.8" marker-end="url(#flow2s-r)"/>
  <text x="785" y="182" fill="#F87171" font-size="9" text-anchor="middle">任一步驳回</text>

  <!-- Error exits -->
  <rect x="40" y="300" width="880" height="64" rx="10" fill="#1A1016" stroke="#F87171" stroke-opacity=".75"/>
  <text x="56" y="321" fill="#F87171" font-size="11" font-weight="700">错误出口（统一可读 detail）</text>
  <g font-size="9.5" fill="#94A3B8">
    <text x="56" y="346">401 缺少 / 无效 JWT → 引导登录</text>
    <text x="330" y="346">404 项目 / 任务不存在</text>
    <text x="560" y="346">400 任务未完成 / 对审核流 execute</text>
  </g>

  <text x="40" y="398" fill="#94A3B8" font-size="10">状态由数据推导：工作流级 pending/running/completed 由步骤聚合，failed 由任一 rejected 上卷，无手工置入路径。</text>
  <text x="40" y="418" fill="#64748B" font-size="10">闸口顺序：认证（401）→ 归属与存在性（404）→ 前置条件（400）→ 审核（201）；任何一步失败都不会留下半完成状态。</text>
</svg>
