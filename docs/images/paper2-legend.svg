<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="paper2-lg-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker>
    <marker id="paper2-lg-ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34D399"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="428" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">Visual grammar: layers · call types · acceptance thresholds</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Paper Legend</text>

  <!-- A 层 -->
  <rect x="24" y="56" width="290" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="42" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">Colour = layer</text>
  <g font-size="10">
    <rect x="42" y="96" width="14" height="14" rx="3" fill="#38BDF8"/>
    <text x="64" y="107" fill="#CBD5E1">L1 Frontend · Vue 3 / Pinia</text>
    <rect x="42" y="122" width="14" height="14" rx="3" fill="#64748B"/>
    <text x="64" y="133" fill="#CBD5E1">L2 Gateway · proxy / tunnel</text>
    <rect x="42" y="148" width="14" height="14" rx="3" fill="#A78BFA"/>
    <text x="64" y="159" fill="#CBD5E1">L3 Backend · FastAPI</text>
    <rect x="42" y="174" width="14" height="14" rx="3" fill="#34D399"/>
    <text x="64" y="185" fill="#CBD5E1">L4 Algorithm · algorithm_model</text>
    <rect x="42" y="200" width="14" height="14" rx="3" fill="#FBBF24"/>
    <text x="64" y="211" fill="#CBD5E1">L5 Infrastructure · SQLite / Redis</text>
  </g>
  <line x1="42" y1="222" x2="296" y2="222" stroke="#1E2A3A"/>
  <text x="42" y="242" fill="#94A3B8" font-size="9.5">Dependency rule</text>
  <path d="M50 258 L112 258" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#paper2-lg-ar)"/>
  <text x="122" y="262" fill="#64748B" font-size="9">upper layer may depend on lower</text>
  <path d="M112 282 L50 282" stroke="#F87171" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M56 278 L50 282 L56 286" fill="none" stroke="#F87171" stroke-width="1.5"/>
  <text x="122" y="286" fill="#64748B" font-size="9">never the reverse</text>
  <text x="42" y="312" fill="#64748B" font-size="9">Same colour appears in every figure,</text>
  <text x="42" y="328" fill="#475569" font-size="9">so a layer can be traced across panels.</text>

  <!-- B 调用类型 -->
  <rect x="336" y="56" width="290" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="354" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">Line = call type</text>
  <g font-size="10">
    <line x1="356" y1="104" x2="406" y2="104" stroke="#34D399" stroke-width="2" marker-end="url(#paper2-lg-ar2)"/>
    <text x="418" y="108" fill="#CBD5E1">Runtime call</text>
    <text x="418" y="122" fill="#64748B" font-size="9">request/response, real data</text>

    <line x1="356" y1="146" x2="406" y2="146" stroke="#F87171" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="418" y="150" fill="#CBD5E1">Degradation path</text>
    <text x="418" y="164" fill="#64748B" font-size="9">missing dependency → 503</text>

    <line x1="356" y1="188" x2="406" y2="188" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="2 4"/>
    <text x="418" y="192" fill="#CBD5E1">Async / polled job</text>
    <text x="418" y="206" fill="#64748B" font-size="9">long training, background worker</text>
  </g>
  <line x1="354" y1="220" x2="608" y2="220" stroke="#1E2A3A"/>
  <text x="354" y="240" fill="#E2E8F0" font-size="11" font-weight="600">Arrow = data flow</text>
  <text x="354" y="258" fill="#94A3B8" font-size="9.5">Filled head: payload moves forward.</text>
  <text x="354" y="274" fill="#94A3B8" font-size="9.5">Dashed line: failure or absence.</text>
  <text x="354" y="298" fill="#E2E8F0" font-size="11" font-weight="600">Never encoded</text>
  <text x="354" y="316" fill="#64748B" font-size="9">A green line does not prove accuracy;</text>
  <text x="354" y="332" fill="#475569" font-size="9">it proves the call completed and returned.</text>

  <!-- C 阈值 -->
  <rect x="648" y="56" width="288" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="666" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">Number = acceptance</text>
  <g font-size="9.5">
    <text x="666" y="102" fill="#CBD5E1">G0 position</text>
    <text x="916" y="102" fill="#6EE7B7" text-anchor="end">≤ 0.1 mm</text>
    <text x="666" y="122" fill="#CBD5E1">G1 tangent</text>
    <text x="916" y="122" fill="#7DD3FC" text-anchor="end">≤ 1.0°</text>
    <text x="666" y="142" fill="#CBD5E1">G2 visual band</text>
    <text x="916" y="142" fill="#FCD34D" text-anchor="end">5°</text>
  </g>
  <line x1="666" y1="154" x2="918" y2="154" stroke="#1E2A3A"/>
  <text x="666" y="174" fill="#CBD5E1" font-size="9.5">Test baseline</text>
  <rect x="666" y="184" width="252" height="22" rx="4" fill="#0B101A" stroke="#1E2A3A"/>
  <text x="676" y="199" fill="#94A3B8" font-size="9">algorithm 205</text>
  <rect x="666" y="210" width="252" height="22" rx="4" fill="#0B101A" stroke="#1E2A3A"/>
  <text x="676" y="225" fill="#94A3B8" font-size="9">backend 388</text>
  <rect x="666" y="236" width="252" height="22" rx="4" fill="#0B101A" stroke="#1E2A3A"/>
  <text x="676" y="251" fill="#94A3B8" font-size="9">frontend 362</text>
  <text x="916" y="199" fill="#E2E8F0" font-size="9" text-anchor="end">21.5%</text>
  <text x="916" y="225" fill="#E2E8F0" font-size="9" text-anchor="end">40.6%</text>
  <text x="916" y="251" fill="#E2E8F0" font-size="9" text-anchor="end">37.9%</text>
  <text x="666" y="274" fill="#64748B" font-size="9">955 = 205 + 388 + 362; 5 self-check</text>
  <text x="666" y="288" fill="#64748B" font-size="9">modules are outside this sum.</text>
  <line x1="666" y1="300" x2="918" y2="300" stroke="#1E2A3A"/>
  <text x="666" y="320" fill="#94A3B8" font-size="9">HTTP codes</text>
  <text x="666" y="337" fill="#6EE7B7" font-size="9">200 ok</text>
  <text x="724" y="337" fill="#FCD34D" font-size="9">400 input</text>
  <text x="796" y="337" fill="#F87171" font-size="9">409 conflict</text>
  <text x="870" y="337" fill="#94A3B8" font-size="9">503 missing</text>

  <text x="24" y="382" fill="#64748B" font-size="10.5">How to use: read colour for the layer, line style for whether a path is a normal call, a degradation or an async job, and the numbers to check that a claim clears the acceptance bar.</text>
  <text x="24" y="404" fill="#475569" font-size="10">Thresholds are the ones applied by the code; the figure never upgrades a measured value to “Class-A” without them.</text>
</svg>
