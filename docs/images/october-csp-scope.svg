<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="438" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#FBBF24"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">CSP 作用域：/admin 放行 unsafe-eval · 其余严格</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">CSP Scoping</text>
  <rect x="60" y="80" width="380" height="130" rx="12" fill="#0B101A" stroke="#34D399"/>
  <text x="250" y="110" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">公开 API + 主站（默认严格）</text>
  <text x="250" y="134" fill="#CBD5E1" font-size="11" text-anchor="middle" font-family="Consolas,monospace">script-src 'self'</text>
  <text x="250" y="154" fill="#64748B" font-size="9.5" text-anchor="middle">无 unsafe-eval · 拦截 vue-i18n Function 构造器</text>
  <text x="250" y="176" fill="#94A3B8" font-size="10.5" text-anchor="middle">/api/v1/* · evolution-ai.design 首页</text>
  <rect x="520" y="80" width="380" height="130" rx="12" fill="#1A1230" stroke="#A78BFA"/>
  <text x="710" y="110" fill="#C4B5FD" font-size="13" font-weight="700" text-anchor="middle">/admin 文档（专用放宽）</text>
  <text x="710" y="134" fill="#CBD5E1" font-size="11" text-anchor="middle" font-family="Consolas,monospace">script-src 'self' 'unsafe-eval'</text>
  <text x="710" y="154" fill="#64748B" font-size="9.5" text-anchor="middle">仅允许 Function 构造器供 vue-i18n 编译</text>
  <text x="710" y="176" fill="#94A3B8" font-size="10.5" text-anchor="middle">/admin/ · /admin/assets/*</text>
  <rect x="380" y="240" width="200" height="70" rx="10" fill="#0B101A" stroke="#38BDF8"/>
  <text x="480" y="268" fill="#7DD3FC" font-size="11.5" font-weight="700" text-anchor="middle">SecurityHeadersMiddleware</text>
  <text x="480" y="288" fill="#94A3B8" font-size="9.5" text-anchor="middle">按请求路径选择 CSP 策略</text>
  <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker></defs>
  <line x1="250" y1="210" x2="420" y2="240" stroke="#34D399" stroke-width="1.6" marker-end="url(#c)"/>
  <line x1="710" y1="210" x2="540" y2="240" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#c)"/>
  <rect x="60" y="330" width="840" height="70" rx="10" fill="#2A1212" stroke="#F87171"/>
  <text x="80" y="356" fill="#F87171" font-size="11.5" font-weight="700">缺陷与修复</text>
  <g font-size="9.5" fill="#94A3B8">
    <circle cx="80" cy="378" r="2.5" fill="#F87171"/><text x="92" y="382">首测后台白屏：EvalError - 'unsafe-eval' is not an allowed source of script</text>
    <circle cx="500" cy="378" r="2.5" fill="#34D399"/><text x="512" y="382">修复：/admin 文档作用域单独放行 unsafe-eval；回归测试锁定边界（test_admin_console.py）</text>
  </g>
</svg>