<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect x="1" y="1" width="958" height="438" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#A78BFA"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">17 张 ORM 表：按领域分布与关系链</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">ORM Tables by Domain</text>

  <!-- Donut -->
  <g transform="rotate(-90 270 222)">
    <circle cx="270" cy="222" r="86" fill="none" stroke="#1E2A3A" stroke-width="30"/>
    <circle cx="270" cy="222" r="86" fill="none" stroke="#38BDF8" stroke-width="30" stroke-dasharray="124 540.36" stroke-dashoffset="0"/>
    <circle cx="270" cy="222" r="86" fill="none" stroke="#FBBF24" stroke-width="30" stroke-dasharray="124 540.36" stroke-dashoffset="-127.14"/>
    <circle cx="270" cy="222" r="86" fill="none" stroke="#34D399" stroke-width="30" stroke-dasharray="124 540.36" stroke-dashoffset="-254.28"/>
    <circle cx="270" cy="222" r="86" fill="none" stroke="#A78BFA" stroke-width="30" stroke-dasharray="28 540.36" stroke-dashoffset="-381.42"/>
    <circle cx="270" cy="222" r="86" fill="none" stroke="#F472B6" stroke-width="30" stroke-dasharray="124 540.36" stroke-dashoffset="-413.21"/>
  </g>
  <text x="270" y="226" fill="#E2E8F0" font-size="26" font-weight="700" text-anchor="middle">17</text>
  <text x="270" y="246" fill="#94A3B8" font-size="10.5" text-anchor="middle">ORM 表</text>
  <text x="270" y="350" fill="#94A3B8" font-size="10.5" text-anchor="middle">5 个领域 · 17 张表</text>
  <text x="270" y="370" fill="#64748B" font-size="9.5" text-anchor="middle">SQLAlchemy 2.0 单入口声明</text>

  <!-- Legend panel -->
  <rect x="490" y="68" width="440" height="310" rx="12" fill="#131C2A" stroke="#1E2A3A"/>
  <g>
    <rect x="510" y="88" width="12" height="12" rx="3" fill="#38BDF8"/>
    <text x="532" y="99" fill="#E2E8F0" font-size="11" font-weight="700">项目 / 流程 / 模型</text>
    <text x="908" y="99" fill="#94A3B8" font-size="10" text-anchor="end">4 张</text>
    <text x="532" y="117" fill="#64748B" font-size="8.8">projects · model_files · workflows · workflow_steps</text>

    <rect x="510" y="146" width="12" height="12" rx="3" fill="#FBBF24"/>
    <text x="532" y="157" fill="#E2E8F0" font-size="11" font-weight="700">质量 / 参数 / 变体</text>
    <text x="908" y="157" fill="#94A3B8" font-size="10" text-anchor="end">4 张</text>
    <text x="532" y="175" fill="#64748B" font-size="8.8">quality_reports · parameter_sets · model_variants · parameter_records</text>

    <rect x="510" y="204" width="12" height="12" rx="3" fill="#34D399"/>
    <text x="532" y="215" fill="#E2E8F0" font-size="11" font-weight="700">用户 / 审计 / 密钥</text>
    <text x="908" y="215" fill="#94A3B8" font-size="10" text-anchor="end">4 张</text>
    <text x="532" y="233" fill="#64748B" font-size="8.8">users · login_records · admin_audit_logs · api_keys</text>

    <rect x="510" y="262" width="12" height="12" rx="3" fill="#A78BFA"/>
    <text x="532" y="273" fill="#E2E8F0" font-size="11" font-weight="700">训练任务</text>
    <text x="908" y="273" fill="#94A3B8" font-size="10" text-anchor="end">1 张</text>
    <text x="532" y="291" fill="#64748B" font-size="8.8">training_tasks（user_id · status · metrics_json）</text>

    <rect x="510" y="320" width="12" height="12" rx="3" fill="#F472B6"/>
    <text x="532" y="331" fill="#E2E8F0" font-size="11" font-weight="700">社区 / 通知 / 埋点</text>
    <text x="908" y="331" fill="#94A3B8" font-size="10" text-anchor="end">4 张</text>
    <text x="532" y="349" fill="#64748B" font-size="8.8">page_views · messages · external_references · notifications</text>
  </g>

  <text x="40" y="400" fill="#94A3B8" font-size="10">关系链：Project 1—N ModelFile / Workflow / QualityReport；Workflow 1—N WorkflowStep；ModelFile 1—N ModelVariant；User 1—N ApiKey / LoginRecord / Notification。</text>
  <text x="40" y="420" fill="#64748B" font-size="10">api_keys 以 Fernet 对称加密落库，(user_id, provider) 唯一；training_tasks 记录 user_id 归属与 metrics_json。</text>
</svg>
