<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#38BDF8"/>
    </marker>
    <marker id="ar9g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34D399"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">关键数据流：一次「车身生成」请求的完整旅程</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">POST /api/v1/car/generate</text>

  <!-- 泳道背景 -->
  <rect x="40" y="60" width="200" height="330" rx="12" fill="#0B101A" stroke="#1E2A3A"/>
  <rect x="260" y="60" width="330" height="330" rx="12" fill="#0B101A" stroke="#1E2A3A"/>
  <rect x="610" y="60" width="320" height="330" rx="12" fill="#0B101A" stroke="#1E2A3A"/>
  <text x="140" y="84" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">浏览器（Vue 3）</text>
  <text x="425" y="84" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">后端（FastAPI）</text>
  <text x="770" y="84" fill="#FCD34D" font-size="13" font-weight="700" text-anchor="middle">算法与数据</text>

  <!-- 浏览器节点 -->
  <g text-anchor="middle" font-size="11.5">
    <rect x="62" y="106" width="156" height="52" rx="9" fill="#12293D"/><text x="140" y="127" fill="#7DD3FC">Designer 页面</text><text x="140" y="145" fill="#64748B" font-size="10.5">carAPI.generate()</text>
    <rect x="62" y="196" width="156" height="52" rx="9" fill="#12293D"/><text x="140" y="217" fill="#7DD3FC">axios 拦截器</text><text x="140" y="235" fill="#64748B" font-size="10.5">注入 Bearer JWT</text>
    <rect x="62" y="300" width="156" height="52" rx="9" fill="#12293D"/><text x="140" y="321" fill="#7DD3FC">3D 渲染更新</text><text x="140" y="339" fill="#64748B" font-size="10.5">Three.js 场景重建</text>
  </g>

  <!-- 后端节点 -->
  <g text-anchor="middle" font-size="11.5">
    <rect x="282" y="106" width="286" height="52" rx="9" fill="#0F241C"/><text x="425" y="127" fill="#6EE7B7">安全中间件链</text><text x="425" y="145" fill="#64748B" font-size="10.5">CORS 校验 → 安全响应头 → 服务器头脱敏</text>
    <rect x="282" y="188" width="286" height="52" rx="9" fill="#0F241C"/><text x="425" y="209" fill="#6EE7B7">路由 car.py</text><text x="425" y="227" fill="#64748B" font-size="10.5">get_current_user 鉴权 · Pydantic 校验入参</text>
    <rect x="282" y="270" width="286" height="52" rx="9" fill="#0F241C"/><text x="425" y="291" fill="#6EE7B7">服务编排</text><text x="425" y="309" fill="#64748B" font-size="10.5">参数合法性 → 调用算法层 → 组装 CarData</text>
  </g>

  <!-- 算法/数据节点 -->
  <g text-anchor="middle" font-size="11.5">
    <rect x="630" y="106" width="280" height="52" rx="9" fill="#3A2A12"/><text x="770" y="127" fill="#FCD34D">algorithm_model 算法层</text><text x="770" y="145" fill="#64748B" font-size="10.5">NURBS 求值 · 截面放样 · 质量自检</text>
    <rect x="630" y="196" width="280" height="52" rx="9" fill="#241A40"/><text x="770" y="217" fill="#C4B5FD">SQLAlchemy ORM</text><text x="770" y="235" fill="#64748B" font-size="10.5">CarData / ModelFile 落库</text>
    <rect x="630" y="292" width="280" height="52" rx="9" fill="#12293D"/><text x="770" y="313" fill="#7DD3FC">文件系统</text><text x="770" y="331" fill="#64748B" font-size="10.5">data/models/*.obj 模型文件持久化</text>
  </g>

  <!-- 请求链路箭头 1→2→3→4 -->
  <line x1="218" y1="132" x2="278" y2="132" stroke="#38BDF8" stroke-width="2" marker-end="url(#ar9)"/>
  <text x="248" y="122" fill="#94A3B8" font-size="10" text-anchor="middle">①HTTPS</text>
  <line x1="425" y1="158" x2="425" y2="184" stroke="#38BDF8" stroke-width="2" marker-end="url(#ar9)"/>
  <text x="446" y="176" fill="#94A3B8" font-size="10">②鉴权/校验</text>
  <line x1="425" y1="240" x2="425" y2="266" stroke="#38BDF8" stroke-width="2" marker-end="url(#ar9)"/>
  <text x="446" y="258" fill="#94A3B8" font-size="10">③编排</text>
  <line x1="568" y1="132" x2="626" y2="132" stroke="#38BDF8" stroke-width="2" marker-end="url(#ar9)"/>
  <text x="597" y="122" fill="#94A3B8" font-size="10" text-anchor="middle">④求值</text>

  <!-- 结果回传链 -->
  <path d="M630 318 L 580 318 Q 570 318 570 308 L 570 296" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#ar9g)"/>
  <path d="M425 322 L 425 348 L 140 348 L 140 356" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#ar9g)"/>
  <text x="290" y="366" fill="#6EE7B7" font-size="10.5" text-anchor="middle">⑤ 200 OK：car_data JSON + model_id → 前端重建 3D 场景</text>

  <!-- 异常分支 -->
  <path d="M425 240 L 300 240 L 300 158" fill="none" stroke="#F87171" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arF)"/>
  <defs><marker id="arF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F87171"/></marker></defs>
  <text x="306" y="200" fill="#F87171" font-size="10" text-anchor="end">401 未登录 → 全局登录引导</text>

  <text x="40" y="422" fill="#64748B" font-size="11.5">读法：实线为正常请求链（①→⑤），虚线为异常分支；鉴权失败不会触达算法层，所有 5xx 异常经统一处理器写入 backend-error.log 供超级管理员在线排查。</text>
</svg>
