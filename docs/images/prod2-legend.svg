<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="prod2-lg-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34D399"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="428" rx="14" fill="#0F1622" stroke="#1E2A3A"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#34D399"/>
  <text x="46" y="29" fill="#E2E8F0" font-size="16" font-weight="700">平台图例：能力域 · 运行状态 · 规模基线</text>
  <text x="936" y="29" fill="#64748B" font-size="11" text-anchor="end">Platform Legend</text>

  <!-- A 能力域 -->
  <rect x="24" y="56" width="290" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="42" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">色 = 能力端</text>
  <g font-size="10.5">
    <circle cx="52" cy="104" r="8" fill="#38BDF8" opacity=".85"/>
    <text x="70" y="108" fill="#CBD5E1">设计端</text>
    <text x="70" y="122" fill="#64748B" font-size="9">参数化生成、3D 预览、变体</text>

    <rect x="45" y="145" width="15" height="15" rx="4" fill="#34D399" opacity=".85"/>
    <text x="70" y="157" fill="#CBD5E1">智能端</text>
    <text x="70" y="171" fill="#64748B" font-size="9">训练、生成式、贝叶斯、LLM</text>

    <path d="M52 197 L61 191 L70 197 L70 209 L61 215 L52 209 Z" fill="#A78BFA" opacity=".85"/>
    <text x="80" y="207" fill="#CBD5E1">工程端</text>
    <text x="80" y="221" fill="#64748B" font-size="9">CAD 改参、A 级检查、多格式导出</text>

    <rect x="45" y="243" width="15" height="15" rx="4" fill="#F472B6" opacity=".85"/>
    <text x="70" y="255" fill="#CBD5E1">账户端</text>
    <text x="70" y="269" fill="#64748B" font-size="9">注册登录、JWT、API Key</text>
  </g>
  <line x1="42" y1="290" x2="296" y2="290" stroke="#1E2A3A"/>
  <text x="42" y="310" fill="#94A3B8" font-size="9.5">四端共用同一账户与权限模型；</text>
  <text x="42" y="326" fill="#64748B" font-size="9">角色差异只体现在可见页面与写权限。</text>
  <text x="42" y="342" fill="#475569" font-size="9">形状也编码端别，黑白打印仍可分辨。</text>

  <!-- B 运行状态 -->
  <rect x="336" y="56" width="290" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="354" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">线 / 点 = 运行状态</text>
  <g font-size="10.5">
    <line x1="356" y1="104" x2="404" y2="104" stroke="#34D399" stroke-width="2" marker-end="url(#prod2-lg-ar)"/>
    <text x="416" y="108" fill="#CBD5E1">正常调用</text>
    <text x="416" y="122" fill="#64748B" font-size="9">后端在线，返回真实结果</text>

    <line x1="356" y1="146" x2="404" y2="146" stroke="#FBBF24" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="416" y="150" fill="#CBD5E1">mock 兜底</text>
    <text x="416" y="164" fill="#64748B" font-size="9">后端不可用，页面不黑屏</text>

    <line x1="356" y1="188" x2="404" y2="188" stroke="#F87171" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="416" y="192" fill="#CBD5E1">显式降级（503）</text>
    <text x="416" y="206" fill="#64748B" font-size="9">依赖缺失就报告缺失</text>
  </g>
  <line x1="354" y1="220" x2="608" y2="220" stroke="#1E2A3A"/>
  <text x="354" y="238" fill="#E2E8F0" font-size="11" font-weight="600">标记 = 数据证据</text>
  <circle cx="364" cy="256" r="6" fill="#34D399"/><text x="380" y="260" fill="#CBD5E1" font-size="9.5">已实现 / 已回填</text>
  <circle cx="364" cy="280" r="6" fill="none" stroke="#64748B" stroke-width="1.6"/><text x="380" y="284" fill="#CBD5E1" font-size="9.5">未登录 / 无观测</text>
  <path d="M358 300 L370 300 M364 294 L364 312" stroke="#F87171" stroke-width="1.6"/><text x="380" y="308" fill="#CBD5E1" font-size="9.5">不可用 / 已拒绝</text>
  <text x="354" y="332" fill="#475569" font-size="9">实心 = 有证据；空心 = 没有证据。</text>

  <!-- C 规模与等级 -->
  <rect x="648" y="56" width="288" height="300" rx="10" fill="#131C2A" stroke="#1E2A3A"/>
  <text x="666" y="80" fill="#E2E8F0" font-size="12.5" font-weight="700">数 = 规模与质量等级</text>
  <g font-size="10">
    <text x="666" y="104" fill="#CBD5E1">平台基线（2026-09-27）</text>
    <text x="666" y="122" fill="#94A3B8" font-size="9.5">19 路由模块 · 153 端点 · 17 表</text>
    <text x="666" y="138" fill="#94A3B8" font-size="9.5">12 页面 · 955 测试（205/388/362）</text>
    <text x="666" y="162" fill="#CBD5E1">曲面等级</text>
  </g>
  <g font-size="10" font-weight="700">
    <rect x="666" y="170" width="26" height="19" rx="4" fill="#0F241C" stroke="#34D399"/><text x="679" y="184" fill="#6EE7B7" text-anchor="middle">A</text>
    <rect x="698" y="170" width="26" height="19" rx="4" fill="#0E1E2E" stroke="#38BDF8"/><text x="711" y="184" fill="#7DD3FC" text-anchor="middle">B</text>
    <rect x="730" y="170" width="26" height="19" rx="4" fill="#2A1A0E" stroke="#FBBF24"/><text x="743" y="184" fill="#FCD34D" text-anchor="middle">C</text>
    <rect x="762" y="170" width="26" height="19" rx="4" fill="#2A1016" stroke="#F87171"/><text x="775" y="184" fill="#FCA5A5" text-anchor="middle">D</text>
  </g>
  <line x1="666" y1="204" x2="918" y2="204" stroke="#1E2A3A"/>
  <text x="666" y="224" fill="#CBD5E1" font-size="10">连续性等级</text>
  <g font-size="9.5" fill="#94A3B8">
    <text x="666" y="242">G0 位置：面片相接，有硬点</text>
    <text x="666" y="260">G1 切线：方向一致，曲率跳变</text>
    <text x="666" y="278">G2 曲率：曲率连续，A 级标准</text>
  </g>
  <line x1="666" y1="294" x2="918" y2="294" stroke="#1E2A3A"/>
  <text x="666" y="314" fill="#64748B" font-size="9.5">等级 A–D 由质量评估器综合打分给出，</text>
  <text x="666" y="330" fill="#475569" font-size="9">G0/G1/G2 是分项证据，不互相替代。</text>
  <text x="666" y="346" fill="#475569" font-size="9">数字随代码快照更新，图与正文同源。</text>

  <text x="24" y="382" fill="#64748B" font-size="10.5">用法：先看颜色判断属于设计 / 智能 / 工程 / 账户哪一端；再看线与点判断这次调用有没有真实证据；最后看数字判断规模与质量等级。</text>
  <text x="24" y="404" fill="#475569" font-size="10">本图编码与全站图注共用：绿 = 真实成功，琥珀 = 兜底或探索，红 = 诚实报告问题，紫 = 工程交付，粉 = 账户与凭证。</text>
</svg>
