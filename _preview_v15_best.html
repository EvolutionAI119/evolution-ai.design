<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>v15 最佳候选验证</title>
<style>
body{background:#0f0f1e;color:#eee;font-family:sans-serif;margin:0;padding:20px}
h1{text-align:center;margin-bottom:10px}
.sub{text-align:center;color:#888;margin-bottom:20px;font-size:13px}
.car-block{margin-bottom:30px;border:2px solid #e94560;border-radius:10px;padding:15px;background:#16213e}
.car-title{font-size:18px;color:#e94560;font-weight:bold;margin-bottom:5px}
.car-info{color:#888;font-size:12px;margin-bottom:10px}
.best-img{width:100%;max-width:800px;height:auto;display:block;margin:0 auto;border:1px solid #444;border-radius:6px;background:#000}
.controls{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.btn{padding:6px 12px;background:#e94560;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px}
.btn:hover{background:#c81e45}
.btn.also{background:#2ecc71}
.btn.also:hover{background:#27aa60}
.btn.bad{background:#666}
.all-cands{display:none;margin-top:10px}
.all-cands img{width:200px;height:120px;object-fit:contain;background:#000;margin:2px;border:1px solid #333}
.status{padding:4px 8px;border-radius:4px;font-size:12px;margin-top:5px;text-align:center}
.status.pending{background:#444;color:#fff}
.status.approved{background:#2ecc71;color:#fff}
.status.rejected{background:#e94560;color:#fff}
</style></head><body>
<h1>v15 最佳候选验证（13款车）</h1>
<div class="sub">每款车展示推荐的最佳候选 | 点击按钮标记通过/拒绝 | 拒绝后可查看全部候选</div>
<div id="root"></div>

<script>
const CARS = [
  ["rolls-royce","ghost","Rolls-Royce Ghost","cand_10_P90649577.jpg"],
  ["rolls-royce","cullinan","Rolls-Royce Cullinan","cand_03_P90549025.jpg"],
  ["bugatti","chiron","Bugatti Chiron","cand_21.jpg"],
  ["bugatti","veyron","Bugatti Veyron","cand_17.jpg"],
  ["bugatti","divo","Bugatti Divo","cand_08.jpg"],
  ["bentley","continental-gt","Bentley Continental GT","cand_06.jpg"],
  ["bentley","continental-gtc","Bentley Continental GTC","cand_12.jpg"],
  ["bentley","flying-spur","Bentley Flying Spur","cand_09.jpg"],
  ["bentley","bentayga","Bentley Bentayga","cand_05.jpg"],
  ["porsche","taycan","Porsche Taycan","cand_05.jpg"],
  ["ferrari","sf90","Ferrari SF90","cand_02.jpg"],
  ["ferrari","f8-tributo","Ferrari F8 Tributo","cand_06.jpg"],
  ["ferrari","roma","Ferrari Roma","cand_14.jpg"]
];

async function exists(url){
  try{const r=await fetch(url,{method:'HEAD'});return r.ok;}catch(e){return false;}
}

async function build() {
  const root=document.getElementById('root');
  for(const [brand,model,name,bestFname] of CARS) {
    const section=document.createElement('div');
    section.className='car-block';
    section.dataset.brand=brand;
    section.dataset.model=model;

    const title=document.createElement('div');
    title.className='car-title';
    title.textContent=`${name} (${brand}/${model})`;
    section.appendChild(title);

    const info=document.createElement('div');
    info.className='car-info';
    info.textContent=`推荐: ${bestFname}`;
    section.appendChild(info);

    const bestUrl=`/_candidates_v15/${brand}/${model}/${bestFname}`;
    const ok=await exists(bestUrl);
    if(!ok){
      const err=document.createElement('div');
      err.style.color='#e94560';
      err.textContent=`✗ 推荐文件不存在: ${bestFname}`;
      section.appendChild(err);
      root.appendChild(section);
      continue;
    }

    const img=document.createElement('img');
    img.className='best-img';
    img.src=bestUrl;
    img.loading='lazy';
    section.appendChild(img);

    const status=document.createElement('div');
    status.className='status pending';
    status.textContent='待验证';
    section.appendChild(status);

    const controls=document.createElement('div');
    controls.className='controls';

    const btnApprove=document.createElement('button');
    btnApprove.className='btn also';
    btnApprove.textContent='✓ 通过';
    btnApprove.onclick=()=>{
      status.className='status approved';
      status.textContent='✓ 通过 - 正侧视+纯净背景';
    };
    controls.appendChild(btnApprove);

    const btnReject=document.createElement('button');
    btnReject.className='btn bad';
    btnReject.textContent='✗ 拒绝';
    btnReject.onclick=()=>{
      status.className='status rejected';
      status.textContent='✗ 拒绝 - 不是正侧视或背景不纯';
      const allCands=section.querySelector('.all-cands');
      if(allCands) allCands.style.display='block';
    };
    controls.appendChild(btnReject);

    const btnShowAll=document.createElement('button');
    btnShowAll.className='btn';
    btnShowAll.textContent='查看全部候选';
    btnShowAll.onclick=()=>{
      const allCands=section.querySelector('.all-cands');
      if(allCands) allCands.style.display = allCands.style.display==='block' ? 'none' : 'block';
    };
    controls.appendChild(btnShowAll);

    section.appendChild(controls);

    // 全部候选图（默认隐藏）
    const allCands=document.createElement('div');
    allCands.className='all-cands';
    for(let i=1;i<=40;i++){
      const fname=`cand_${String(i).padStart(2,'0')}.jpg`;
      const url=`/_candidates_v15/${brand}/${model}/${fname}`;
      const cImg=document.createElement('img');
      cImg.src=url;
      cImg.loading='lazy';
      cImg.onerror=()=>{cImg.style.display='none';};
      cImg.onclick=()=>{
        img.src=url;
        info.textContent=`当前查看: ${fname}`;
      };
      cImg.style.cursor='pointer';
      allCands.appendChild(cImg);
    }
    // Rolls-Royce 带 dok 号的文件
    if(brand==='rolls-royce'){
      const doks = model==='ghost'
        ? ['P90401223','P90401224','P90612626','P90651071','P90651072','P90651074','P90651076','P90651078','P90649576','P90649577','P90649578','P90649579','P90649580','P90649581']
        : ['P90549024','P90549026','P90549025','P90403691','P90403692','P90403693','P90403694','P90403695','P90403696','P90403697','P90403698','P90403699','P90403700','P90403701','P90403702','P90403703','P90403704','P90403705','P90403706','P90403707','P90403708','P90403709','P90403710','P90403711','P90403712','P90403713','P90403714','P90403715','P90403716','P90403717','P90403718','P90403719','P90403720','P90403721','P90403722','P90403723'];
      for(let idx=0;idx<doks.length;idx++){
        const fname=`cand_${String(idx+1).padStart(2,'0')}_${doks[idx]}.jpg`;
        const url=`/_candidates_v15/${brand}/${model}/${fname}`;
        const cImg=document.createElement('img');
        cImg.src=url;
        cImg.loading='lazy';
        cImg.onerror=()=>{cImg.style.display='none';};
        cImg.onclick=()=>{
          img.src=url;
          info.textContent=`当前查看: ${fname}`;
        };
        cImg.style.cursor='pointer';
        allCands.appendChild(cImg);
      }
    }
    section.appendChild(allCands);

    root.appendChild(section);
  }
}
build();
</script>
</body></html>
