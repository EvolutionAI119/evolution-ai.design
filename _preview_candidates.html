<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>19 Cars Candidates v12b</title>
<style>
body{background:#0f0f1e;color:#eee;font-family:sans-serif;margin:0;padding:20px}
h1{text-align:center;margin-bottom:10px}
.note{text-align:center;color:#aaa;margin-bottom:20px;font-size:13px}
.car-block{background:#16213e;border-radius:8px;padding:12px;margin-bottom:15px}
.car-block h2{margin:0 0 10px 0;color:#e94560;font-size:16px;border-bottom:1px solid #333;padding-bottom:5px}
.candidates{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.cand{background:#000;border-radius:4px;overflow:hidden;position:relative}
.cand img{width:100%;height:140px;object-fit:contain;background:#222;display:block;cursor:pointer}
.cand .meta{padding:4px 6px;font-size:11px;color:#aaa;background:#1a1a2e}
.cand .meta .fname{color:#7ec8e3}
.cand .pick{position:absolute;top:4px;right:4px;background:#4ade80;color:#000;font-size:11px;padding:2px 6px;border-radius:3px;display:none;font-weight:bold}
.cand.picked .pick{display:block}
.cand.picked{outline:3px solid #4ade80}
</style>
</head>
<body>
<h1>19 款车型候选图视觉验证 v12b</h1>
<div class="note">每张图判断：1) 是该车吗 2) 是否正侧视90° 3) 背景是否纯净。合格标准：正侧视+纯净背景+车型正确。</div>
<div id="root"></div>

<script>
const CARS = [
  ["rolls-royce","phantom","Rolls-Royce Phantom"],
  ["rolls-royce","ghost","Rolls-Royce Ghost"],
  ["rolls-royce","cullinan","Rolls-Royce Cullinan"],
  ["rolls-royce","wraith","Rolls-Royce Wraith"],
  ["bentley","continental-gt","Bentley Continental GT"],
  ["bentley","continental-gtc","Bentley Continental GTC"],
  ["bentley","flying-spur","Bentley Flying Spur"],
  ["bentley","bentayga","Bentley Bentayga"],
  ["bugatti","chiron","Bugatti Chiron"],
  ["bugatti","veyron","Bugatti Veyron"],
  ["bugatti","divo","Bugatti Divo"],
  ["porsche","911","Porsche 911"],
  ["porsche","taycan","Porsche Taycan"],
  ["porsche","panamera","Porsche Panamera"],
  ["porsche","cayenne","Porsche Cayenne"],
  ["porsche","macan","Porsche Macan"],
  ["ferrari","sf90","Ferrari SF90"],
  ["ferrari","f8-tributo","Ferrari F8 Tributo"],
  ["ferrari","roma","Ferrari Roma"]
];

async function checkExists(url){
  try{
    const r = await fetch(url, {method:'HEAD'});
    return r.ok;
  }catch(e){ return false; }
}

async function build(){
  const root = document.getElementById('root');
  for (const [brand, model, title] of CARS){
    const block = document.createElement('div');
    block.className = 'car-block';
    block.innerHTML = `<h2>${title} <span style="color:#7ec8e3;font-size:13px">(${brand}/${model})</span></h2>`;
    const grid = document.createElement('div');
    grid.className = 'candidates';

    for (let i=1; i<=12; i++){
      const fname = `cand_${String(i).padStart(2,'0')}.jpg`;
      const url = `/_candidates_v12/${brand}/${model}/${fname}`;
      const exists = await checkExists(url);
      if (!exists) continue;
      const cand = document.createElement('div');
      cand.className = 'cand';
      cand.innerHTML = `
        <img src="${url}" loading="lazy" onerror="this.parentElement.style.display='none'">
        <div class="pick">合格</div>
        <div class="meta"><span class="fname">${fname}</span></div>
      `;
      grid.appendChild(cand);
    }
    block.appendChild(grid);
    root.appendChild(block);
  }
}

build();
</script>
</body>
</html>
