<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Fix 6 Failed v14</title>
<style>
body{background:#0f0f1e;color:#eee;font-family:sans-serif;margin:0;padding:20px}
h1{text-align:center;margin-bottom:10px}
.note{text-align:center;color:#aaa;margin-bottom:20px;font-size:13px}
.car-block{background:#16213e;border-radius:8px;padding:12px;margin-bottom:15px}
.car-block h2{margin:0 0 10px 0;color:#e94560;font-size:16px;border-bottom:1px solid #333;padding-bottom:5px}
.candidates{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.cand{background:#000;border-radius:4px;overflow:hidden}
.cand img{width:100%;height:150px;object-fit:contain;background:#222;display:block}
.cand .meta{padding:4px 6px;font-size:11px;color:#7ec8e3;background:#1a1a2e}
</style></head><body>
<h1>6个不合格车型 - v14候选选择</h1>
<div class="note">从每个车型候选中选一张：正侧视90° + 纯净背景 + 车型正确 + 无水印</div>
<div id="root"></div>
<script>
const FAILED=[["bentley","continental-gtc"],["bentley","flying-spur"],["bentley","bentayga"],["bugatti","veyron"],["bugatti","divo"],["ferrari","f8-tributo"]];
async function ex(u){try{const r=await fetch(u,{method:'HEAD'});return r.ok;}catch(e){return false;}}
async function build(){
  const root=document.getElementById('root');
  for(const [brand,model] of FAILED){
    const block=document.createElement('div');
    block.className='car-block';
    block.innerHTML=`<h2>${brand}/${model}</h2>`;
    const grid=document.createElement('div');
    grid.className='candidates';
    for(let i=1;i<=35;i++){
      const fname=`cand_${String(i).padStart(2,'0')}.jpg`;
      const url=`/_candidates_v14/${brand}/${model}/${fname}`;
      if(!await ex(url))continue;
      const cand=document.createElement('div');
      cand.className='cand';
      cand.innerHTML=`<img src="${url}" loading="lazy" onerror="this.parentElement.style.display='none'"><div class="meta">${fname}</div>`;
      grid.appendChild(cand);
    }
    block.appendChild(grid);
    root.appendChild(block);
  }
}
build();
</script></body></html>
