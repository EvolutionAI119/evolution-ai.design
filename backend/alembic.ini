# Alembic 配置：schema 版本化迁移（Phase 5a 基础设施改造）
# 用法（在 backend/ 目录下执行）：
#   全新数据库（如 PostgreSQL）建表： python -m alembic upgrade head
#   既有 SQLite 开发库（init_db 已建表）补登记： python -m alembic stamp head
# 连接串不在本文件维护，env.py 运行时读取应用配置 settings.DATABASE_URL
[alembic]
script_location = alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# 占位：实际 URL 由 env.py 以 settings.DATABASE_URL 覆盖
sqlalchemy.url =
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
