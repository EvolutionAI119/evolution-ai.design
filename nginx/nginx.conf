# EVOLUTION AI - nginx HTTP 配置（开发/默认栈）
# 生产 TLS 版本见 nginx-tls.conf（docker-compose.prod.yml overlay）

# WebSocket 升级映射（http 上下文）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/app-common.conf;
}
