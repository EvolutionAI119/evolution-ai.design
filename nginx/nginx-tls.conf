# EVOLUTION AI - nginx TLS 配置（docker-compose.prod.yml overlay 挂载）
# 证书签发（首次，certbot standalone，需先停 nginx 释放 80 端口）：
#   docker compose stop nginx
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm certbot \
#       certonly --standalone \
#       -d evolution-ai.design -d www.evolution-ai.design \
#       --email evolution-ai@embodied.systems --agree-tos --no-eff-email
# 证书续期（每 60 天建议执行一次，续期后重载 nginx）：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm certbot renew
#   docker compose exec nginx nginx -s reload

# WebSocket 升级映射（http 上下文）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 80：仅放行 ACME 挑战，其余 301 跳 HTTPS
server {
    listen 80;
    server_name evolution-ai.design www.evolution-ai.design;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name evolution-ai.design www.evolution-ai.design;

    ssl_certificate     /etc/letsencrypt/live/evolution-ai.design/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evolution-ai.design/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/app-common.conf;
}
