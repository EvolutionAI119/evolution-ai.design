# EVOLUTION AI - nginx 公共配置片段（server 块内指令）
# 被 nginx.conf（HTTP）与 nginx-tls.conf（HTTPS）共同 include，
# 保证静态分发 / gzip / API 反代行为在两种部署形态下完全一致

# 模型文件上传上限（后端 MAX_FILE_SIZE=50MB）
client_max_body_size 50m;

# gzip：文本类静态资源与 JSON API 响应
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript
           application/wasm image/svg+xml font/woff2;

# 前端静态资源（宿主机构建产物 dist/）
root /usr/share/nginx/html;
index index.html;

# Vite 带 content hash 的静态资源：长缓存
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# SPA 回退（hash 路由场景保险，避免深层路径 404）
location / {
    try_files $uri $uri/ /index.html;
}

# 后端 API 反代（保留 /api 前缀，与 FastAPI 路由 /api/v1/... 一致）
location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # LLM 代理转发 / 模型生成等长请求
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 健康检查直达后端
location = /health {
    proxy_pass http://backend:8000/health;
}
